openapi: 3.1.0

info:
  title: KubeTower console API
  version: 0.0.0-dev
  summary: The JSON contract between the KubeTower console and its single-page front end.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  description: |
    This document is **hand-written and comes before the handlers**. It is the
    source of truth for the contract; `openapi-typescript` derives the TypeScript
    types from it, and a Go test puts real responses through these schemas. Nothing
    regenerates this file, so the only thing standing between it and fiction is that
    test.

    ## One process, and how paths are derived

    One process serves this API and the front end from the same origin: no separate
    front container, no CORS, one session cookie. Three rules fix every path here,
    and they are rules rather than habits so that a new endpoint has an address
    before anyone argues about it:

    1. **Every JSON endpoint is `/api` + the front-end route that needs it.** The
       page at `/c/prod/overview` is fed by `GET /api/c/prod/overview`. An endpoint
       that serves no page of its own — a preference write, the session — sits
       directly under `/api/`.
    2. **A segment the cluster names never sits beside a segment this console
       names.** A resource kind comes from discovery and can be anything, so it
       lives under a reserved one-letter segment: `/api/c/{cluster}/r/{kind}`.
       Extension routes are mounted apart, at `/x/{cluster}/{key}/`, outside
       `/api`: a top-level segment meets no console wildcard, where a method-less
       route under `/c/{cluster}/`, as a WebSocket upgrade needs, would conflict
       with the console's detail route.
       Without it, a custom resource whose plural is `metrics` shadows the metrics
       panel — silently, because the router prefers the literal and nothing errors.
    3. **Probes are not under `/api/`.** `/healthz` and `/readyz` answer a
       kubelet, not a browser, and must keep their address when this contract
       changes.

    Anything under `/api/` that matches no operation answers **JSON 404**, never the
    front end's `index.html`.

    **Every answer under `/api/` carries `Cache-Control: no-store`**, operations,
    misses and refusals alike: these answers hold Helm values, ConfigMap data and
    environment values, and a browser's disk cache would keep them past the
    sign-out. Set once, at the API's door, and checked over every operation in this
    file by `internal/api/nostore_test.go`.

    ## The envelope is the whole point of this document

    `{"items": []}` is a valid, successful, well-formed answer that type-checks,
    renders, and looks calm. It is also what a cache reporting "no pods" for a
    cluster running 429 of them would send. **Six states are live in this product
    and all six must stay distinguishable: empty, pending, unreadable, absent,
    unreachable, forbidden.** `pending` - nobody has asked yet - is not a failed
    read; `State` carries the argument.

    So a 200 carries an *envelope*, and the envelope — not the HTTP status — says
    which of the six it is. The split is exact:

    - **The HTTP status answers "did this request get an answer?"** No session,
      unknown route, malformed body, refused at the door: 4xx/5xx with a problem
      object and no envelope.
    - **The envelope's `state` answers "what is the answer?"** A request that
      reached a handler and produced a considered answer is **200**, including when
      the considered answer is that the data could not be obtained.

    A 200 with an empty list and a 200 with an unreadable resource are different
    answers and both are 200s, because the request succeeded and the answer is that
    the data did not. `api/errors.md` carries the design and the reasoning behind it.

    **The envelope is a value wrapper, not a response wrapper.** It composes: a page
    payload whose four panels are read from four different places carries four
    envelopes, and one unreadable panel does not make the page unreadable. It is the
    property most easily lost.

    ## WebSocket is outside this document, and is not omitted

    OpenAPI 3.1 cannot describe a socket. **Four channels of this product's surface
    are WebSocket upgrades and are specified in `api/websocket.md`**, with the same
    rigour as the operations here. They are listed under `x-channels` at the root of
    this document so a reader and a generator both see that they exist:

    - `/api/c/{cluster}/ws/terminal` — a shell on the machine running the console,
      scoped to a cluster's context
    - `/api/c/{cluster}/ws/exec` — an interactive shell inside a pod
    - `/api/c/{cluster}/ws/nodeshell` — a shell on a node, after the plan below
    - `/api/ws/assistant` — the assistant channel

    They are registered **without a method**, because an upgrade is not a verb. Any
    table regenerated from this file has to keep that.

    The log stream is the one streaming surface that *is* here, as
    `text/event-stream`: it is framed, so it can carry a state change mid-stream,
    which is the only way the five states above survive a stream.

    ## What this document deliberately does not do

    - **It does not paginate for the client.** No list operation takes a page or a
      cursor: a list answers whole, or not at all. The server reads it from the API
      server in pages of 500, following the continue token, and past its ceiling
      (50 000 rows; 10 000 rows or 100 namespaces for a list narrowed to the
      person's namespaces) answers `unreadable` with `not_supported_here`, asking
      for a namespace, rather than a truncated list. A truncated list is another
      state; inventing one quietly is precisely what the envelope exists to
      prevent. The Overview's `events` and `restarting` are cut to 200 rows and say
      so in `eventsTotal` and `restartingTotal`; a log's earlier lines are a bounded
      read (`before`, `page`).
    - **It does not enumerate a DTO per kind.** One view model draws every kind;
      `ListPage` below is that model, and it is faithful
      rather than lazy. The per-kind work is in what fills `Cell`, and no tool does
      it for us.
    - **It does not describe extension routes.** They mount under
       `/x/{cluster}/{key}/`, outside `/api`, and each carries its own slice of
       contract.

x-channels:
  - id: terminal
    path: /api/c/{cluster}/ws/terminal
    kind: websocket
    spec: ./websocket.md
  - id: exec
    path: /api/c/{cluster}/ws/exec
    kind: websocket
    spec: ./websocket.md
  - id: nodeshell
    path: /api/c/{cluster}/ws/nodeshell
    kind: websocket
    spec: ./websocket.md
  - id: assistant
    path: /api/ws/assistant
    kind: websocket
    spec: ./websocket.md

x-open-decisions:
  - id: confirm-sentence
    status: settled
    settled-on: 2026-09-11
    question: >-
      Does a preview endpoint return the sentence an operator reads before agreeing
      to a destructive action, or only the facts the client phrases itself?
    decision: >-
      The server composes it. A preview endpoint fills `ConfirmationPlan.sentence`,
      derived from the same `facts` it returns in the same call, so the sentence
      cannot disagree with the evidence beside it - which is the failure the other
      answer could not rule out.
    why: >-
      A sentence composed in TypeScript out of perfectly correct facts can still be
      wrong, and no test in the Go suite can see it go wrong. Composing it in the
      function that resolved the facts puts the sentence and its evidence under one
      test.
    modelled-as: >-
      `sentence` stays optional and nullable, so the other answer remains reachable
      without a breaking change - a client must still handle its absence, and an
      endpoint that has not composed one is conforming rather than broken. What is
      settled is which of the two this server does, not what the schema permits.
    see: ./errors.md

servers:
  - url: /
    description: >-
      The same origin as the front end. One process serves both; the session cookie
      is same-origin and never crosses a boundary.

tags:
  - name: session
    description: Signing in, signing out, and what the running profile offers.
  - name: clusters
    description: Which clusters exist and what is enabled on each.
  - name: resources
    description: Lists and details of Kubernetes objects, generic over kind.
  - name: panels
    description: The panels a page or a drawer tab fills in.
  - name: edit
    description: The guarded write door — data values and manifests.
  - name: act
    description: Confirm-then-act. Every destructive verb goes through a plan.
  - name: preferences
    description: The console's own preference file. One cell per request.
  - name: dock
    description: Terminals, log streams and port-forwards.
  - name: probes
    description: Liveness and readiness. Not under /api/, and deliberately so.

# Every operation requires the session cookie unless it overrides this with an
# empty requirement. Stated once here rather than on every operation: a per-
# operation list is a list somebody forgets to extend, and the failure is an
# endpoint that looks protected in review and is not.
security:
  - sessionCookie: []

paths:

  # -------------------------------------------------------------------------
  # Probes. Public, outside /api/, and they must be able to fail.
  # -------------------------------------------------------------------------

  /healthz:
    get:
      operationId: liveness
      # No requirement: a probe carries no cookie, and one answering 401
      # would report the console as dead whenever nobody is signed in.
      security: []
      tags: [probes]
      summary: Liveness. The process is up.
      description: >-
        Public: a probe carries no cookie. It says nothing about whether any cluster
        is reachable - that is `/readyz`, and conflating the two produces a console
        that restarts because a cluster is down.

        On the desktop it answers any Host, as `/readyz` does, but a Host
        that is not `localhost` or a loopback address gets `{"ok":true}` with no
        `detail`: the desktop answers every other path 421 for such a Host.
      responses:
        '200':
          description: The process is serving.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResult' }

  /readyz:
    get:
      operationId: readiness
      # No requirement: a probe carries no cookie, and one answering 401
      # would report the console as dead whenever nobody is signed in.
      security: []
      tags: [probes]
      summary: Readiness. The cluster configuration is readable.
      description: >-
        Public. **This one has to be able to fail**, which is the whole reason it is
        separate: a readiness probe that always says yes is a decoration.

        On the desktop it answers any Host, so an orchestrator can probe it by
        address, but **the reason stays on this machine**: for a Host that is not
        `localhost` or a loopback address, the 200 is `{"ok":true}` and the 503 a
        problem titled "Not ready", each with no `detail`. The detail names the
        kubeconfig's files and what broke them; read it from this machine.
      responses:
        '200':
          description: Configuration readable; the console can serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResult' }
        '503':
          description: >-
            Not ready. The body names what could not be read - except, on the
            desktop, for a Host that is not a loopback name, which gets no detail.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # -------------------------------------------------------------------------
  # The desktop's launch. Public, outside /api/, desktop profile only.
  # -------------------------------------------------------------------------

  /auth/launch:
    get:
      operationId: launchSignIn
      security: []
      tags: [session]
      summary: A window this application opened arrives signed in.
      description: >-
        The application
        mints a **single-use code**, valid one minute and held only as a digest in
        the running process, for each window it opens - its own native window,
        a browser window when there is none, or the window of a second launch
        handed a code through `handoffLaunch`. It puts the code in the window's
        address. This operation spends the code, sets the ordinary HttpOnly
        session cookie and redirects to `/`, so the code leaves the address bar.
        A spent, lapsed, foreign or missing code - or one presented from
        another machine, which spends it - redirects to the sign-in page instead,
        with the same answer whichever it was. **Registered on the desktop
        only, and only where the shared account exists**; never under
        `--incluster`. A navigation, not a fetch. The code never reaches a log
        line, and the response carries `Referrer-Policy: no-referrer`.
      parameters:
        - name: code
          in: query
          required: true
          description: The one-time code. 43 characters of base64url (256 bits).
          schema: { type: string, maxLength: 64 }
      responses:
        '302':
          description: >-
            To `/` with the session cookie set - a session whose `method` is
            `launch` - or to the sign-in page with none.
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              description: The session cookie, as `login` sets it, when the code was good.
              schema: { type: string }

  /auth/handoff:
    post:
      operationId: handoffLaunch
      security: []
      tags: [session]
      summary: A second launch and the running instance prove themselves, and the launch is handed a code.
      description: >-
        A second launch of the application, or `kubetower
        open`, reads the **launcher secret** from the state directory (a file,
        0600, written by the first instance), and the two prove to each other
        that they hold it, in two calls carrying the `X-KubeTower-Launcher`
        header. **hello**: the launch sends a fresh client nonce; the instance
        answers a fresh server nonce (single use, thirty seconds, the oldest
        of 64 evicted) and an HMAC
        of its own address and both nonces, keyed with the secret. The launch
        checks that HMAC and stops if it is wrong, having sent nothing a
        squatter on the port could reuse. **prove**: the launch sends its own
        HMAC over the address, both nonces and `native`; the instance spends
        the server nonce, checks it, and answers a one-time code for
        `launchSignIn`, **sealed** with AES-256-GCM under a key derived from
        the secret and both nonces. A captured prove names a server nonce
        already spent, so it is refused everywhere. **The secret itself is
        never sent.** The request is refused before it gets here when its Host
        is not a loopback name. **Registered only on the loopback desktop.**
        Not for browsers: a cross-origin script cannot send the header without
        a preflight this server never answers.
      parameters:
        - name: X-KubeTower-Launcher
          in: header
          required: true
          description: >-
            `v2.hello.<client nonce>`, or `v2.prove.<client nonce>.<server
            nonce>.<hmac>`. Nonces are 32 lower-case hex characters.
          schema: { type: string, maxLength: 256 }
        - name: native
          in: query
          required: false
          description: >-
            On prove, `1` when the code is for a native window, whose session is
            then the one a later presence check recognizes.
            Covered by the launch's HMAC.
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: >-
            After hello, `challenge` and `proof` (the instance's HMAC). After
            prove, `sealed`: the code, AES-256-GCM, base64url.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  challenge: { type: string }
                  proof: { type: string }
                  sealed: { type: string }
        '403':
          description: >-
            Not from this machine, or not a step of the exchange with this
            instance's launcher secret and a server nonce it issued. Nothing in
            the body.
        '405':
          description: Not a POST.
        '503':
          description: >-
            No nonce could be drawn, or no code could be minted or sealed.
            Nothing in the body. A launch reports it as a busy instance, never
            as an impostor. At most 64 hellos wait for their prove; one more
            evicts the oldest rather than being refused.

  # -------------------------------------------------------------------------
  # Session
  # -------------------------------------------------------------------------

  /api/auth/login:
    post:
      operationId: login
      tags: [session]
      summary: Exchange a credential for a session cookie.
      description: >-
        Public. On success the response sets an HttpOnly, same-origin session
        cookie. **No token is ever readable by the browser** and none is returned in
        the body: one cross-site scripting flaw must not be able to exfiltrate a
        credential that reaches a cluster.


        **Absent where no password is offered**: with an identity provider
        configured and the shared account not kept, and on the loopback
        desktop, where the window arrives signed in through `launchSignIn` and
        no password exists unless `KT_PASSWORD_HASH` sets one. There this
        operation is not registered, so it
        answers the contract's 404 exactly as an address that never existed
        does. `getSignInMethods` says what a console offers.
      parameters:
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '204':
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: HttpOnly and SameSite=Lax; Secure where single sign-on is configured with an https redirect URL.
              schema: { type: string }
        '401':
          description: >-
            Refused. The body never says which half was wrong - naming the account
            turns a login form into an account-existence oracle.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: |
            Too many password attempts: from this client (a per-client budget,
            kept only where the address names one client), or for the whole
            process (a bounded queue in front of the password check).
            `Retry-After` says when to try again. A cookie-issuing login endpoint
            with no throttle is a credential-stuffing target on a console that
            reaches production clusters.

  /api/auth/logout:
    post:
      operationId: logout
      tags: [session]
      summary: End the session.
      description: >-
        Public, because ending a session must not require one. Answers 204 whether
        or not a session was live: a logout that fails on an already-expired session
        leaves a front end unable to reach the login screen. **The one exception is
        a sign-out the session store did not record**: the answer is 503
        `session_store_unreachable`, because the session is still live, and the
        cookie is **not** cleared, so the browser can sign out again once the store
        answers. Clearing it would leave a browser that looks signed out and a
        session that is not, with the cookie a retry needs deleted.
      parameters:
        - $ref: '#/components/parameters/RequestMarker'
      responses:
        '204':
          description: The session cookie is cleared.
        '503':
          description: >-
            The store did not record the sign-out, so the session is still live. The
            cookie is kept, and a retry once the store answers signs it out.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/auth/methods:
    get:
      operationId: getSignInMethods
      security: []
      tags: [session]
      summary: How a person may sign in here, asked before anybody has.
      description: >-
        Public, because the sign-in page needs it before there is a session.
        Whether the shared password is offered, and the identity provider's
        state: `off` (none configured), `pending` (not answered yet), `ready`, or
        `unavailable` with a sentence saying why. **An unreachable provider does not
        take the console down** - it is this state, and the page says so
        rather than drawing a button that does nothing.
      responses:
        '200':
          description: The sign-in methods, now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInMethods' }

  /api/auth/oidc/start:
    get:
      operationId: startSingleSignOn
      security: []
      tags: [session]
      summary: Send the browser to the identity provider.
      description: >-
        A **navigation**, not a fetch - an anchor's `href`, so it carries no marker
        and needs none. Registered only where an identity provider is configured.
        Answers with a redirect to the provider's authorization endpoint, carrying
        `state`, a `nonce` and a PKCE challenge, and sets an HttpOnly cookie that
        binds `state` to this browser. Where the provider is not answering, or the
        request arrived on another origin than the configured redirect URL, the
        redirect goes back to the sign-in page or to that origin instead.
      parameters:
        - name: next
          in: query
          required: false
          description: Where to land after signing in. Reduced to a path on this server.
          schema: { type: string, maxLength: 2048 }
      responses:
        '302':
          description: To the identity provider, or back to the sign-in page saying why not.
          headers:
            Location:
              schema: { type: string }

  /api/auth/oidc/callback:
    get:
      operationId: finishSingleSignOn
      security: []
      tags: [session]
      summary: The redirect URI. Verify what came back and open a session.
      description: >-
        Where the identity provider sends the browser back. Registered only where one
        is configured. The console verifies the ID token itself - signature against
        the provider's key set, `iss`, `aud`, `exp`/`nbf`, and the nonce it issued -
        after checking `state` against this browser's cookie and exchanging the code
        with its PKCE verifier. **No token is kept and none reaches the browser**:
        what is kept is the person and their groups, in a server-side session whose
        id travels in the same HttpOnly cookie as the password's. A refusal
        redirects to the sign-in page with a fixed reason code, never the
        provider's own words.
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 4096 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - name: error
          in: query
          required: false
          description: The provider's refusal code (RFC 6749 §4.1.2.1). Logged, never shown.
          schema: { type: string, maxLength: 256 }
      responses:
        '303':
          description: >-
            Signed in, with the session cookie set, to where the sign-in started - or
            not signed in, to the sign-in page with `sso` set to `unavailable`,
            `refused`, `expired`, `failed`, `unnamed` or `store` - the last being
            the console's own session store not answering, which is not the
            provider's fault and is said as such.
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }

  /api/session:
    get:
      operationId: getSession
      tags: [session]
      summary: Who is signed in, and until when.
      description: >-
        Both session bounds are here because the front end needs both: an idle bound
        it can push back by acting, and an absolute bound it cannot. A console that
        shows neither signs the operator out mid-sentence.
      responses:
        '200':
          description: The live session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/capabilities:
    get:
      operationId: getCapabilities
      tags: [session]
      summary: What the running profile offers.
      description: |
        The front end hides what the profile does not offer. **Hiding is cosmetic;
        the server refusing is the enforcement** - every capability that is false
        here is also refused at its own endpoint, or the permission model is made of
        CSS.
      responses:
        '200':
          description: The profile's capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # -------------------------------------------------------------------------
  # Clusters, navigation, extensions
  # -------------------------------------------------------------------------

  /api/clusters:
    get:
      operationId: listClusters
      tags: [clusters]
      summary: Every cluster the console is configured for.
      description: >-
        Feeds both the chooser and the rail. Each entry carries its **own** state -
        one unreachable cluster leaves the other nine `ok`, which is why reachability
        is per item and not only on the envelope. The envelope's own state covers
        reading the configuration: a `KUBECONFIG` naming five files, one of which
        cannot be parsed, is `unreadable` here, and that is a different fact from
        five clusters that are all down.
      responses:
        '200':
          description: The configured clusters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/c/{cluster}/probe:
    post:
      operationId: probeCluster
      tags: [clusters]
      summary: Ask this one cluster again, now, and answer its entry.
      description: >-
        The overview's **Refresh** on a cluster the probe found unreachable.
        It runs the probe against this cluster only,
        skipping the cache and the background backoff, and answers the entry
        exactly as `listClusters` draws it - so the page and the rail read one
        verdict. `/api/health?force=1` also forces a probe, but of every
        cluster, which can take ten seconds against fourteen contexts. Slow by
        construction when the
        cluster is down - the probe's own bound is ten seconds - so a client
        that sends it owes the operator a sign that it is working. A probe
        that ran and found the cluster down is `ok`, carrying that entry: the
        request succeeded, and `data.state` is what it found.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/RequestMarker'
      responses:
        '200':
          description: This cluster's entry, freshly probed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/nav:
    get:
      operationId: getNav
      tags: [clusters]
      summary: The menu for this cluster, including custom resources.
      description: >-
        The custom-resource groups come from discovery, so this is a cluster read and
        carries an envelope: a cluster whose discovery is refused shows its built-in
        menu and says why the rest is missing, rather than showing a menu that is
        quietly short.

        The first group is `cluster`, and its first item is **Overview**, linking to
        the bare `/c/{cluster}` - the dashboard, the same route the rail tile opens.
        The ungrouped kinds and Helm follow it. The menu is composed here and only
        here, so a client never inserts an entry of its own.
      parameters:
        - $ref: '#/components/parameters/Cluster'
      responses:
        '200':
          description: The menu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NavEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/nav/{group}:
    get:
      operationId: getNavGroup
      tags: [clusters]
      summary: The contents of a menu group `getNav` marked `deferred`.
      description: >-
        The custom resource heading, filled. `getNav` answers it with `deferred:
        true` and no items because filling it lists the cluster's
        CustomResourceDefinitions - 23.7 MB and 603-668 ms on one production
        cluster - and the heading is closed on every page that is not one of its
        own. A client asks for this when the disclosure opens, and on arrival at a
        page that is already inside it.

        Three answers, and they are three because a cluster that cannot be asked, a
        cluster serving no custom resource kinds, and a cluster whose kinds could
        not be listed are three different facts about three different clusters. The
        first is the envelope's own failure arm, with a code and a remedy. The other
        two are `ok` with an empty `items` and a `note` saying which - the same
        bargain `getNav` strikes for the menu as a whole, because the heading stays
        in its place in the menu either way.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - name: group
          in: path
          required: true
          description: >-
            The `key` of a group `getNav` returned with `deferred: true`. Any other
            key is `absent` - the client asked for a group that is not fetched
            separately, which is a fault in this product rather than a fact about
            the cluster, and saying so is how it gets found. `occupancy` is not a
            group key: that address is `getNavOccupancy`.
          schema: { type: string, minLength: 1, maxLength: 253 }
      responses:
        '200':
          description: The group, filled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NavGroupEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/nav/occupancy:
    get:
      operationId: getNavOccupancy
      tags: [clusters]
      summary: Which of the menu's kinds hold an object the person asking may see.
      description: >-
        What the kinds column hides by default: a kind or a
        custom resource kind with no object the person may see. Its own
        operation, so `getNav` stays the cheap read it is: this one lists, and a
        client asks for it beside the menu and draws the menu without waiting.

        **Keyed by the kind's slug**, the last path segment of the menu entry's
        `href` (`/c/{cluster}/{slug}`): `pods`, a project kind's or a custom
        resource kind's `plural.group`. Every kind the menu offers, the
        deferred Custom Resources heading's included; never Overview, Helm, the
        port-forwards or an extension's page, which are not kinds.

        **Unknown is never zero.** `unknown` is a count that could not be read -
        refused, unreachable, past this console's bounds - and a client never
        hides a kind on it. A kind the menu draws and this answer does not name
        is `unknown` too, and drawn.

        How it is read: whether a kind holds any object at all is asked once per
        cluster with the console's own credentials (one metadata-only list of
        at most one row, held a few minutes and shared by every person);
        `none` there is `none` for everybody. Where there is one, the person is
        reviewed for the list across every namespace (`some`), and where that is
        refused, for each namespace the console knows of, each allowed namespace
        then asked for one row the same way. A namespace that holds objects the
        person may not list does not make the kind `some` for them.
      parameters:
        - $ref: '#/components/parameters/Cluster'
      responses:
        '200':
          description: The kinds, each with its occupancy for the person asking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NavOccupancyEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/extensions:
    get:
      operationId: listExtensions
      tags: [clusters]
      summary: Which extensions are enabled on this cluster.
      description: >-
        Enablement is per cluster. **Every extension is off until it is turned
        on** on that cluster, on every profile, and the choice is kept. Every extension the build
        carries is listed - nothing it does not carry - each with whether the
        person asking may turn it on or off here (`writable`) and, where not,
        why (`locked`, `reason`). On the desktop and in a container the
        deployment's `KT_EXTRAS` pins an extension on or off for every cluster
        (`pinned`). **Under the `shared` profile `KT_EXTRAS` is the chart's
        values**: it names the extensions this installation may turn on and pins
        nothing; one it does not name is listed, off, `locked: values`, and every
        write about it is refused; one it names is turned on or off by a person
        holding the verb `use` on `extras.kubetower.dev/<key>`, reviewed for
        that person. **The same `use` is what reaches an extension that is on**
        under the `shared` profile: its routes answer a person without it 403
        `rbac_denied`, naming the permission, and 503 `access_unreviewable`
        where the review could not be made, and the menu leaves it out for
        them. On the desktop and in a container nothing is reviewed. Each row carries the extension's own words and its
        settings, which is what the Settings page's Extra tab draws. The front
        end shows only what is listed here as enabled; **the server-side gate is
        the enforcement**. A route that is not enabled answers 404 - not 401,
        which would blame the session, and not 403, which would confirm that the
        feature exists and is merely withheld.
      parameters:
        - $ref: '#/components/parameters/Cluster'
      responses:
        '200':
          description: The extensions this build carries, each with its state on this cluster.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/extensions/suggestions:
    get:
      operationId: listExtensionSuggestions
      tags: [clusters]
      summary: Which extensions that are off here this cluster gives a reason to turn on.
      description: >-
        The banner's question. An extension that implements
        `extension.Suggester` is asked, for the person signed in, whether this
        cluster runs what it reads - and only where the answer can be acted on:
        it is off on this cluster and the person may turn it on there - the
        listing's `writable`: nothing pins it, the chart's values allow it under
        the `shared` profile, and the person holds `use` on it there.
        Any extension that implements the interface is asked. What it reads
        to answer is reviewed for the person, so somebody who may not list what
        it looks for is suggested nothing. An extension whose answer failed is
        left out rather than reported: a suggestion that could not be computed is
        not a suggestion. Registered exactly where `setExtensionEnabled` is.
      parameters:
        - $ref: '#/components/parameters/Cluster'
      responses:
        '200':
          description: The extensions to suggest, possibly none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionSuggestionListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/extensions/{key}:
    put:
      operationId: setExtensionEnabled
      tags: [clusters, preferences]
      summary: Enable or disable one extension on one cluster.
      description: >-
        **One extension, one cluster, one request.** The same argument as the column
        preferences below: a body carrying the whole map lets a client with a stale
        map re-assert every other extension as a side effect of ticking one.
        Registered on every profile with one replica;
        not where several replicas share one address, nor under the `shared`
        profile where the state directory does not survive a restart
        (`KT_STATE_PERSISTENT=false`). **Under the `shared` profile it is
        reviewed** as the verb `use` on `extras.kubetower.dev/<key>` for the
        person signed in - refused (403 `rbac_denied`) without it, 503 where
        the review could not be made or the audit record not written - and
        recorded in the audit log: who, which extension, which cluster, on or
        off. An extension the chart's values (`KT_EXTRAS`) do not name is
        refused (403 `not_available_in_this_profile`), as is, on the desktop or
        in a container, one the deployment pins (400).
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - name: key
          in: path
          required: true
          description: The extension's stable key, as returned by listExtensions.
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]$"
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '204': { description: Written. }
        # An extension KT_EXTRAS pins, on the desktop or in a container.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        # No `use` on the extension, or one the chart's values do not name.
        '403': { $ref: '#/components/responses/Refused' }
        # Also a key this build carries no extension for: well formed, naming
        # nothing here, which is not a malformed request.
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/NotSaved' }
        '503': { $ref: '#/components/responses/CouldNotAct' }

  /api/c/{cluster}/extensions/{key}/settings/{setting}:
    put:
      operationId: setExtensionSetting
      tags: [clusters, preferences]
      summary: Write one setting of one extension on one cluster.
      description: >-
        One of the settings an extension offers (`Extension.settings`), on one
        cluster, one request - for the reason `setExtensionEnabled` gives. Kept
        per cluster beside the switch. Registered exactly where that write is,
        and **on its terms**: whoever may turn an extension on may configure it
        so under the `shared` profile it is reviewed as `use` on the
        extension and recorded, and refused for an extension the chart's values
        do not name. Accepted for an extension that is off or pinned: a pin
        decides whether the page is there, a setting how it is drawn. Refused
        (400) for a setting the deployment's `KT_EXTRA_SETTINGS` pins
        (`ExtensionSetting.pinned`), with a sentence naming it.

        A checkbox (`kind: bool`) is written with `value`, a line of text
        (`kind: text`) with `text`: exactly one of them,
        and the other kind is refused (400). An empty `text` returns the
        setting to not set. A text the extension's own check refuses, and one
        whose environment variable (`ExtensionSetting.env`) is set, are refused
        (400) with a sentence. A text setting is written on the `local` profile
        only: under the `shared` profile it is refused (403,
        `not_available_in_this_profile`), the chart's values deciding it.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - name: key
          in: path
          required: true
          description: The extension's stable key, as returned by listExtensions.
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]$"
        - name: setting
          in: path
          required: true
          description: The setting's key, as `Extension.settings` lists it.
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]$"
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Exactly one of `value` and `text`, by the setting's kind.
              properties:
                value: { type: boolean }
                text: { type: string, maxLength: 253 }
      responses:
        '204': { description: Written. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        # A setting KT_EXTRA_SETTINGS pins: the deployment decided it.
        '400': { $ref: '#/components/responses/BadRequest' }
        # No `use` on the extension, or one the chart's values do not name.
        '403': { $ref: '#/components/responses/Refused' }
        # A key this build carries no extension for, or a setting it does not
        # offer: well formed, naming nothing here.
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/NotSaved' }
        '503': { $ref: '#/components/responses/CouldNotAct' }

  # -------------------------------------------------------------------------
  # Settings
  # -------------------------------------------------------------------------

  /api/settings:
    get:
      operationId: getSettings
      tags: [session]
      summary: The console's settings, including the first-run information tab.
      description: >-
        Not enveloped. Settings are this process's own file, not a cluster read: they
        cannot be `unreachable`, and a file the console cannot read at all is a broken
        console - a 500 with a problem object, not a state.
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      operationId: saveSettings
      tags: [session]
      summary: Write the general settings.
      description: >-
        **Not registered where the state directory is not persistent**
        (`info.statePersistent: false`). The three settings this writes are the
        archive's, and both the archive and the file they are kept in live in that
        directory: a retention of seven days on a disk wiped at the next restart is
        a control that lies. The address then answers what an address that never
        existed answers - the contract's 404 - rather than a handler that refuses.
      parameters:
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsWrite' }
      responses:
        '200':
          description: Written. The settings as they now stand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }

  /api/settings/nodeshell:
    put:
      operationId: saveNodeShellSettings
      tags: [session]
      summary: Write the node-shell settings.
      description: >-
        Its own endpoint rather than a field of the settings object, because it
        carries an image reference that is validated differently from everything
        else on that page.

        **Registered only where the node-shell channel is, and only where the state
        directory is persistent** (`info.statePersistent`): the image is kept in that
        directory, so without it the setting would be gone at the next restart.
        `NodeShellSettings.available` is false in both cases and the page draws no
        section.
      parameters:
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeShellSettings' }
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeShellSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }

  /api/settings/clear:
    post:
      operationId: clearState
      tags: [session, act]
      summary: Discard the console's stored state.
      description: >-
        Destructive, and the one destructive act with no cluster behind it - so it
        takes a plan token like every other, obtained with `preview: true`. What is
        being agreed to is the loss of preferences rather than of objects, and that
        sentence is still not the front end's to invent unilaterally.

        **Not registered where the state directory is not persistent**
        (`info.statePersistent: false`). What this discards is what that directory
        keeps, and there it keeps nothing: no archive is opened, and the preference
        scopes are not wired to this contract on any profile. The address then
        answers the contract's 404, like the two settings writes, and the page
        draws no control. **Nor under the server profile** (`mode: shared`), on
        one replica or several: emptying the archive there is every person's
        loss, so the deployment decides it.
      parameters:
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClearRequest' }
      responses:
        '200':
          description: Either the plan to confirm, or the outcome of clearing.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ConfirmationPlan'
                  - $ref: '#/components/schemas/ActOutcome'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/PlanStale' }

  /api/settings/update-check:
    post:
      operationId: checkUpdates
      tags: [session]
      summary: Ask GitHub now whether a newer release exists.
      description: >-
        Settings › Infos' **Check now**: the update check of
        `info.update`, run past its cache - an answer kept for a day is not the
        answer to "ask now". It answers once the check has settled, with the same
        object `GET /api/settings` carries in `info.update`, `install` included
        where the desktop installs: the page writes this answer over its update
        line, and one without `install` lost a ready download's Install (#96).

        The switches still hold: a check that is off (`KT_UPDATE_CHECK`), or a
        development build, makes no request however it is asked and answers `off`
        or `notApplicable`. Checks are taken one at a time, so a press during the
        startup check waits for it and then asks once more.

        **Not registered under the server profile** (`mode: shared`), which never
        checks: a console in a cluster is upgraded by its image tag. The address
        then answers the contract's 404 and the page draws no control.
      parameters:
        - $ref: '#/components/parameters/RequestMarker'
      responses:
        '200':
          description: The settled answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsUpdate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }

  /api/settings/update:
    get:
      operationId: getUpdateInstall
      tags: [session]
      summary: Where the desktop's update download and install stands.
      description: >-
        Read while a download runs, for its progress. **Desktop only**: not
        registered under the server profile, in a container, or where nothing
        installs, so the address answers the contract's 404 and the page draws
        no control.
      responses:
        '200':
          description: The update's state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInstall' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      operationId: setUpdateInstall
      tags: [session]
      summary: Turn "Install updates automatically" on or off, and say when it installs.
      description: >-
        On, a newer release is downloaded, verified and installed at the moment
        `when` names. Off, Download and Install stay by hand. Kept in the state
        directory. A `when` other than `quit` or `now` is refused (400). A write
        that took effect and could not be saved answers `not_saved`.
      parameters:
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInstallWrite' }
      responses:
        '200':
          description: The update's state with the setting applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInstall' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }

  /api/settings/update/download:
    post:
      operationId: downloadUpdate
      tags: [session]
      summary: The first click - download and verify the newer release.
      description: |
        Starts fetching the latest release's asset for this installation and
        answers at once; `GET /api/settings/update` follows it. **Nothing is
        kept that the release's signed `checksums.txt` does not vouch for**: the
        Ed25519 signature is checked first, then the asset's sha256, and a file
        failing either is deleted. Never a downgrade, never a development
        build. Refused (409) when this installation cannot be updated, or while
        a download or install runs.
      parameters:
        - $ref: '#/components/parameters/RequestMarker'
      responses:
        '200':
          description: The download has started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInstall' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/settings/update/install:
    post:
      operationId: installUpdate
      tags: [session]
      summary: The second click - install the verified download and restart.
      description: |
        Checks the downloaded file's hash and the version again, then hands it to
        this platform's installer, which replaces KubeTower and restarts it: the
        terminals and port-forwards counted in `ends` close. Refused (409)
        before a verified download.
      parameters:
        - $ref: '#/components/parameters/RequestMarker'
      responses:
        '200':
          description: The install has started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInstall' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/settings/update/open-folder:
    post:
      operationId: openUpdateFolder
      tags: [session]
      summary: Show the verified file where the installation cannot be written.
      description: |
        In the `manual` phase - the installer found the installation's folder
        not writable - opens the folder holding the verified file in this
        machine's file manager. Refused (409) in any other phase.
      parameters:
        - $ref: '#/components/parameters/RequestMarker'
      responses:
        '200':
          description: The folder was opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInstall' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/health:
    get:
      operationId: getHealth
      tags: [panels]
      summary: The console's own diagnosis, per cluster and per dependency.
      description: |
        **This report exists precisely to say which of the six states is true**, so
        every check is an envelope of its own and the report is never a single
        verdict. A check answering `absent` - the thing that would serve it is not
        installed - is a different sentence from one answering `unreachable`, and
        the whole value of the report is that it refuses to merge them.

        The console has no page drawing it whole: the home reads its `notices` and
        puts each on the cluster cards it concerns.

        **A plain read answers out of what is already known; `force` runs a round.**
        Without the parameter this endpoint serves the probe's last snapshot, which
        is what makes reading it free - probing every context first costs one
        cluster timeout, about ten seconds against fourteen contexts.

        `force` asks every cluster again. The console does not send it; a cluster's
        own Refresh is `POST /api/c/{cluster}/probe`.
      parameters:
        - name: force
          in: query
          required: false
          description: >-
            Ask every cluster again rather than serving the last round. Slow by
            construction - a forced round against fourteen unreachable contexts
            takes about ten seconds - so a client that sends it owes the person an
            indication that it is working.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The diagnosis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # -------------------------------------------------------------------------
  # Resources. Everything the cluster names lives under /r/.
  # -------------------------------------------------------------------------

  /api/c/{cluster}/namespaces:
    get:
      operationId: listNamespaces
      tags: [resources]
      summary: The namespaces of one cluster, for the selector every list carries.
      description: |
        Every list page has a namespace selector, and this is the endpoint behind
        it. It is its own endpoint rather than a member of `ListPage` because the answer
        is the same for every kind on a cluster and is cached, while a list payload
        is refetched on an interval. Folding it in would re-send thirty names beside
        four hundred rows every few seconds.

        **Four answers, not two, and the envelope carries all four.** A cluster with
        nothing in it (`empty`); a cluster that could not be asked (`unreadable` or
        `forbidden`); a cluster nobody has asked yet (`pending`); and a list kept
        from **before** the cluster stopped answering, which is `ok` with
        `reason.code: stale_reading`. The first two must never render alike, because
        they are opposites: a
        Kubernetes cluster always has `default` and `kube-system`, so "no namespaces"
        describes no cluster that exists, while "could not be asked" describes a very
        ordinary one - a namespace-scoped identity, a lapsed session, an API server
        five seconds slow.
      parameters:
        - $ref: '#/components/parameters/Cluster'
      responses:
        '200':
          description: The namespaces.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamespaceListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/r/{kind}:
    get:
      operationId: listResources
      tags: [resources]
      summary: A list of one kind, in the shape the grid draws.
      description: |
        One endpoint, and the front end refetches it.

        **The payload is generic over kind on purpose.** One view model draws every
        kind, so `ListPage` is faithful rather than a shortcut. What is per-kind is
        what fills the cells.

        Generic reads through the dynamic client are permitted for `get` and `list`
        only, and `kind` is validated against discovery before anything is fetched.
        There is no generic proxy anywhere in this contract: an endpoint that let the
        browser choose the request would move the decision out of the process that
        holds the credentials.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Namespace'
        - name: selector
          in: query
          required: false
          description: >-
            A label selector in kubectl's syntax (`app=web`, `tier in (a,b)`,
            `!canary`), handed to the API server as the list's `labelSelector`.
            One that does not parse is answered 400 `invalid_selector`, never ignored: a list read
            without it would show every row as if each matched.
          schema: { type: string, maxLength: 1024 }
        - name: search
          in: query
          required: false
          description: >-
            A free-text search: a substring of what a row shows and of its label
            keys and values, case-insensitively. The keys a controller stamps on
            every object it makes (`pod-template-hash`, `controller-revision-hash`
            and the like) are not matched by name; their values are. Plain text and nothing else - `node:x` is the
            substring `node:x`; a column's exact value is the `filter` parameter.
            Sent as a query parameter and never interpolated into a path: a name
            containing an ampersand must not be able to send the request somewhere
            else.
          schema: { type: string, maxLength: 256 }
        - name: filter
          in: query
          required: false
          explode: true
          description: |
            **Repeatable.** `<column label>:<value>` - the rows whose cell in that
            column equals the value, case-insensitively on both sides, split at the
            first colon. `?filter=Node:worker-2&filter=Node:worker-3&filter=Status:Running`
            is the running pods on either node: several values of one column are
            OR-ed, several columns AND-ed, and the whole is AND-ed with `search`.

            It is what the filter control writes. It is a parameter of its own
            rather than a grammar typed into `search`, which nobody would discover,
            could not address a label with a space in it, and would make one box do
            two jobs.

            Only a column whose `filterable` is true can be filtered. A filter naming
            any other column, or not shaped `<column>:<value>`, narrows nothing and
            is absent from the page's `filters` echo, so a client draws no chip for
            it. Server-side like `search`, so the address stays shareable and
            `count` stays the server's.
          schema:
            type: array
            maxItems: 64
            items: { type: string, maxLength: 512 }
      responses:
        '200':
          description: >-
            The grid. `state` distinguishes a namespace with nothing in it from a
            kind that is not installed, from a cluster that could not be asked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/r/{kind}/{name}:
    get:
      operationId: getClusterScopedResource
      tags: [resources]
      summary: One cluster-scoped object, in the shape the drawer draws.
      description: >-
        Two forms exist because a kind is either namespaced or it is not, and the
        list payload says which in `namespaced`. The front end does not guess: it
        reads the flag it was given with the list.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: The object.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/r/{kind}/{namespace}/{name}:
    get:
      operationId: getNamespacedResource
      tags: [resources]
      summary: One namespaced object, in the shape the drawer draws.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/NamespacePath'
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: The object.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/helm:
    get:
      operationId: listHelmReleases
      tags: [resources]
      summary: The Helm releases on this cluster.
      description: >-
        Helm is core and has no gate: a release is an ordinary Secret and the console
        reads it directly. A release whose payload cannot be decoded is `unreadable`
        at the item, not missing from the list - it exists, and pretending otherwise
        is how a console reports nine releases on a cluster that has ten.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/Namespace'
      responses:
        '200':
          description: The releases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelmListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/helm/{namespace}/{name}:
    get:
      operationId: getHelmRelease
      tags: [resources]
      summary: One Helm release.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/NamespacePath'
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: The release.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelmReleaseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/helm/{namespace}/{name}/values:
    get:
      operationId: revealHelmValues
      tags: [resources]
      summary: Reveal the values supplied to one revision of a Helm release.
      description: |
        **The release page's values arrive through this door and no other.**
        Supplied values routinely carry passwords and tokens - a chart's
        `auth.password`, an `existingSecret`'s inline twin - so they are not part
        of `getHelmRelease`, which every page view reads, but a reveal, like a
        Secret's key on `/env`:

        - **Reviewed for the person before anything is read**: `get` on the
          Secret Helm stores that revision in (`sh.helm.release.v1.<name>.v<revision>`),
          by name; and the release's history is read under the person's own
          `list secrets` review in the namespace, as the page itself is. A
          refusal of either is `forbidden` (or `unreadable` with
          `access_unreviewable`), and nothing is read.
        - **Recorded** whichever way it goes: an audit record, act `reveal`,
          naming who, the cluster, the namespace, that Secret and the key
          `values` - the attempt before the read and the outcome after -
          and a `reveal:` line in the process log. Under the server profile a
          reveal whose attempt cannot be recorded is refused.
        - `Cache-Control: no-store`, as every answer under `/api/`.

        `revision` is the one the page was drawn from, and it is required: the
        record names the revision **before** the read, so the request has to.
        A release that has moved on since is answered `absent` - the values of
        a revision that is no longer current are not what the page was showing.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/NamespacePath'
        - $ref: '#/components/parameters/Name'
        - name: revision
          in: query
          required: true
          description: The release's current revision, as `HelmReleaseDetail.release.revision` said it.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The values, or why they are not here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelmValuesEnvelope' }
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
        '400':
          description: No `revision`, or one that is not a positive whole number.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/helm/{namespace}/{name}/notes:
    get:
      operationId: revealHelmNotes
      tags: [resources]
      summary: Reveal the notes Helm rendered for one revision of a release.
      description: |
        **The release page's notes arrive through this door and no other.**
        Charts print a generated admin password or a token in their
        `NOTES.txt`, so the rendered notes are the same kind of read as the
        values, and are not part of `getHelmRelease`. It is
        `revealHelmValues`' door, under the key `notes`:

        - **Reviewed for the person before anything is read**: `get` on the
          Secret Helm stores that revision in (`sh.helm.release.v1.<name>.v<revision>`),
          by name, and the history under the person's own `list secrets`
          review in the namespace. A refusal is `forbidden` (or `unreadable`
          with `access_unreviewable`), and nothing is read.
        - **Recorded** whichever way it goes: an audit record, act `reveal`,
          naming who, the cluster, the namespace, that Secret and the key
          `notes` - the attempt before the read and the outcome after -
          and a `reveal:` line in the process log. Under the server profile a
          reveal whose attempt cannot be recorded is refused.
        - `Cache-Control: no-store`.

        The notes are what Helm rendered, unredacted, as `helm get notes`
        shows them. `ok` with an empty `notes` means the chart ships none; a
        current revision whose stored document would not decode is
        `unreadable`, never an empty answer. A release that has moved on past
        `revision` is `absent`.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/NamespacePath'
        - $ref: '#/components/parameters/Name'
        - name: revision
          in: query
          required: true
          description: The release's current revision, as `HelmReleaseDetail.release.revision` said it.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The notes, or why they are not here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelmNotesEnvelope' }
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
        '400':
          description: No `revision`, or one that is not a positive whole number.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------------------
  # Panels. Each is a page's own payload or a drawer tab that loads late.
  # -------------------------------------------------------------------------

  /api/c/{cluster}/overview:
    get:
      operationId: getOverview
      tags: [panels]
      summary: The cluster dashboard.
      description: >-
        Composed of panels read from different places, so the panels are enveloped
        individually: a cluster with no metrics source installed shows its capacity
        and says `absent` for usage, rather than drawing usage as zero. Refetched on
        a short interval by the page that owns it.
      parameters:
        - $ref: '#/components/parameters/Cluster'
      responses:
        '200':
          description: The dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverviewEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/metrics:
    get:
      operationId: getMetricsPanel
      tags: [panels]
      summary: The metrics panel for one object, at one zoom level.
      description: >-
        The zoomed chart is the same data over a different window, so it is a
        parameter here and not an endpoint:
        `range` widens the window and `points` caps the resolution. Absent a metrics
        source, this answers `absent` and the front end says so - it does not draw a
        flat line at zero.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/KindQuery'
        - $ref: '#/components/parameters/NamespaceQuery'
        - $ref: '#/components/parameters/NameQuery'
        - name: range
          in: query
          required: false
          description: The window to read, as a duration. Default is the panel's own.
          schema: { type: string, pattern: "^[0-9]{1,4}[mhd]$", default: "1h" }
        - name: points
          in: query
          required: false
          schema: { type: integer, minimum: 10, maximum: 2000, default: 120 }
      responses:
        '200':
          description: The panel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/changes:
    get:
      operationId: getChangesPanel
      tags: [panels]
      summary: Who last wrote which part of this object.
      description: |
        This returns the object's **field managers' record**, answered from
        `internal/changes`: the entries come back as `kubelet Update (status)`.
        It is not what this console's own archive holds about one object.

        The archive is real, it is running, and no operation exposes it: an
        `/archive` operation is deliberately left unbuilt rather than half-built.
        The name is free and the shape is settled - its entries would be the same
        `{at, summary}` row.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/KindQuery'
        - $ref: '#/components/parameters/NamespaceQuery'
        - $ref: '#/components/parameters/NameQuery'
      responses:
        '200':
          description: The panel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangesEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/env:
    get:
      operationId: revealEnvValue
      tags: [panels]
      summary: Reveal one masked value, from the object that holds it.
      description: |
        A masked value reaches a view through exactly one door, and this is it. Three
        properties that are not decoration:

        - The **key** travels in the query; the **value** travels only in the body.
          A secret in a URL is a secret in an access log.
        - The response is `Cache-Control: no-store`, and a shared, per-user-filtered
          object cache never holds the revealed form.
        - Revealing is an act with a subject, so in a shared profile it is a line in
          the audit log like any other.

        ## `kind` and `name` are the **source object**, not the workload

        They do not address the pod whose drawer the row is in. A row on that panel
        names a key of a ConfigMap or a Secret, and the reveal reads **that object**,
        by the reference the row already carries. The workload is not consulted at
        all.

        The difference is not cosmetic, and it is the fourth property:

        - **A container's row and the object behind it are not one address.** Several
          containers import the same ConfigMap under different prefixes, and the
          variable's name as a container sees it is not the key in the source.
          Addressing the workload means re-deriving that mapping on every reveal,
          from a pod spec that may have changed since the panel was drawn.
        - **It is what keeps this from being a general object reader.** The
          implementation refuses any kind that carries no data block. Addressed at
          the workload, the natural implementation resolves an arbitrary reference
          out of a pod spec, and the guard has to be rebuilt somewhere it is easy to
          forget. Addressed at the source, the guard is one condition on `kind`.

        `container` and `variable` remain, for the audit line and for the response's
        own labeling. Neither decides what is read.

        ## This door reveals **text**, and refuses anything else

        A key whose stored value does not decode to valid UTF-8 - a keystore, a DER
        certificate, a gzipped bundle - is answered `unreadable` with reason
        `undecodable`, in the envelope's failure arm, carrying no `data` at all.

        **It is a refusal rather than an empty value or a flagged base64.** An
        `ok` with `{key, value: ""}` would arrive as a *revealed empty value*, drawn
        identically to a key somebody had emptied. An empty answer manufactured out
        of a failure to decode is the empty-versus-failed collapse this whole
        envelope exists to prevent, on the one payload where being wrong hides or
        exposes a credential.

        Base64 with a `binary: true` flag is not offered either. The console has no
        reader for bytes: the nearest client is the manifest
        editor's textarea, which is the one place those bytes must never be typed
        back - `ManifestPanel.maskedKeys` already leaves such a key out for exactly
        that reason, and `POST /api/c/{cluster}/data` already refuses to write a
        value that is not text. A door that hands back bytes nothing can render
        would be a second answer to maintain for no reader, and whoever wants the
        bytes has `kubectl` and a pipe, which the refusal's message says.

        `DataEntry.binary` is the same fact said in advance, so a panel that has
        read `/data` knows not to offer the control at all; the refusal is what
        answers every other caller, and the two come from one flag on the server.

        The reveal is one line in the audit log whichever way it goes, refusal
        included: a record that says who asked without saying whether it happened
        does not answer the question it will be asked.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - name: kind
          in: query
          required: true
          description: >-
            The **source object's** kind, and it must be one that carries a data
            block. Any other kind is refused: that condition is what stops this
            route becoming a way to read arbitrary objects by editing the address.
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9.-]{0,126}$"
        - $ref: '#/components/parameters/NamespaceQuery'
        - name: name
          in: query
          required: true
          description: The source object's name.
          schema: { type: string, minLength: 1, maxLength: 253 }
        - name: key
          in: query
          required: true
          description: >-
            The key **in the source object**. Not the variable's name as the
            container sees it, which carries any import prefix and is a different
            string. Never a value.
          schema: { type: string, maxLength: 253 }
        - name: container
          in: query
          required: false
          description: >-
            Which container's row asked, for the audit line and for the response's
            labeling. It does not decide what is read.
          schema: { type: string, maxLength: 253 }
        - name: variable
          in: query
          required: false
          description: The name as the container sees it, prefix included, for display.
          schema: { type: string, maxLength: 253 }
      responses:
        '200':
          description: The revealed row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvValueEnvelope' }
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
        '400':
          description: >-
            No key, or a name no Kubernetes object could carry: a `namespace` or
            `container` that is not a DNS-1123 label, a `name` that is not a
            DNS-1123 subdomain, or a `key` a ConfigMap or Secret cannot hold.
            Refused before anything is read, because every one of them is written
            into the reveal's audit line.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------------------
  # Edit. One guarded write door, and every write goes through it.
  # -------------------------------------------------------------------------

  /api/c/{cluster}/data:
    get:
      operationId: getDataPanel
      tags: [edit]
      summary: The editable data of one object, masked.
      description: >-
        Reached by `DetailPage.data`, which is the address and the only signal
        that this object has a data block at all. The client draws this payload
        inside the details panel, above Related, and it is the read a write takes
        its `resourceVersion` from.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/KindQuery'
        - $ref: '#/components/parameters/NamespaceQuery'
        - $ref: '#/components/parameters/NameQuery'
      responses:
        '200':
          description: "The panel. Values that are held back carry `masked: true`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataPanelEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: applyData
      tags: [edit, act]
      summary: Write the data, having previewed it.
      description: >-
        Takes the token from `previewData`. The write carries the object's
        `resourceVersion` as a precondition, so an object changed since the preview
        is refused rather than overwritten - a 409, with the fresh state, not a
        silent last-writer-wins.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyRequest' }
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/PlanStale' }
        # The re-checked dry run, or the write itself, never sent: `not_sent`.
        '503': { $ref: '#/components/responses/CouldNotAct' }
        # The write sent and not answered: it may still happen.
        '504': { $ref: '#/components/responses/NotAnswered' }

  /api/c/{cluster}/data/preview:
    post:
      operationId: previewData
      tags: [edit, act]
      summary: What writing this data would do. Touches nothing.
      description: >-
        Safe by contract: this endpoint performs a dry run and writes nothing. It is
        a POST because the thing being previewed is a body, not because it changes
        state - so it is not cacheable, and a client must never retry it as though it
        were the act.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataWrite' }
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmationPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/LimitReached' }
        # A dry run that did not complete: `not_sent`, never `not_answered`.
        '503': { $ref: '#/components/responses/CouldNotAct' }

  /api/c/{cluster}/manifest:
    get:
      operationId: getManifest
      tags: [edit]
      summary: The object's manifest, as tokens.
      description: >-
        Coloring stays server-side and returns **tokens**; the front end renders
        spans. The API never returns an HTML string - a contract that ships markup is
        a contract that ships an injection surface, and `dangerouslySetInnerHTML` is
        banned by lint on the other side of it.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/KindQuery'
        - $ref: '#/components/parameters/NamespaceQuery'
        - $ref: '#/components/parameters/NameQuery'
      responses:
        '200':
          description: The manifest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManifestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/manifest/preview:
    post:
      operationId: previewManifest
      tags: [edit, act]
      summary: What applying this manifest would do. Touches nothing.
      description: |
        Apply accepts any kind. The guard is structural rather than a list of
        permitted kinds, and **the kind that is checked is the one read out of the
        submitted document, after parsing** - never the one a route or a field
        claims. Checking the route's kind and writing the body's kind is a full
        bypass that looks correct in both halves of the code.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManifestWrite' }
      responses:
        '200':
          description: The plan, including the diff the dry run produced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmationPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/LimitReached' }
        # A dry run that did not complete: `not_sent`, never `not_answered`.
        '503': { $ref: '#/components/responses/CouldNotAct' }

  /api/c/{cluster}/manifest/apply:
    post:
      operationId: applyManifest
      tags: [edit, act]
      summary: Apply the manifest, having previewed it.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyRequest' }
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/PlanStale' }
        # The re-checked dry run, or the write itself, never sent: `not_sent`.
        '503': { $ref: '#/components/responses/CouldNotAct' }
        # The write sent and not answered: it may still happen.
        '504': { $ref: '#/components/responses/NotAnswered' }

  /api/c/{cluster}/create/template:
    get:
      operationId: getCreateTemplate
      tags: [edit]
      summary: A starting manifest for a new object of one kind.
      description: |
        What the list's "+" opens: a YAML document for a new
        object of `kind`, with its `apiVersion` and `kind` resolved by the server
        (the client knows the list's slug only) and `metadata.namespace` set to
        `namespace` on a namespaced kind. Common kinds get a working body - a
        Deployment runs one replica of an image, a Service selects it, a Job and a
        CronJob run one command - and every other kind, custom resources
        included, a skeleton of `apiVersion`, `kind` and `metadata`.

        **Reading a template is not permission to create.** It touches nothing
        and reviews nothing beyond the kind's existence; `previewCreate` is
        where the person's `create` is reviewed, and `ListPage.create` is the
        verdict a client draws the button from.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/KindQuery'
        - $ref: '#/components/parameters/NamespaceQuery'
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateTemplateEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/create/preview:
    post:
      operationId: previewCreate
      tags: [edit, act]
      summary: What creating this object would do. Touches nothing.
      description: |
        A server-side dry run of a **create**, never of a patch: the object must
        not exist yet, and one that does is refused rather than overwritten.
        As for `previewManifest`, **the kind, name and namespace that are
        reviewed are read out of the submitted document, after parsing**, and
        `create` on them is reviewed for the person - the single sign-on user on
        a shared console, never the console's own account. `resourceVersion` is
        refused: a new object has none. A file holding more than one YAML
        document is refused with 400 and the number found; the console creates
        one object at a time. Comment-only documents between `---` do not count.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManifestWrite' }
      responses:
        '200':
          description: The plan, with the object the dry run would create.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmationPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/LimitReached' }
        # A dry run that did not complete: `not_sent`, never `not_answered`.
        '503': { $ref: '#/components/responses/CouldNotAct' }

  /api/c/{cluster}/create/apply:
    post:
      operationId: applyCreate
      tags: [edit, act]
      summary: Create the object, having previewed it.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyRequest' }
      responses:
        '200':
          description: The outcome; `next` names the object created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/PlanStale' }
        # The re-checked dry run, or the write itself, never sent: `not_sent`.
        '503': { $ref: '#/components/responses/CouldNotAct' }
        # The write sent and not answered: it may still happen.
        '504': { $ref: '#/components/responses/NotAnswered' }

  # -------------------------------------------------------------------------
  # Act. Five confirm-then-act pairs, one shape.
  # -------------------------------------------------------------------------

  /api/c/{cluster}/actions/preview:
    post:
      operationId: previewAction
      tags: [act]
      summary: What this action would do to one object. Touches nothing.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionRequest' }
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmationPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LimitReached' }

  /api/c/{cluster}/actions:
    post:
      operationId: runAction
      tags: [act]
      summary: Run the action, having previewed it.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActRequest' }
      responses:
        '200':
          description: The outcome, per target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/PlanStale' }
        '503': { $ref: '#/components/responses/CouldNotAct' }
        '504': { $ref: '#/components/responses/NotAnswered' }

  /api/c/{cluster}/bulk/preview:
    post:
      operationId: previewBulk
      tags: [act]
      summary: What this action would do to a selection. Touches nothing.
      description: >-
        The plan names every target it resolved, and `facts.count` is what the
        person agrees to. A selection is confirmed **by its count** rather than by
        typing a name, which is a decision this product already took and which the
        plan carries in `facts.confirmation`.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkRequest' }
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmationPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/LimitReached' }

  /api/c/{cluster}/bulk:
    post:
      operationId: runBulk
      tags: [act]
      summary: Run the action on the selection, having previewed it.
      description: >-
        The server re-resolves the selection from the token and refuses with 409 if
        the set is no longer the set that was shown. **A confirmation that is not
        about the set being acted on is not a confirmation** - and between a preview
        and a click, a cluster changes.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActRequest' }
      responses:
        '200':
          description: The outcome, per target. Partial success is normal and is reported as such.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/PlanStale' }

  /api/c/{cluster}/nodeshell/preview:
    post:
      operationId: previewNodeShell
      tags: [act]
      summary: What opening a shell on this node would do. Touches nothing.
      description: >-
        The only plan whose act is not an operation in this document: the shell
        itself is a WebSocket upgrade, specified in `api/websocket.md`. The token
        this returns is what that upgrade carries, so the confirmation and the act
        are still bound together across the two protocols.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeShellRequest' }
      responses:
        '200':
          description: The plan, and the channel to open with it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmationPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/LimitReached' }

  # -------------------------------------------------------------------------
  # Prerequisites. An operator an extra page reads from, installed by the
  # console through its own write door: one Argo CD Application, created
  # after a plan and a typed confirmation. The page links here; it never
  # writes itself.
  # -------------------------------------------------------------------------

  /api/c/{cluster}/prereq/{key}:
    get:
      operationId: getPrereq
      tags: [edit]
      summary: What installing this prerequisite would go through. Touches nothing.
      description: |
        Whether Argo CD is there to install through - the Application kind
        served, and its application-controller's pods found in exactly one
        namespace by `app.kubernetes.io/name=argocd-application-controller`,
        read in every namespace **for the person** and narrowed to the
        namespaces they may list - whether the Application exists already, and
        whether this person may create it there. `installable` says whether a
        preview is worth asking for; the preview and the install check
        everything again.

        Argo CD found in several namespaces is `ambiguous`, and a read that
        could not see the whole cluster and found none is `unknown`, never
        `absent`: nothing is installed on either. Where Argo CD is not found,
        `helm` is the chart as a helm command installs it, for the client to
        compose a command line from.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/PrereqKey'
      responses:
        '200':
          description: The facts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrereqEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/c/{cluster}/prereq/{key}/preview:
    post:
      operationId: previewPrereq
      tags: [edit, act]
      summary: What installing this prerequisite would create. Touches nothing.
      description: |
        The plan: one Argo CD Application, in the namespace the console found
        Argo CD in, its body exactly as it will be sent as `facts.request`
        (YAML), validated by a server-side dry run of the create that is
        reviewed for the person. No body: the key picks a row of the console's
        own table, and nothing a client sends reaches the cluster. Refused with
        a 400 where Argo CD is not found exactly once, and where the
        Application exists already; with a 403 where the person may not create
        it or the cluster is read-only.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/PrereqKey'
        - $ref: '#/components/parameters/RequestMarker'
      responses:
        '200':
          description: The plan, confirmed by typing the Application's name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmationPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LimitReached' }
        # A dry run that did not complete: `not_sent`, never `not_answered`.
        '503': { $ref: '#/components/responses/CouldNotAct' }

  /api/c/{cluster}/prereq/{key}/install:
    post:
      operationId: installPrereq
      tags: [edit, act]
      summary: Create the Application, having previewed it.
      description: |
        The token and the typed name. The gesture is checked before the token
        is spent; then the plan is derived again and compared with the one
        confirmed - its target and its document - and a difference is a 409
        carrying the fresh plan. The outcome says an Application was created
        and Argo CD will reconcile it, never that the operator is installed:
        that takes minutes and can fail.
      parameters:
        - $ref: '#/components/parameters/Cluster'
        - $ref: '#/components/parameters/PrereqKey'
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActRequest' }
      responses:
        '200':
          description: The outcome; `next` names the Application created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PlanStale' }
        '503': { $ref: '#/components/responses/CouldNotAct' }
        '504': { $ref: '#/components/responses/NotAnswered' }

  # -------------------------------------------------------------------------
  # Preferences. Twelve writes, one cell each, and that is not an oversight.
  #
  # One cell at a time is deliberate: a body carrying the whole grid makes
  # somebody unticking one column re-assert every other, and freezes the grid at
  # whatever the page happened to hold. A JSON API that accepts the whole
  # preferences object does exactly that, and it looks tidier while doing it.
  #
  # So every body below is `additionalProperties: false` over the fields of one
  # cell. That is the rule made checkable rather than remembered: a request
  # carrying a second cell fails the schema, in the conformance test and in the
  # generated client alike.
  #
  # Each answers 204: the front end already knows what it asked for, so nothing
  # is redrawn from the answer.
  # -------------------------------------------------------------------------

  /api/me/kinds:
    get:
      operationId: getKindPreferences
      tags: [preferences]
      summary: The person's choices about the kinds column.
      description: >-
        Whether the kinds column shows the kinds with no object the person may
        see, and the kinds they marked as favorites, per cluster.
        **Per person**: under the `shared` profile a
        shared console keeps one person's choice apart from another's. Kept on
        the server only where `Capabilities.kindPreferences` is true; elsewhere
        this answers `403 not_available_in_this_profile` and a client keeps the
        choice in its own browser. Not enveloped: the console's own store.
      responses:
        '200':
          description: The choices, the defaults where none was made.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KindPreferences' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
    put:
      operationId: setKindPreferences
      tags: [preferences]
      summary: Replace the person's choices about the kinds column.
      description: >-
        The whole of it, both members: the two are one person's and few, and a
        client holds them whole. Answers what was kept, which is what a client
        draws. Refused like the read where `Capabilities.kindPreferences` is
        false.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KindPreferencesWrite' }
      responses:
        '200':
          description: Kept; the choices as the server now holds them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KindPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences:
    get:
      operationId: getPreferences
      tags: [preferences]
      summary: The console's stored preferences.
      description: >-
        The read half of all twelve writes below, in one payload, because a client
        that has just started needs all of it and a client that has just written
        needs none of it. Not enveloped: this is the console's own file.
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/preferences/rail/bar:
    post:
      operationId: setRailBar
      tags: [preferences]
      summary: Put one hotbar on screen.
      description: >-
        The rail has several hotbars and this selects which is drawn. It is not a
        show/hide toggle.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RailBarWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences/rail/assign:
    post:
      operationId: setRailAssign
      tags: [preferences]
      summary: Send one cluster's tile to one hotbar.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RailAssignWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences/rail/move:
    post:
      operationId: setRailMove
      tags: [preferences]
      summary: Move one cluster's tile to one position.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RailMoveWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences/rail/place:
    post:
      operationId: setRailPlace
      tags: [preferences]
      summary: Drop one cluster's tile beside another.
      description: >-
        The rail has no groups. See `RailPlaceWrite` for why the body names a
        neighbor and never a position.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RailPlaceWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences/rail/hide:
    post:
      operationId: setRailHide
      tags: [preferences]
      summary: Hide one cluster's tile.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RailTileWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences/rail/reveal:
    post:
      operationId: setRailReveal
      tags: [preferences]
      summary: Reveal one cluster's hidden tile.
      description: >-
        Deliberately not `hide` with a boolean. A single toggle endpoint is the
        whole-object bug in miniature:
        a client with a stale view of what is hidden flips the wrong way.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RailTileWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences/rail/nameplate:
    post:
      operationId: setRailNameplate
      tags: [preferences]
      summary: Relabel one cluster's tile.
      description: >-
        The label is the person's own word for a cluster and never replaces the
        context name in an address: contexts are named in URLs, and a nameplate that
        reached a path would make two clusters indistinguishable to the router.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RailNameplateWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences/columns/size:
    post:
      operationId: setColumnSize
      tags: [preferences]
      summary: Set one column's width.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColumnSizeWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences/columns/place:
    post:
      operationId: setColumnPlace
      tags: [preferences]
      summary: Move one column to one position.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColumnPlaceWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences/columns/show:
    post:
      operationId: setColumnShow
      tags: [preferences]
      summary: Show or hide one column.
      description: >-
        **One column.** This is the endpoint the whole-object rule was written for:
        a body carrying every column's visibility means that unticking one re-asserts
        the rest from whatever the page held, which freezes a grid that has since
        gained a column. The schema refuses the second field.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColumnShowWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences/columns/density:
    post:
      operationId: setColumnDensity
      tags: [preferences]
      summary: Set the row density, for every table.
      description: >-
        The one preference write whose subject is the console rather than one table,
        and the only one carrying no `kind`: the store has nowhere to put one.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColumnDensityWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences/seen-version:
    post:
      operationId: setSeenVersion
      tags: [preferences]
      summary: Record the release whose "What's new" was seen.
      description: >-
        Desktop only, like every preference write (#80): the server profile keeps
        the last version seen in each browser.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeenVersionWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  /api/preferences/columns/reset:
    post:
      operationId: resetColumns
      tags: [preferences]
      summary: Forget one kind's column arrangement, or one part of it.
      description: >-
        The one write here that is deliberately not a single cell, because forgetting
        is the operation. It names the kind it forgets, so it can never be a whole-
        console reset by accident.


        `scope` says which of the three arrangements to forget. Absent is `all`.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColumnResetWrite' }
      responses:
        '204': { description: Written. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/NotSaved' }

  # -------------------------------------------------------------------------
  # Dock: terminals, the log stream, port-forwards.
  # -------------------------------------------------------------------------

  /api/dock/terminals:
    post:
      operationId: openDesktopTerminal
      tags: [dock]
      summary: Open a terminal on the machine running the console.
      description: >-
        Available only where `capabilities.desktopTerminal` is true, and refused with 403
        everywhere else. In a shared profile this shell would run with the process's
        own credentials rather than the caller's, which is why the condition that
        disables it is tested.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesktopTerminalRequest' }
      responses:
        '201':
          description: The session, and the channel to attach to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerminalSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/LimitReached' }

  /api/logs/containers:
    get:
      operationId: listLogContainers
      tags: [dock]
      summary: Which containers of a pod can be followed.
      parameters:
        - $ref: '#/components/parameters/ClusterQuery'
        - $ref: '#/components/parameters/KindQuery'
        - $ref: '#/components/parameters/NamespaceQuery'
        - $ref: '#/components/parameters/NameQuery'
      responses:
        '200':
          description: The containers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContainerListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/logs:
    get:
      operationId: streamLogs
      tags: [dock]
      summary: Follow a container's log as a framed event stream.
      description: |
        The one streaming surface inside this document, and it is framed rather than
        raw for a reason the envelope makes obvious: **a stream that cannot carry a
        state change cannot tell a quiet container from a broken one.** An event of
        type `state` carries the same state vocabulary as an envelope, mid-
        stream, so a log that stops because the pod was deleted reads differently
        from a log that stops because nothing is being written.

        It also pages back (`internal/logs/earlier.go`, with three named stop
        reasons):

        - **There is no cursor**, and there cannot be: `corev1.PodLogOptions` offers
          no offset, no continue token and no "the N lines before this one". `before`
          is how many lines the caller already holds; the server grows the tail to
          `before + page` and keeps the front of it, which is exactly the block
          preceding what the caller has. `tailLines` is untouched by any of it - a
          page backwards has its own ceiling, because "how far back may a deliberate
          gesture reach" is a different question from "how much history should a panel
          open with".
        - **Paging back is the same address and a different shape.** With `before`
          this operation answers `application/json` - a `LogPageEnvelope` - and does
          not stream. That asymmetry is the point rather than an inconsistency: a
          `fetch` may read a status and a body, and the `EventSource` a follow runs on
          may read neither, which is why a refusal mid-stream has to be smuggled into
          a frame and a refusal here can be an ordinary 403.
        - **The end-of-log wording belongs to whoever renders it.** The rule that
          the last line says it is the beginning of the log rather than of time is a
          front-end rule, tested where the sentence lives.
      parameters:
        - $ref: '#/components/parameters/ClusterQuery'
        - $ref: '#/components/parameters/KindQuery'
        - $ref: '#/components/parameters/NamespaceQuery'
        - $ref: '#/components/parameters/NameQuery'
        - name: container
          in: query
          required: false
          schema: { type: string, maxLength: 253 }
        - name: follow
          in: query
          required: false
          schema: { type: boolean, default: true }
        - name: tailLines
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100000, default: 2000 }
        - name: previous
          in: query
          required: false
          description: Read the previous container instance's log instead.
          schema: { type: boolean, default: false }
        - name: before
          in: query
          required: false
          description: >-
            How many lines the caller already holds. **Its presence turns this
            operation from a stream into a bounded JSON read** of the block
            immediately preceding them, and its absence has to be indistinguishable
            from an ordinary stream request - the panel's opening read carries none of
            this and costs nothing extra. Understating it only costs
            the caller lines it already has; overstating it buys nothing, because the
            server clamps the window either way, so a lying client cannot enlarge the
            read.
          schema: { type: integer, minimum: 1 }
        - name: page
          in: query
          required: false
          description: >-
            How many earlier lines to fetch in one gesture. Clamped server-side;
            omitted means the server's own figure. Only read when `before` is present.
          schema: { type: integer, minimum: 1 }
        - name: timestamps
          in: query
          required: false
          description: >-
            Ask the API server to stamp every line with the instant it was written.
            A property of the **request** and not of the rendering: the apiserver
            either prefixes the instant or it does not, and there is no way to add one
            afterwards to lines that arrived without - so turning this on re-opens the
            stream and the buffer starts again from the tail. Where it is on, the
            stamp is carried as `LogEvent.at` and taken **off** `LogEvent.text`, so a
            client neither re-parses it nor has to shift its color offsets past it.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: >-
            The stream. Each event is one JSON object in a `data:` field; the grammar
            is in `api/websocket.md` alongside the socket channels, because it is the
            same problem.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/LogEvent' }
            application/json:
              schema: { $ref: '#/components/schemas/LogPageEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/forwards:
    get:
      operationId: listForwards
      tags: [dock]
      summary: The port-forwards this process holds.
      description: >-
        Process state rather than a cluster read, so it is a plain array and not an
        envelope. The cap is shared: it is a safety limit for one person and a
        shared resource for ten, so a shared profile divides it by identity rather
        than raising it.


        **Not registered under the server profile**, nor are the other two forward
        operations: a forward binds a port inside the console's process and the
        browser is handed `127.0.0.1`, which from a pod is the viewer's own
        machine. `Capabilities.portForward` is false there, and the page draws the
        `kubectl port-forward` command instead.
      responses:
        '200':
          description: The live forwards.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Forward' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: openForward
      tags: [dock]
      summary: Open a port-forward.
      description: >-
        **Refused with 403 `read_only` on a cluster marked read-only**
        (`KT_READONLY_CLUSTERS`), with a sentence naming the marking, as a read-only terminal refuses
        `kubectl port-forward`. The Ports panel is told beforehand:
        `ObjectPort.forwardable` is false there, with the same sentence as its
        reason. The tunnels the console digs for itself - the Prometheus panel's,
        and an extension's through its host - are not this operation and are not
        refused.
      parameters: [{ $ref: '#/components/parameters/RequestMarker' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForwardRequest' }
      responses:
        '201':
          description: The forward, with the local address it is listening on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Forward' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Refused' }
        '409': { $ref: '#/components/responses/LimitReached' }

  /api/forwards/{id}:
    delete:
      operationId: closeForward
      tags: [dock]
      summary: Close a port-forward.
      description: >-
        The only way to close a forward: a second route to the same handler (a POST
        to `/close`) would be redundant once a client is typed, and both would then
        be generated and maintained.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
        - $ref: '#/components/parameters/RequestMarker'
      responses:
        '204': { description: Closed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/forwards/{id}/window:
    post:
      operationId: openForwardWindow
      tags: [dock]
      summary: Open a forward's flow UI in a window of the desktop's own.
      description: >-
        Hubble UI or Whisker, at `path` on the forward's loopback address, in a
        window the desktop draws beside the console's, titled
        `KubeTower · <cluster> · <tool>`. Registered only where the forwards are
        and the desktop can draw that window; answered 409 while the console is
        not in the desktop's native window (`capabilities.toolWindow` false),
        where the page opens the forward in the browser instead. The address is
        built from the live forward, never taken from the page, and the window
        keeps no cookie or storage with the console's. With `closeWithWindow`,
        closing the window closes the forward unless another window shows it; a
        forward that goes away closes its window.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
        - $ref: '#/components/parameters/RequestMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForwardWindowRequest' }
      responses:
        '204': { description: The window is opening. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  # The session is an HttpOnly, SameSite=Lax, same-origin cookie. Declared
  # here rather than described only in prose so a generated client knows to send
  # credentials, and so a reader can tell a deliberately public operation from
  # one that forgot. Prose plus a 401 on every protected operation would tell a
  # generated client nothing.
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kubetower_session
      description: >
        Set by `login`, `launchSignIn` and the single sign-on callback. HttpOnly,
        so no script can read it, and SameSite=Lax: a top-level navigation
        arriving from a bookmark or a link carries it, a cross-site POST or fetch
        does not. Secure where single sign-on is configured with an https
        redirect URL. An expired or absent cookie is answered with 401 and never
        with a sign-in page - a fetch renders a page as nothing at all.

  # =========================================================================
  # Parameters
  # =========================================================================

  parameters:

    Cluster:
      name: cluster
      in: path
      required: true
      description: >-
        The context name, percent-encoded. Context names are what this product puts
        in URLs, and they are not tame: a managed cluster's context is routinely an
        ARN with colons and slashes in it. A client encodes the segment; a server
        decodes it once and never twice.
      schema: { type: string, minLength: 1, maxLength: 253 }

    ClusterQuery:
      name: cluster
      in: query
      required: true
      description: The context name. Same rules as the path form.
      schema: { type: string, minLength: 1, maxLength: 253 }

    Kind:
      name: kind
      in: path
      required: true
      description: >-
        The resource as discovery names it - a plural, optionally group-qualified.
        Validated against discovery before anything is fetched; an unknown kind is
        `absent`, which is a different answer from a kind with nothing in it.
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9.-]{0,126}$"

    KindQuery:
      name: kind
      in: query
      required: true
      description: The resource as discovery names it.
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9.-]{0,126}$"

    Namespace:
      name: namespace
      in: query
      required: false
      explode: true
      description: |
        **Repeatable.** `?namespace=kube-system&namespace=ingress` narrows to both.

        The namespace selector is a multiple selection - "pick another to add it" -
        and a list narrowed to four namespaces is how a cluster with thirty is
        actually read, which a single string could not express.

        Absent means every namespace the caller may read. That is not the same as
        `default`, and a client that substitutes one for the other shows a fraction
        of a cluster with no sign that it did.
      schema:
        type: array
        maxItems: 256
        items: { type: string, maxLength: 253 }

    NamespaceQuery:
      name: namespace
      in: query
      required: false
      schema: { type: string, maxLength: 253 }

    NamespacePath:
      name: namespace
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 253 }

    Name:
      name: name
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 253 }

    NameQuery:
      name: name
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 253 }

    PrereqKey:
      name: key
      in: path
      required: true
      description: >-
        A prerequisite this console installs, by its key: `trivy-operator`.
        A key and nothing else - no chart, version or namespace - so
        everything that reaches a cluster is the console's own.
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }

    RequestMarker:
      name: X-KubeTower-Request
      in: header
      required: true
      description: >-
        Required on every mutation. The session is a cookie, so a cross-site form
        post would otherwise carry it; a custom header cannot be set cross-origin
        without a preflight the browser then refuses. Paired with an `Origin` check
        on the server - either alone has a known hole.
      schema: { type: string, const: "1" }

  # =========================================================================
  # Responses. Every one of these is a problem object, never an envelope, and
  # never HTML. An expired session answering with a login page renders in a
  # fetch as nothing at all: no error, no unusual status in a log, and a blank
  # screen.
  # =========================================================================

  responses:

    Unauthenticated:
      description: >-
        No session, or it has lapsed. **Always JSON**, never a login page. The front
        end routes to its own login screen on this status; that is the whole contract
        and it is why the guard cannot answer a page here.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Refused:
      description: >-
        The console refuses the caller this operation - a read-only fence, a profile
        that disables it, or the cluster's own authorization saying no to the whole
        request. A Kubernetes 403 arrives here with its message intact and never as a
        500: the operator needs to read what the API server said.

        On a preview or an act, `rbac_not_in_profile` is a change to RBAC - a
        create, edit, apply, patch, delete or bulk delete of a Role, ClusterRole,
        RoleBinding or ClusterRoleBinding - under the server profile, which this
        version does not make whoever asks: it is refused before any review and
        nothing reaches the cluster.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    NotFound:
      description: >-
        No such cluster, object, or route. Also the answer for an extension route on
        a cluster where it is not enabled - not 403, which would confirm it exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    BadRequest:
      description: The request itself could not be understood.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Conflict:
      description: >-
        The request cannot be taken in the state things are in now, and the
        detail says which: for an update, this installation cannot be
        updated, one is already running, or nothing is verified yet. Code `conflict`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    PlanStale:
      description: >-
        The plan no longer describes what would happen: the token expired, the object
        changed since the preview, or the selection resolved to a different set. The
        body carries the fresh plan so the front end can show the operator what
        changed rather than simply failing.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  plan: { $ref: '#/components/schemas/ConfirmationPlan' }

    LimitReached:
      description: >-
        A process-wide limit is full - live port-forwards, terminal sessions, or
        the confirmation plans a preview keeps until its act (on a preview: the
        console's ceiling, or under the server profile one person's share of
        it; a plan lapses two minutes after its preview). The body says which
        and how many, because "try again later" is not actionable when the
        answer is that another tab holds them all.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    CouldNotAct:
      description: >-
        The console did not make the write, and nobody said no. `code` says why:
        `access_unreviewable` when it could not ask the cluster whether the person
        may make it, or could not write the audit record first; `not_sent` when the
        write never left the console - its time ran out, the console's rate limit
        for the cluster held it, or no connection to the API server was made.
        Nothing reached the cluster, so it is safe to make again - unlike the 504
        `not_answered`, which may still happen.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    NotAnswered:
      description: >-
        `not_answered`: the write left the console and no answer came back - the
        deadline cut it, or the connection ended after it was written - or the
        API server answered without finishing it (504 Timeout, 500
        ServerTimeout, or any 5xx with Retry-After that was asked again), so
        the write may still happen. A dry run that does not complete is
        `not_sent` instead: it changes nothing. Whether it happened is not known; the
        object's own page says. Never run again on its own.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    NotSaved:
      description: >-
        `not_saved`: the change to the console's own preferences **is in effect
        now** and could not be written to the state directory, so it will be
        gone at the next start. Not a refusal - a refusal is the 400, and means
        nothing happened. A client that made one write of several for one
        gesture sends the rest, and draws the arrangement as the server now
        holds it; `detail` names the file and the reason, to say to the
        operator.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    TooManyRequests:
      description: Rate-limited.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  # =========================================================================
  # Schemas
  # =========================================================================

  schemas:

    # ---- The envelope ----------------------------------------------------

    State:
      type: string
      description: |
        The states the console distinguishes. Collapsing any two of them is the
        defect this vocabulary exists to prevent.

        - `ok` - read, and there is something to show.
        - `empty` - read, and there is nothing here.
        - `pending` - **nobody has asked yet.** See below.
        - `unreadable` - it exists and could not be read: the credentials do not
          allow listing it, or what came back could not be decoded.
        - `absent` - the thing that would serve this is not installed, or, with
          `no_such_object`, the one object asked for is not on a cluster that
          serves its kind.
        - `unreachable` - the cluster could not be asked at all.
        - `forbidden` - the API server refused this specific verb.

        ## `pending` is not a failed read

        The first five are the answers to a read that happened. `pending` is the
        answer when no read has happened: the console probes clusters on its own
        loop and answers this request out of what it already holds, so "I have not
        asked this cluster yet" is a fact about **the server**, not a fetch the
        browser has not resolved. A client cannot derive it and must not invent it.

        Reported as `unreadable` with `retryable: true`, it would assert that the
        thing exists and could not be read, when nothing was tried. A console whose
        whole argument is that an empty answer and a failed answer are different
        answers cannot then render "nobody asked" as either of them: a health page
        says *asking 14 contexts...* rather than *0 of 14 answering*.

        `pending` carries a `reason` and no payload, exactly like the four failure
        states - it is not a state anything can be drawn from. What separates it is
        what a client should draw: a failure invites a retry button, `pending`
        invites waiting, and a count of how many are still pending is the honest
        headline while a first round is in flight.
      enum: [ok, empty, pending, unreadable, absent, unreachable, forbidden]

    ReasonCode:
      type: string
      description: >-
        Stable and branchable. `Reason.message` is display text and may be reworded
        in any release; a client that branches on the message is branching on prose.
      enum:
        - empty_scope
        - read_denied
        - undecodable
        - not_installed
        - no_such_kind
        # On `state: absent`, a read of one object whose kind the cluster
        # serves: the object is not there - deleted, or never made. A client
        # says it is gone, never that something is not installed.
        - no_such_object
        - cluster_unreachable
        - timeout
        - verb_denied
        - not_supported_here
        # The code that goes with `state: pending`. Distinct from `timeout`: a
        # timeout is a question that was put and not answered, this is a
        # question nobody has put. Also on an act's row for a write that never left
        # the console - a drain's eviction not attempted because its time ran out
        # first, the review answered too late or could not be made, its audit
        # record could not be written, the cluster's rate limit held it or no
        # connection to the API server was made; a bulk row the same holds for.
        # One sent and not answered in time is `timeout`.
        - not_probed_yet
        # Carried on an `ok` answer that is a retained earlier reading, because the
        # source has since stopped answering. See Envelope: a reason on `ok`
        # qualifies the answer rather than replacing it.
        - stale_reading
        # ---------------------------------------------------------------------
        # Why a cluster did not answer, classified. **This is the branchable half
        # of the cluster classification's whole product**: raw, a name that does not resolve,
        # a lapsed session and an IAM refusal all read as "the cluster is broken",
        # and they are three different people's problems. `read_denied` alone
        # cannot say which, and `Reason.message` is prose a client must not branch
        # on. `HealthCheck.remedy` carries the sentences; these carry the fact.
        # ---------------------------------------------------------------------
        # The log stream's own ceiling. Not an end and not a failure: there *is*
        # more log and this console will not read it, which is a third sentence.
        # Carried on a `state: unreadable` frame before the stream's `end`, so a
        # panel can draw "stopped after 8 MiB" rather than "end of log".
        - truncated
        # A followed log whose container has not started:
        # `ContainerCreating`, `PodInitializing`, or a pod no node has taken yet.
        # On a `state: pending` frame
        # the stream is waiting for it, and lines follow on the same stream once
        # it runs - **the one `state` frame that is not followed by an `end`**.
        # On `state: unreadable` the wait is over: the container is not going
        # to start on its own (an image that cannot be pulled, a configuration
        # error) or the pod went away first, and an `end` follows.
        - container_not_started
        # A control drawn disabled because the console could not ask the
        # cluster whether the person may use it. Not `verb_denied`: nobody said
        # no, and hiding the control or offering it as working would each claim
        # an answer nobody got.
        - access_unreviewable
        # On a bulk row: a change to RBAC the server profile does not make. As
        # the single door's problem code, never `verb_denied`: nobody's rights
        # said no.
        - rbac_not_in_profile
        - credentials_expired      # a session lapsed. The operator renews it in one command.
        - credentials_refused      # the credential plugin ran and refused. Its own words are not in the error.
        - name_not_resolved        # the address does not resolve from where this process runs.
        - connection_refused       # something answered the address and said no.
        - unclassified             # none of the known shapes. The error is carried in `detail`.
        # On `GET /api/health`'s AWS SSO check, with `state: empty`: this machine
        # holds no SSO session. Not `not_installed` - a
        # session is not something one installs - and not a failure: nothing was
        # refused, and an `aws sso login` would make one.
        - no_session

    Scope:
      type: object
      description: What was asked. Without it, "unreachable" does not say unreachable for what.
      properties:
        cluster: { type: string }
        namespace: { type: string }
        resource: { type: string }
        name: { type: string }
        verb: { type: string }

    Reason:
      type: object
      required: [code, message]
      description: >-
        Present whenever the state is not `ok` or `empty`, and permitted on `empty`
        so that "nothing in this namespace" can say which namespace.
      properties:
        code: { $ref: '#/components/schemas/ReasonCode' }
        message:
          type: string
          description: One sentence, for an operator. Display text, not protocol.
          maxLength: 2048
        detail:
          type: string
          description: >-
            The underlying message, verbatim where one exists - a Kubernetes 403's own
            wording, for instance. Never a stack trace and never a secret value.
          maxLength: 8192
        scope: { $ref: '#/components/schemas/Scope' }
        since:
          type: string
          format: date-time
          description: When this condition was first observed, where the console tracks it.
        retryable:
          type: boolean
          description: >-
            Whether refetching could plausibly give a different answer. `unreachable`
            usually yes, `forbidden` usually no. It drives a retry button, not a
            retry loop.

    Envelope:
      type: object
      required: [state]
      description: |
        The two members every envelope has, whatever it wraps.

        **A `reason` on an `ok` answer qualifies it rather than replacing it**, and
        there is exactly one case: the payload is a reading kept from before the
        source stopped answering, carried with `reason.code: stale_reading`. The
        alternative was to drop to a failure state and show nothing, which throws
        away a list an operator can still work from, or to show it silently, which
        is the same list presented as current. A client that ignores `reason` on
        `ok` therefore degrades to "slightly out of date" rather than to wrong.
      properties:
        state: { $ref: '#/components/schemas/State' }
        reason: { $ref: '#/components/schemas/Reason' }

    ListArms:
      description: |
        The arm rules for a collection, expressed so that tooling enforces them:

        - `ok` carries `items` with **at least one** element. `{"state":"ok",
          "items":[]}` is a spec violation, which is the collapse this whole design
          exists to prevent, caught by the conformance test rather than by a reader.
        - `empty` carries `items` as an **empty** array, so a client that renders a
          table has one to render.
        - every other state carries `reason` and **no `items` member at all** - not
          `[]`, not `null`. An absent member is optional in the generated
          TypeScript, so `data.items.map(...)` does not compile until the caller has
          dealt with the other states. Making the collapse opt-in is the point.
        - `pending` is one of those others. It carries a reason and no items,
          because there is nothing to draw - but what a client should draw for it
          is "still asking", not a failure. See `State`.
      allOf:
        - if:
            type: object
            required: [state]
            properties: { state: { const: ok } }
          then:
            required: [items]
            properties: { items: { minItems: 1 } }
        - if:
            type: object
            required: [state]
            properties: { state: { const: empty } }
          then:
            required: [items]
            properties: { items: { maxItems: 0 } }
        - if:
            type: object
            required: [state]
            properties:
              state: { enum: [pending, unreadable, absent, unreachable, forbidden] }
          then:
            required: [reason]
            properties: { reason: { $ref: '#/components/schemas/Reason' } }
            not:
              required: [items]
              properties: { items: {} }

    ValueArms:
      description: >-
        The same rules for a single value. `empty` is not a state a value can be in -
        a thing that is not there is `absent`, and allowing both would put the same
        fact in two places. `pending` is one it can be in, and carries a reason and
        no `data`: a value nobody has gone to read is not a value that is not there.
      allOf:
        - not:
            type: object
            required: [state]
            properties: { state: { const: empty } }
        - if:
            type: object
            required: [state]
            properties: { state: { const: ok } }
          then:
            required: [data]
            properties: { data: {} }
        - if:
            type: object
            required: [state]
            properties:
              state: { enum: [pending, unreadable, absent, unreachable, forbidden] }
          then:
            required: [reason]
            properties: { reason: { $ref: '#/components/schemas/Reason' } }
            not:
              required: [data]
              properties: { data: {} }

    # ---- Problems --------------------------------------------------------

    Problem:
      type: object
      description: >-
        RFC 9457. Carried on every 4xx and 5xx, with `application/problem+json`.
        Distinct from an envelope on purpose: a problem means the request got no
        answer, an envelope means it got one.

        `session_store_unreachable` is a **503 the guard answers before any
        operation**, on any address: the store the console keeps its single
        sign-on sessions and its confirmation plans in -
        shared by every replica where there are several - did not answer, so the
        request's session could not be read. It is not `session_expired`, and the
        difference is the instruction: signing in again needs the same store. It
        also answers a preview or a confirmation whose plan could not be kept or
        read.

        `rbac_denied` on a preview or an act is also the **access review**
        answering no: before any write, the console asks the cluster whether the
        signed-in person may make it (a SubjectAccessReview naming them; the
        console's own credentials for the shared password account and on the
        desktop) and sends nothing when the answer is no. `access_unreviewable`
        is a **503** for the case where that question could not be asked - the
        write was not attempted, and nobody said no - and, titled "Audit record
        could not be written", for a write not made because its audit record
        could not be written first.

        `rbac_not_in_profile` is a **403** on a preview or an act that would
        change RBAC (roles, cluster roles and their bindings, group
        `rbac.authorization.k8s.io`) under the server profile: this version does
        not make such a change whoever asks, because the console does not yet
        review the `bind` and `escalate` verbs. It is refused before any review
        and before anything is sent; it is never `rbac_denied`, since nobody's
        rights said no and no RoleBinding changes the answer. The desktop
        profiles are unchanged.

        Two more answers about a write that is neither a refusal nor done, each
        with its own code so that a client branches on `code` and never on the
        title. `not_sent` is a **503**: the write never left the console - its
        time ran out before it was handed to the client, the console's rate
        limit for the cluster held it, or no connection to the API server was
        made - so nothing reached the cluster and running it again is safe.
        `not_answered` is a **504**: the write left and no answer came back -
        the deadline cut it, or the connection ended after it was written - or
        the API server answered that it timed out, so it may still happen;
        either way whether it happened is not known, and a client must not run
        it again on its own.

        `not_saved` is a **500** on a write to the console's own preferences:
        the change took effect and could not be written down, so it is in effect
        now and gone at the next start. It is never `invalid_request`, which
        says nothing happened.
      required: [status, title, code]
      properties:
        type: { type: string, format: uri-reference, default: "about:blank" }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          description: Stable and branchable, as ReasonCode is for states.
          enum:
            - session_expired
            - not_authenticated
            - origin_rejected
            - read_only
            - not_available_in_this_profile
            - rbac_denied
            - not_found
            - invalid_request
            # A list asked with a label selector that does not parse: a 400,
            # apart from every other bad request so a client can say the
            # selector is wrong.
            - invalid_selector
            - plan_expired
            - plan_changed
            - conflict
            - limit_reached
            - rate_limited
            - internal
            - session_store_unreachable
            # A write the console did not attempt because it could not ask the
            # cluster whether the person may make it - a 503, and never
            # `rbac_denied`: nobody said no. The same 503 and code, under its
            # own title, for a write not made because its audit record could
            # not be written.
            - access_unreviewable
            # A write that never left the console: a 503, safe to run again.
            - not_sent
            # A write that left and whose answer never came back, or that
            # the API server timed out on: a 504, whether it happened is not
            # known.
            - not_answered
            # A preference write that took effect and could not be saved: a
            # 500, in effect now and gone at the next start.
            - not_saved
            # A change to RBAC under the server profile, which this version
            # does not make: a 403 before any review, never `rbac_denied`.
            - rbac_not_in_profile
        scope: { $ref: '#/components/schemas/Scope' }
        plan:
          $ref: '#/components/schemas/ConfirmationPlan'
          description: >-
            On a `plan_changed` 409 only: the plan as it stands **now**, re-derived
            from the same request, so the operator reads what changed and confirms
            that rather than being handed a spent token and a sentence.

    ProbeResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        detail: { type: string }

    # ---- Session and profile --------------------------------------------

    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        user: { type: string, maxLength: 256 }
        password: { type: string, maxLength: 1024 }

    Session:
      type: object
      required: [identity, method, groups, idleExpiresAt, absoluteExpiresAt]
      properties:
        identity:
          type: string
          description: >-
            Who the session belongs to: the person the identity provider named, or
            the shared account's user name.
        method:
          type: string
          enum: [password, sso, launch]
          description: >-
            How the session was opened. `password` is the shared local account, which
            is whoever holds the password and names no person; `sso` is a person the
            identity provider vouched for; `launch` is the same shared account,
            reached through a one-time code the application minted for a window it
            opened (`launchSignIn`) - whoever can start KubeTower on that machine,
            again no person.
        groups:
          type: array
          items: { type: string }
          description: >-
            The identity provider's groups as the console asserts them, prefix
            applied, **as of the sign-in** - a group removed at the provider stays
            here until the session ends. Empty for the shared account, and for a
            person whose token carried no groups claim.
        idleExpiresAt:
          type: string
          format: date-time
          description: Pushed back by activity.
        absoluteExpiresAt:
          type: string
          format: date-time
          description: Not pushed back by anything. The front end warns before it.

    SignInMethods:
      type: object
      additionalProperties: false
      required: [password, sso]
      properties:
        password:
          type: boolean
          description: >-
            Whether the shared account's password is offered. False once an
            identity provider is configured, unless the deployment kept it;
            and false on the loopback desktop, where the console opens signed in
            from the application. With `sso.state` `off` as
            well, the sign-in page says to open KubeTower again, or to run
            `kubetower open`.
        sso: { $ref: '#/components/schemas/SingleSignOn' }

    SingleSignOn:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [off, pending, ready, unavailable]
          description: >-
            `off`: no identity provider configured. `pending`: configured, and it has
            not answered yet. `ready`: answering. `unavailable`: asked, and not
            answering - `detail` says why.
        detail:
          type: string
          description: >-
            Why, for `pending` and `unavailable`, in a sentence of the console's own:
            which kind of failure it was, and an HTTP status where there was one. **Never
            the discovery error itself** - this is public, and that error names the
            provider's internal address and the IP it resolved to. The console's log has
            the error.

    Capabilities:
      type: object
      description: >-
        What the running profile offers. Every false here is also refused at its own
        endpoint.
      required: [mode, localShell, podExec, nodeShell, assistant, portForward, readOnly]
      properties:
        mode:
          type: string
          enum: [desktop, container, shared]
          description: >-
            `shared` is a console several people sign in to. It disables everything
            that would otherwise run with the process's own credentials rather than
            the caller's.
        localShell:
          type: boolean
          description: >-
            **This console can open a pseudo-terminal on the machine it runs on**,
            which is what the `terminal` channel is: a shell beside the process,
            scoped to a cluster's kubeconfig context, drawn as a pane in the page.

            It is not *a terminal window on the person's own desktop*, which is
            `desktopTerminal` below. A console in a container answers false to that
            and true to this, and the in-page shell control is drawn from this one.
        desktopTerminal:
          type: boolean
          description: >-
            A terminal **window on the operator's own machine**, opened by
            `/api/dock/terminals` - the console and the operator share a desktop.
            False in every profile but `desktop`, and the gate on that operation.
        podExec:
          type: boolean
          description: >-
            This build can open a shell inside a pod: the exec channel is
            registered and there is a cluster to open it on. On the desktop
            that is the whole answer - the credentials are the operator's own.
            **Under `shared` it is not the answer for any one pod**: whether
            Shell is drawn on a pod is that pod's `DetailPage.shell`, asked for
            the person and for the console's own ServiceAccount on that pod. One
            review of `create pods/exec` in every namespace would answer false to
            a person granted it in some namespaces only. Every member describes the
            build; the console
            still re-reads them every minute under `shared`.
        nodeShell: { type: boolean }
        assistant:
          type: boolean
          description: >-
            The assistant channel. False in a shared profile, where it would run on
            one person's subscription for everybody.
        portForward:
          type: boolean
          description: >-
            Which of two things the page draws for a forwardable port. `true`: this
            console opens the forward itself, and the Ports panel offers a control
            that turns into the address. `false`: it does not - under the server
            profile a forward would bind a port inside the pod and hand the browser
            `127.0.0.1`, the viewer's own machine, and where the console runs as
            **several replicas behind one address** a forward would be a listener
            inside one pod - so the panel shows the `kubectl port-forward` command
            for the port instead, to run on the viewer's machine with their own
            credentials. The forward operations are not registered where this is
            false.
        preferences:
          type: boolean
          default: true
          description: >-
            Whether this console keeps what a person arranges: the rail, the
            nameplates, the column layouts and the density. When false the twelve
            preference writes are not registered at all, and `GET /api/preferences`
            still answers, with the defaults. It is also exactly where the
            per-cluster extension switch and its settings (`setExtensionEnabled`,
            `setExtensionSetting`) are registered, so a client draws the Settings
            page's Extra tab with controls where it is true and read-only where it
            is false.

            **False under the `shared` profile**, one replica or several: what the
            console keeps is the console's and not the person's, so one person's
            nameplates, hidden tiles and column layout would become everybody's.
            The rail's arrangement is withheld there - the profile serves one
            cluster.

            **And false where it runs as several replicas behind one address**
            (`replicated`), on any profile: each of those is a file in one pod's
            state directory.

            Wherever it is false, a client draws no rail arrangement and keeps each
            person's column layout and density in that browser's own storage
            instead, sending none of the twelve writes.

            Always sent; absent reads as true for a server older than this member.
        kindPreferences:
          type: boolean
          default: false
          description: >-
            Whether this console keeps each person's choices about the kinds
            column - showing the kinds with no object, and the favorite kinds -
            on the server (`getKindPreferences`). False, a
            client keeps them in its own browser. Never omitted.
        replicated:
          type: boolean
          default: false
          description: >-
            This console runs as **several replicas behind one address**. What one
            pod's state directory holds is then not offered: the per-cluster
            extension switches and the three settings writes are not registered
            (and the preference writes neither - see `preferences`), and every
            replica draws the defaults. Always sent; absent reads as false, one
            replica, for a server older than this member. The server profile (`mode: shared`)
            registers none of the settings writes on one replica either, because
            there they would be every person's: a client reads both members. It
            does register the extension switches on one replica, reviewed
            for each person; whether a person may press one is the extension
            listing's `writable`.
        toolWindow:
          type: boolean
          description: >-
            The console is in the desktop's own native window, which can draw a
            forward's flow UI in a window beside it (`openForwardWindow`). False
            in a browser, under the server profile, and on Linux.
        portForwardLimit:
          type: integer
          description: Live forwards permitted. Process-wide, or per identity in a shared profile.
        readOnly:
          type: object
          description: |
            The guardrail as this **profile** is configured, as flat facts rather
            than an object with fields to reach into: a caller that has to dig for a
            field is a caller that will be handed a null one.

            **It is profile-wide and the guardrail is per cluster.** Two clusters in
            one profile can differ, and folding them here - by reporting refused
            only when *every* cluster is - reports a console where one production
            cluster is guarded as fully writable. The per-cluster fact is
            `Cluster.readOnly` and `HealthCheck.readOnly`; this pair is the profile
            default and what a control ungated by any cluster should obey.

            `fence` is the read-only override in front of a terminal session's
            `kubectl` and `helm`, as probed at start-up, and it has **three** arms:
            `unknown` is not a flavor of `off`. The probe can fail to run at all -
            on a build with no terminal layer, a shell family where no probe is
            written, or a session that resolved neither binary. Telling an operator
            the guardrail is missing when the probe itself never ran sends them to
            fix something that is fine, which is the same defect as reporting an
            unread cache as an absent session.
          required: [writesRefused, detailWritesRefused, fence]
          properties:
            writesRefused: { type: boolean }
            detailWritesRefused: { type: boolean }
            fence:
              type: string
              enum: [on, off, unknown]
              description: >-
                `on`: a read-only session's kubectl and helm are KubeTower's overrides
                and each refused a mutating verb when probed. `off`: a session
                resolves something that did not refuse - the override is missing or
                shadowed, and commands that change the cluster will run. `unknown`:
                nothing could be established; say so, promise neither.
            measured:
              type: boolean
              default: true
              description: >-
                False exactly when `fence` is `unknown`: nothing could be established
                about the guardrail. The two booleans above are then the configured
                intent rather than a measured fact, and a client must say so rather
                than promise either.
            detail:
              type: string
              description: >-
                One operator-facing sentence, set in all three cases: what was
                refused, what was not, or why nothing could be asked.
            unmatched:
              type: array
              items: { type: string }
              description: >-
                The `KT_READONLY_CLUSTERS` entries that named no context in the
                kubeconfig. Each is a cluster an operator believes is protected and
                nothing is, so a client says so where it shows the read-only state.
                Absent when every entry matched or none was set.
        archive:
          type: boolean
          description: >-
            Whether this profile keeps a window of cluster events, and optionally pod
            output, at all. A drawer tab fetching a history from a console that keeps
            none renders an empty panel, which reads as "nothing happened" - the exact
            collapse the envelope exists to refuse, one layer up.
        version: { type: string }
        revision: { type: string }
        release:
          type: string
          description: >-
            This build's bare version (`0.2.0`), as CHANGELOG.md spells it. Absent
            on a development build, which shows no "What's new" (#80).

    # ---- Clusters, nav, extensions ---------------------------------------

    ClusterColour:
      type: string
      description: >-
        A key on the nameplate palette: eight hues, a deep and a pale version of
        each (`internal/nameplates`). **A key and never a CSS value** - the client
        maps each key to a theme token (`--color-plate-*`), so no string from
        a cluster or a request ever reaches a class name or a style attribute.
        Sixteen and no more because the swatch grid is something a person points
        at, and the automatic color is drawn from the same sixteen, so a client
        has one map and no arithmetic.
      enum:
        - red
        - amber
        - lime
        - green
        - teal
        - blue
        - violet
        - pink
        - red-pale
        - amber-pale
        - lime-pale
        - green-pale
        - teal-pale
        - blue-pale
        - violet-pale
        - pink-pale

    Cluster:
      type: object
      required: [name, label, state, initials, colour]
      properties:
        name:
          type: string
          description: The context name. The identity used in every path.
        label:
          type: string
          description: The operator's nameplate, or the context name when there is none.
        # No `group`: the rail arranges clusters onto numbered hotbars and has no
        # grouping of any kind, so nothing could fill one.
        initials:
          type: string
          minLength: 1
          description: >-
            The nameplate's short form, drawn on the tile. Derived from the context
            name unless the operator set one; carried rather than derived in the
            client so that the tile, the naming form and the chooser cannot disagree.
            Required and never empty: the rail tile draws nothing else, so a
            cluster without initials would be a blank square.
          maxLength: 8
        colour:
          $ref: '#/components/schemas/ClusterColour'
          description: >-
            The tile's color, as a palette key. **Always sent and always on the
            palette**: the person's swatch where one was chosen, and otherwise the
            automatic color, which the server derives from the context name onto
            the same sixteen keys, so a client always has something to draw.
        hidden: { type: boolean }
        order: { type: integer }
        bar:
          type: integer
          minimum: 1
          description: >-
            Which hotbar this cluster's tile is on. Absent means it is on none, which
            is what `hidden` also says and is the state a hidden tile is in.
        readOnly:
          type: boolean
          description: >-
            Writes to this cluster are refused. **Per cluster**, which is where the
            guardrail is; see `Capabilities.readOnly` for why the profile-wide pair
            is not a substitute.
        state:
          $ref: '#/components/schemas/State'
          description: >-
            This cluster's own reachability. One unreachable cluster does not make
            the list unreadable, which is why the state repeats here. `pending` is
            the ordinary state of every cluster at start-up: the probe runs on its
            own loop and this list answers out of what is already known rather than
            waiting for fourteen clusters to time out.
        reason: { $ref: '#/components/schemas/Reason' }
        remedy:
          $ref: '#/components/schemas/Remedy'
          description: >-
            Who fixes this cluster, where the classification produced an answer. The
            same shape `HealthCheck.remedy` carries, from the same function, so the
            home's cluster card and the health report cannot describe one cluster
            two ways.
        loopback:
          type: boolean
          description: >-
            A cluster whose API server is on the local machine, drawn with a
            `local` badge so a reader can see which clusters are reached that way.
        aws:
          type: boolean
          description: >-
            The context signs in through the AWS CLI: its kubeconfig user runs `aws`
            as its credential plugin. Absent otherwise. It says which clusters an
            AWS SSO session notice can concern; which SSO
            session a context's profile belongs to is not carried.
        checkedAt:
          type: string
          format: date-time
          description: >-
            When the probe established `state`; absent where nothing was probed.
            **A red verdict younger than 30 seconds stands in for a read**: the
            overview of an `unreachable` cluster checked
            that recently loads nothing and says so, and the server answers its
            overview from the verdict without dialling the cluster. Older, the
            page reads the cluster - a verdict from minutes ago is a reason to look
            again, not an answer.

    ClusterEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Cluster' }

    ClusterListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Cluster' }

    Ref:
      type: object
      description: >-
        A thing you can click through to. The most reused shape in the whole view
        layer, defined once so that no two copies can diverge.
      required: [text]
      properties:
        text: { type: string }
        href: { type: string }
        hint: { type: string }
        namespaced:
          type: boolean
          description: >-
            Set, true, on a menu entry that opens the list of a namespaced kind, or
            the Helm releases, which are read by namespace too, and on nothing
            else. It is what lets the browser carry the namespace chosen on one
            list to the next without guessing a kind's scope
            from its name. Absent is not "cluster-scoped": it is also every Ref
            that is not such a list, and a client reads it as "do not carry a
            namespace here", which is the safe answer for both.
        aliases:
          type: array
          items: { type: string }
          description: >-
            The other names kubectl answers to for the kind a menu entry opens,
            lower-cased: `svc` and `service` for Services, a CRD's own `shortNames`,
            singular and kind. The menu's jump box matches them as well as `text`
            so a kind is found by the name a person types
            at a terminal. Absent on every Ref that is not a kind's list.

    NavGroup:
      type: object
      required: [key, label, items, deferred]
      properties:
        key: { type: string }
        label: { type: string }
        note:
          type: string
          description: >-
            Why a group is short or empty, when it is. Two different facts arrive
            here and the sentence is what tells them apart: a cluster serving no
            custom resource kinds at all, and a cluster whose kinds could not be
            listed. Both leave `items` empty, and a group drawing them identically
            would be the founding defect wearing a navigation's clothes.
        accessNote:
          type: string
          description: >-
            Kinds were left out of this group because this console may not list
            them, in one sentence that says how many and that the read has to be
            granted. Drawn first in the group and in the warning tone, where the
            group is read - not as a line under its entries, where it is easily
            missed. Set only where kinds were left out; a
            group whose every kind was refused carries it with `items` and
            `groups` empty.
        items:
          type: array
          items: { $ref: '#/components/schemas/Ref' }
        groups:
          type: array
          description: >-
            One nested level, and no more. It exists for exactly one thing: the
            cluster's custom resource kinds, grouped by API group inside a single
            heading. Flat, a cluster running cert-manager, Calico, Argo and Trivy
            contributes a hundred-odd entries under one disclosure - one production
            cluster serves 140 - and a menu that can nest arbitrarily is a menu that
            will.
          items: { $ref: '#/components/schemas/NavGroup' }
        deferred:
          type: boolean
          default: false
          description: >-
            This group's `items` are **not in this response**: ask `getNavGroup` for
            them, and only once its disclosure is opened. Set on the custom resource
            heading and on nothing else, and it is a measurement rather than a
            preference - filling that heading lists the cluster's
            CustomResourceDefinitions, which on one production cluster is 23.7 MB
            and 603-668 ms for a disclosure that is closed.

            A client that ignores this draws an empty heading, and an operator reads
            it as a cluster with no custom resources. While it is true, an empty
            `items` is **not** an answer about the cluster.

    NavGroupEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/NavGroup' }

    NavMenu:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/NavGroup' }
        discovery: { $ref: '#/components/schemas/NavDiscovery' }

    NavDiscovery:
      description: >-
        Present while the kinds this cluster serves are not all known; absent when
        discovery is complete. `pending` means discovery is still running, `failed`
        that it answered with an error or not all of it. The menu lists what it
        knows either way.
      type: object
      required: [state, detail]
      properties:
        state: { type: string, enum: [pending, failed] }
        detail: { type: string }

    NavEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/NavMenu' }

    KindOccupancy:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [some, none, unknown]
          description: >-
            `some`: at least one object the person asking may see. `none`: the
            cluster holds none, or none in a namespace the person may list.
            `unknown`: it could not be read - **never zero**, and never hidden.
        reason:
          type: string
          maxLength: 300
          description: >-
            Why it is `unknown`, in one sentence. Absent on `some` and `none`.

    NavOccupancy:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: object
          description: >-
            Keyed by the kind's slug, the last path segment of its menu entry's
            `href`. A kind the menu draws and this does not name is `unknown`.
          additionalProperties: { $ref: '#/components/schemas/KindOccupancy' }
        note:
          type: string
          description: >-
            Why kinds the menu may draw are missing from `kinds`, when some are:
            the cluster's custom resource kinds could not be listed. Those are
            `unknown`, and drawn.

    NavOccupancyEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/NavOccupancy' }

    Extension:
      type: object
      required: [key, label, enabled]
      properties:
        key:
          type: string
          description: >-
            Stable, and the same string on both sides of the extension contract. It
            is persisted per cluster, so changing one silently un-enables a page.
        label: { type: string }
        summary:
          type: string
          description: >-
            One sentence saying what turning it on adds - the extension's own,
            drawn on its tile. Absent where the extension says nothing.
        needs:
          type: string
          description: >-
            What the cluster must run for the page to say anything, drawn on the
            tile before the switch is pressed. Absent where the extension says
            nothing.
        enabled: { type: boolean }
        pinned:
          type: boolean
          default: false
          description: >-
            The deployment decided `enabled` - `KT_EXTRAS` names this extension,
            on or off - so nothing on this console can change it. On the desktop
            and in a container only: under the `shared` profile `KT_EXTRAS`
            names what may be turned on and pins nothing. Always sent;
            absent reads as false, for a server older than this member.
        writable:
          type: boolean
          default: false
          description: >-
            Whether the person asking may turn this extension on or off on this
            cluster, and change its settings: the
            write is registered here, nothing pins it, the chart's values allow
            it, and under the `shared` profile the person holds `use` on it. A
            hint for the page; the writes refuse on their own. Always sent;
            absent reads as false, for a server older than this member.
        locked:
          type: string
          enum: [pinned, values, use, unregistered]
          description: >-
            Why `writable` is false, absent where it is true: `pinned` -
            `KT_EXTRAS` pins it; `values` - the chart's values do not name it;
            `unregistered` - no per-cluster switch here: several replicas, or
            the `shared` profile with no state volume. For those three the page
            draws the button, disabled, with `reason`. `use` - the person does
            not hold `use` on it, or that could not be reviewed: no button.
        reason:
          type: string
          description: >-
            The sentence the page draws beside the switch when `writable` is
            false - for `values`, "Not enabled in this installation's chart
            values.". Absent where it is writable.
        settings:
          type: array
          default: []
          description: >-
            What the extension offers beyond its switch, in the order its tile
            draws them, each at its value on this cluster. Always sent, empty for
            an extension that offers none; absent reads as none, for a server
            older than this member.
          items: { $ref: '#/components/schemas/ExtensionSetting' }
        nav: { $ref: '#/components/schemas/Ref' }

    ExtensionSetting:
      type: object
      description: >-
        One setting of one extension, on one cluster: a checkbox, or a line
        of text (`kind`). Written with `setExtensionSetting`, where that is
        registered.
      required: [key, label, kind, value, default]
      properties:
        key:
          type: string
          description: >-
            Stable within the extension, and stored per cluster under it, so
            renaming one returns every saved choice to its default.
        label: { type: string }
        summary:
          type: string
          description: What turning it off changes. Absent where the extension says nothing.
        value:
          type: boolean
          description: What was chosen on this cluster, or `default` where nothing was.
        default:
          type: boolean
          description: The value on a cluster where nobody has chosen.
        pinned:
          type: boolean
          description: >-
            True where the deployment's `KT_EXTRA_SETTINGS` decides this setting
            for every cluster: `value` is what it says, `setExtensionSetting`
            refuses it, and the Settings page draws it with no control. Absent
            where it does not. For a line of text: its `env` is set.
        kind:
          type: string
          enum: [bool, text, choice]
          description: >-
            `bool` is a checkbox, read from `value`; `text` is a line of text,
            read from `text`, whose `value` and `default` are false; `choice` is
            one of `options`, kept in `text` like a line of text, and any other
            value is refused (400).
        text:
          type: string
          description: >-
            A text setting's value on this cluster. Absent where nothing is set:
            the extension then uses its own default, which `placeholder` says.
        placeholder:
          type: string
          description: What a text setting's extension uses when nothing is set. Absent where it does not say.
        env:
          type: string
          description: >-
            The environment variable that decides a text setting on every
            cluster when it is set, ahead of `text`. Absent where there is none.
        options:
          type: array
          description: What a `choice` setting accepts, in the order drawn.
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string

    ExtensionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Extension' }

    ExtensionSuggestion:
      type: object
      additionalProperties: false
      required: [key, label, evidence]
      properties:
        key: { type: string }
        label: { type: string }
        evidence:
          type: string
          description: >-
            The extension's own sentence saying what it found, for instance
            "2 Redis or Valkey Services in 2 namespaces"; with `absent`,
            "<component> absent".
        absent:
          type: boolean
          description: >-
            The extension looked and the cluster runs nothing it reads. Not a
            suggestion: Settings > Extra draws its tile grayed, last, still
            switchable.

    ExtensionSuggestionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ExtensionSuggestion' }

    # ---- Settings --------------------------------------------------------

    Settings:
      type: object
      required: [general, nodeShell, info]
      properties:
        general: { $ref: '#/components/schemas/SettingsWrite' }
        retentionChoices:
          type: array
          description: >-
            The retention values this build offers. **A list and not a range**: a
            free-form number invites a typo that silently means "keep nothing" or
            "keep a year", and neither is a mistake worth allowing on a page about
            disk usage. A client renders these and sends one of them back.
          items:
            type: object
            required: [days, label]
            properties:
              days: { type: integer, minimum: 0 }
              label: { type: string }
        archive:
          allOf:
            - $ref: '#/components/schemas/Envelope'
            - $ref: '#/components/schemas/ValueArms'
            - type: object
              properties:
                data:
                  type: object
                  description: >-
                    What the archive currently holds and where. Its own envelope
                    because an archive with nowhere to write is a state, not a zero -
                    and a page reporting 0 bytes over a refused write is the most
                    reassuring possible way to be wrong.
                  properties:
                    path: { type: string }
                    bytes: { type: integer, minimum: 0 }
                    days: { type: integer, minimum: 0 }
                    oldestAt: { type: string, format: date-time }
                    writesRefused: { type: boolean }
                    note: { type: string }
        nodeShell: { $ref: '#/components/schemas/NodeShellSettings' }
        applied:
          type: object
          description: |
            What the last write did. Filled on the response to a write and absent on
            a plain read.

            **`persisted: false` is not a failure and must not be drawn as one.**
            Every store here applies in memory first and then writes; a value that
            validated is in effect whether or not the file could be written. Report
            that as an error and the operator retypes a setting that is already
            working. What they need to be told is the narrower true thing: it will
            not survive a restart.
          properties:
            persisted: { type: boolean }
            note:
              type: string
              description: >-
                One sentence about what happened - including the case where the save
                succeeded and changes nothing, which is worth saying out loud: turning
                the archive off stops writing and discards nothing.
        info:
          type: object
          description: >-
            The first-run information, a tab of this page rather than a page of its
            own. Read-only facts about the installation.
          properties:
            statePath: { type: string }
            statePersistent:
              type: boolean
              description: |
                Whether the state directory survives a restart, **as the deployment
                says**. The console cannot detect a volume and does not guess: the
                Helm chart sets it from `persistence.enabled`, and a process told
                nothing - every desktop - is persistent, which is what a directory
                under the operator's home is.

                **False takes things away, it adds nothing.** No archive - `archive`
                is `absent` with `not_supported_here`, `general` carries no member and
                `retentionChoices` is absent - no node-shell image
                (`nodeShell.available: false`), and neither write is registered. What
                is left is what works for as long as the process does: the rail, the
                columns and the names, which are rebuilt by using the console rather
                than promised to outlive it.

                Always sent. A member that is absent when true would let a client
                decide for itself what silence means.
            kubeconfigFiles:
              type: array
              description: >-
                Every file the configuration names, in order. It is a list, not a
                path, and a console that shows only the first one is wrong on most
                machines.
              items: { type: string }
            kubeconfigShadowed:
              type: array
              description: |
                Contexts one file declared and another already had, with the
                sentence saying so. **The merge keeps the first file's entry whole
                and discards the second's**, so the loser is not a duplicate row and
                not an error - it is an absence: nothing in the rail, nothing in an
                address, nothing to click.

                The sentence is composed on the server and travels composed, so that
                the page and the start-up log cannot describe one merge two ways.
              items:
                type: object
                required: [context, sentence]
                properties:
                  context: { type: string }
                  keptFrom: { type: string }
                  shadowedIn: { type: string }
                  sentence: { type: string }
            listenAddress:
              type: string
              description: >-
                The address this console is bound to, as bound: never `KT_LISTEN`
                as typed, which can name two addresses on a dual-stack machine.
            withoutPassword:
              type: boolean
              description: >-
                This console asks nobody for a password: the loopback desktop,
                whose windows open signed in. Always sent. No page draws it: the
                Infos tab shows the version, and the install report says the same
                fact in words of its own.
            version:
              type: string
              description: >-
                The whole line the binary's `--version` prints, as **one opaque
                string**. Not four fields: four would let a page compose a second
                spelling of the same fact, and the two would eventually disagree.
                Empty means a caller that did not say, and the page then draws no
                build section rather than an empty one.
            development:
              type: boolean
              description: >-
                This binary carries no stamped version. A separate flag rather than
                something read back out of `version`, because a page parsing a
                string it was handed is a second opinion about it.
            stateWrittenBy: { type: string }
            stateIsNewer:
              type: boolean
              description: >-
                The state directory was last written by a newer build than the one
                running. On the page and not only in a log, because the failure it
                warns about is silent: every store here loads defensively, so an
                older build meeting a newer format replaces the arrangement with
                defaults rather than complaining.
            repositoryUrl:
              type: string
              description: >-
                Where KubeTower lives. Sent rather than written into the page,
                because the update check below asks the same repository and two
                spellings of one address are two addresses the day somebody moves
                it. Always present, including when the check is off - it is a link
                beside the version, not a part of the check.
            documentationUrl:
              type: string
              description: >-
                The public documentation on kubetower-site, drawn as a link beside
                the repository and its issues. Sent rather than written into the
                page, because the desktop's Help menu opens the same address and
                it has one spelling, on the server.
            update: { $ref: '#/components/schemas/SettingsUpdate' }
    SettingsUpdate:
      type: object
      description: |
        Whether a newer release exists. The check itself only offers:
        `releaseUrl` is where the operator can go. On the desktop, `install`
        carries the two clicks that download, verify and install it (#47).

        Present and on the `off` or `notApplicable` arm when the check did
        not run, which is a different thing from not having been told.
      required: [state, checking]
      properties:
        state:
          type: string
          enum: [off, notApplicable, current, newer, failed]
          description: |
            Five answers, and three of them are the honest reply to a
            question that could not be asked:

              * `off` - the operator turned the check off. **No request was
                made**, and the switch is honored before one is.
              * `notApplicable` - nothing to compare. A development build,
                or a console running in a cluster, which is upgraded by its
                image tag and has no business calling github.com on boot.
              * `current` - asked, answered, this is the latest release.
              * `newer` - asked, answered, a newer release exists.
              * `failed` - asked and could not find out.

            **`failed` is not `current`** and an interface must not render
            them the same way: showing the running version with no
            annotation reads as confirmed current, which is the failure
            `docs/DEFINITION-OF-DONE.md` §3 is about.
        latest:
          type: string
          description: >-
            The release GitHub named, without the git tag's leading `v`.
            Present on `current` and `newer`.
        releaseUrl:
          type: string
          description: That release's own page.
        checkedAt:
          type: string
          format: date-time
          description: >-
            When the request that produced this was made. Absent when no
            request was made at all, so a page knows not to date an answer
            nothing asked for.
        note:
          type: string
          description: >-
            The one sentence about this outcome, composed on the server and
            traveling composed - the start-up log and this page say the
            same thing about the same check, and two composers drift.
        checking:
          type: boolean
          description: >-
            A request to GitHub is in flight right now - at startup, on the schedule
            that re-checks a console left open, or after **Check now**. The page
            draws it as a running check; the other members are the previous answer
            until it lands.
        install: { $ref: '#/components/schemas/UpdateInstall' }
    UpdateInstall:
      type: object
      description: |
        Where the desktop's update download and install stands (#47), and what
        a restart would end. Present in `info.update.install` only where this
        console can install; absent on the server profile and in a container.
      required: [phase, enabled, when, password, supported, installation, ends]
      properties:
        phase:
          type: string
          enum: [idle, downloading, verifying, ready, installing, failed, manual]
          description: >-
            `manual`: the installation's folder is not writable; the verified
            file waits in `folder`.
        enabled:
          type: boolean
          description: >-
            The "Install updates automatically" setting (#122): a newer release
            the update check found is downloaded and verified on its own, and
            installed at the moment `when` names. Off, Download and Install
            stay by hand.
        when:
          type: string
          enum: [quit, now]
          description: >-
            When an automatic update installs: `quit`, as KubeTower quits,
            starting nothing (the default); `now`, as soon as no terminal and
            no port-forward is open, restarting KubeTower.
        password:
          type: boolean
          description: >-
            Installing asks for a password (a .deb or .rpm, through pkexec). An
            automatic update then stops at `ready`, for Install: a password is
            never asked unprompted.
        supported:
          type: boolean
          description: >-
            This installation has an asset in a release and an installer in this
            build. False draws no Download.
        installation:
          type: string
          description: >-
            How this KubeTower was installed: `windows-setup`, `windows-zip`,
            `macos-app`, `macos-tar`, `linux-appimage`, `linux-deb`,
            `linux-rpm`, `linux-tar`, or empty when unknown.
        version:
          type: string
          description: The release being downloaded or ready.
        asset:
          type: string
          description: The release asset's file name.
        done:
          type: integer
          format: int64
          description: Bytes received, while downloading.
        total:
          type: integer
          format: int64
          description: The asset's size, as the release declares it.
        reason:
          type: string
          description: The one line of a failure.
        folder:
          type: string
          description: The folder that holds the verified file, in the manual phase.
        ends:
          type: object
          description: What the restart closes for good.
          required: [terminals, forwards]
          properties:
            terminals: { type: integer }
            forwards: { type: integer }
    UpdateInstallWrite:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: The "Install updates automatically" setting.
        when:
          type: string
          enum: [quit, now]
          description: When an automatic update installs. Absent, the moment set is kept.
    SettingsWrite:
      type: object
      description: |
        What the General tab writes is the archive: whether cluster events
        are kept, whether pod output is captured with them, and for how long. Those
        three, and nothing else. The node shell has its own body and its own route -
        deliberately, so that a build with no archive does not refuse the node-shell
        save along with the archive's.
      additionalProperties: false
      properties:
        archiveEnabled:
          type: boolean
          description: >-
            Keep a window of cluster events. Turning it off stops writing; it
            discards nothing, which is why emptying the archive is a separate,
            confirmed act rather than a consequence of this checkbox.
        captureLogs:
          type: boolean
          description: Capture pod output alongside the events. Off by default; it is the expensive half.
        retentionDays:
          type: integer
          minimum: 0
          maximum: 3650
          description: One of `Settings.retentionChoices`. See there for why it is a choice.

    NodeShellSettings:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
        image: { type: string, maxLength: 512 }
        namespace: { type: string, maxLength: 253 }
        available:
          type: boolean
          description: >-
            This build has a terminal layer at all, and the state directory the image
            is kept in survives a restart (`Settings.info.statePersistent`). False
            means the section is left off the page entirely rather than drawn as a
            field that refuses - a control that cannot work is worse than an absent
            one, and a setting that forgets itself at the next restart cannot work.
          readOnly: true
        defaultImage:
          type: string
          description: >-
            What the way-back link offers, so an operator can see what they are
            moving away from before they do.
          readOnly: true
        persisted:
          type: boolean
          description: >-
            See `Settings.applied`. A validated image is in effect whether or not it
            could be written down, and the two failures are reported separately.
          readOnly: true
        note: { type: string, readOnly: true }

    ClearRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          type: string
          enum: [preferences, clusterState, archive, all]
          description: >-
            `archive` empties this console's own kept window of events and log
            lines - what it recorded after the cluster forgot it.

            **It is deliberately not part of `all`.** The other three are
            preferences: losing them costs a column width and a rail tile, and
            they are rebuilt by using the console. The archive is the only store
            here holding something no other system has, and folding it into a
            word that reads as *tidy up* is how it gets deleted by somebody who
            meant the other thing.
        confirmed:
          type: string
          description: >-
            What the operator typed, for a plan whose `confirmation` asks for
            more than an acknowledgement. Checked against the plan's own
            `confirmation.expected` by the server, so a front end that skipped
            the gesture is refused rather than obeyed.
        preview:
          type: boolean
          default: true
          description: True returns a plan and changes nothing.
        token:
          type: string
          description: Required when `preview` is false. The token from the plan.

    # ---- Health ----------------------------------------------------------

    Remedy:
      type: object
      description: |
        **Who fixes it, and what they would do.**

        This is the reason the health report exists: a state and a sentence alone
        leave the column a person actually reads with nowhere to go.

        A Kubernetes client failure is several unrelated problems wearing one coat.
        A name that does not resolve is a network question; a lapsed session is
        renewed by the operator in ten seconds; an IAM grant cannot be influenced
        from this machine at all, and fails identically without this console - so
        time spent debugging the console over one of those is time wasted. Raw, all
        three read as one red row.

        `Reason.code` says which failure it is and `Reason.message` describes it.
        Neither says **whose it is**, and that is a separate judgment the server
        makes once rather than every client making it differently.

        It is deliberately **not** a member of `Reason`. Putting it there would
        invite every handler in the contract to compose one, and a remedy composed
        by a handler that does not know the answer is worse than none: the value
        here is that these sentences were written once, against measured failures,
        and name the exact command and the exact place its output goes.
      required: [who, what]
      properties:
        who:
          type: string
          description: >-
            The person, named the way an operator would say it - "You", "Your cloud
            administrator", "Whoever runs the network". Not a role identifier; it is
            read, not matched.
        what:
          type: string
          description: >-
            What that person would do, in enough detail to act on without leaving
            the page. Where there is a command, it is spelled out; where the useful
            answer is an order to check things in, that order is the answer.
        actionable:
          type: boolean
          description: >-
            The operator can fix this one themselves, now, without asking anybody.
            **A derived fact and not a restatement of `who`**: it is what lets a
            page mark the rows worth acting on, and a client cannot recompute it
            from the state without re-implementing the classification.
        command:
          type: string
          description: >-
            The one command that fixes it, spelled to be copied, where there is
            one: `aws sso login --profile <profile>` for an AWS context whose SSO
            session has lapsed, with the kubeconfig's own profile when it names
            one. Absent everywhere else, including a 401 from a context that is
            not an AWS one.

    HealthNotice:
      type: object
      description: |
        Something about the machine or the installation that no cluster error can
        report, because the failure happens before any cluster is contacted - a
        credential cache that will not read, a sign-in session that has lapsed, a
        guardrail that could not be probed.

        **`measured` is the third arm and it is the whole reason this is a shape
        rather than a string.** Each of the places this models can be wrong in the
        reassuring direction: a cache directory that could not be listed, reported
        as "there is no session", removes the warning naming the command, on the
        page whose entire product is being believed. `measured:
        false` says this could not be established at all, which is neither fine nor
        broken and must not be drawn as either.
      required: [key, title, severity]
      properties:
        key:
          type: string
          description: Stable, so a client can style or dismiss one kind of notice.
        title: { type: string }
        detail:
          type: string
          description: What was found, verbatim where there is something verbatim to carry.
        command:
          type: string
          description: >-
            Exactly what to type. **Absent rather than guessed**: a command offered
            for a problem it does not solve is how a warning stops being read, and
            the case that proved it is a notice that cannot be measured, where the
            fix may be a mount rather than a sign-in.
        paths:
          type: array
          description: >-
            The files or directories the notice is about, named rather than
            summarized. "The cache could not be read" without the path is not
            something anyone can act on.
          items: { type: string }
        severity: { type: string, enum: [info, warn, bad] }
        measured:
          type: boolean
          default: true
          description: >-
            False means this could not be established. See the schema description;
            it is not a flavor of "nothing found".
        remedy: { $ref: '#/components/schemas/Remedy' }

    HealthCheck:
      type: object
      required: [key, label, state]
      properties:
        key: { type: string }
        label: { type: string }
        state: { $ref: '#/components/schemas/State' }
        reason: { $ref: '#/components/schemas/Reason' }
        cluster: { type: string }
        remedy:
          $ref: '#/components/schemas/Remedy'
          description: >-
            Absent on a check that answered, and on one whose failure has no known
            remedy - which is itself said in `reason`, not by an invented sentence.
        readOnly:
          type: boolean
          description: >-
            This cluster is guarded read-only. **Per cluster**, which is where the
            guardrail actually is; `Capabilities.readOnly` is the profile-wide fact
            and the two are not interchangeable.
        version:
          type: string
          description: >-
            The API server's version, where it answered. Not decoration: a console
            pointed at a cluster several minors ahead fails on APIs that have moved,
            and the failure looks like a defect in the console.
        metricsSource:
          type: string
          description: >-
            What is behind this cluster's charts, so an empty chart has an
            explanation instead of looking broken.
        checkedAt:
          type: string
          format: date-time
          description: When this answer was obtained. Absent on a check in `pending`.
        tookMs:
          type: integer
          minimum: 0
          description: How long the probe took, where it completed.

    HealthSSO:
      type: object
      description: |
        The AWS SSO sessions this machine's AWS CLI holds, for the home's session
        card. **Absent under the server profile**: a pod has
        no operator and no `~/.aws/sso`, so there is no session to report and no
        absence to report either.

        **`measured` is the third arm, as on HealthNotice.** `measured: false` is
        a cache that could not be read, and `sessions` is then empty without that
        meaning there are none: an unread answer is not an empty one. Read and
        holding nothing is `measured: true` with no sessions.

        Names, states and expiries only. No path, no token, nothing from the
        cache files beyond the session's own name.
      required: [measured, sessions]
      properties:
        measured:
          type: boolean
          description: The cache was read. False means nobody could tell.
        problem:
          type: string
          description: >-
            Why it could not be read, without the path. Set only on
            `measured: false`.
        sessions:
          type: array
          description: >-
            One per session name, furthest expiry first. Empty when the cache holds
            none, or when it could not be read.
          items: { $ref: '#/components/schemas/HealthSSOSession' }

    HealthSSOSession:
      type: object
      required: [name, state]
      properties:
        name:
          type: string
          description: >-
            The `sso_session` name, or the start URL where the cache carried no
            name.
        state:
          type: string
          enum: [valid, renewable, expired]
          description: >-
            `renewable` is past its own expiry with a refresh token the AWS CLI
            uses silently on its next call: nothing to do, and not `expired`.
        expiresAt:
          type: string
          format: date-time
          description: When the access token expires, or expired.
        command:
          type: string
          description: >-
            Exactly what to type to sign in again. Set on `expired` only: a
            command offered where there is nothing to do is how one stops being
            read.

    HealthReport:
      type: object
      description: |
        **The counts are here because a report that is only a list of rows cannot
        say what is missing from it.**

        A context nobody has probed yet has no row: it is counted, never given a
        state. So `checks.length` is not how many clusters there are, and a client
        with only the rows necessarily writes "0 of 14 answering" during the first
        round - a wall of red invented out of not having looked. `total` and
        `pending` are what make the honest sentence possible, and `refreshing` is
        what stops "nothing yet" reading as "gave up".

        A row may also arrive with `state: pending` where the report lists it and
        has no answer for it; both shapes are permitted, and a client that handles
        the counts handles the first for free.
      required: [checks]
      properties:
        checks:
          type: array
          items: { $ref: '#/components/schemas/HealthCheck' }
        total:
          type: integer
          minimum: 0
          description: >-
            How many contexts the configuration declares. Above `checks.length`
            while a first round is in flight.
        probed:
          type: integer
          minimum: 0
          description: How many have been asked at all.
        answered:
          type: integer
          minimum: 0
          description: How many of those answered.
        pending:
          type: integer
          minimum: 0
          description: >-
            How many have not been asked yet. **Its own figure rather than a
            subtraction at the call site**, because the sentence it feeds is the one
            that stops an unasked cluster reading as a dead one.
        refreshing:
          type: boolean
          description: >-
            A round is running now. A page that says "nothing yet" and does not say
            it is still asking reads as a page that has given up.
        headline:
          type: string
          description: >-
            The one line above the table, composed by the server for the reason the
            confirmation sentence is - it has to agree with the counts beside it,
            and "9 of 14" against a list of 3 rows is the defect this whole schema
            is about.
        tone: { type: string, enum: [ok, warn, bad, muted] }
        counts:
          type: array
          description: >-
            The summary pills, worst first and in the same order as the rows, so the
            two read in the same direction.
          items:
            type: object
            required: [label, count]
            properties:
              label: { type: string }
              count: { type: integer, minimum: 0 }
              code: { $ref: '#/components/schemas/ReasonCode' }
              tone: { type: string, enum: [ok, warn, bad, muted] }
        notices:
          type: array
          description: Machine- and installation-level findings. See HealthNotice.
          items: { $ref: '#/components/schemas/HealthNotice' }
        sso: { $ref: '#/components/schemas/HealthSSO' }

    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/HealthReport' }

    # ---- Readings, series, cells ----------------------------------------

    Reading:
      type: object
      description: |
        A measurement and whether it can be believed. **A bare float is not
        acceptable anywhere a reading comes from a metrics source**: a number with no
        companion flag is a complete-looking value, and an untrustworthy reading
        drawn as a number is the empty-versus-failed collapse in a gauge, where it
        looks fine.
      required: [value, trustworthy]
      properties:
        value:
          type: [number, "null"]
          description: >-
            Null where there is no sample. JSON has no NaN and no infinity, and the
            Go encoder refuses both outright - so a non-finite sample must become
            null here or the whole response fails to marshal. A gap should cost one
            missing pixel, not an entire blank panel, which is why it is spelled out
            rather than discovered in production.
        trustworthy: { type: boolean }
        text:
          type: string
          description: >-
            The rendered form, computed once on the server so that a table cannot
            report three different units for the same quantity.

    Series:
      type: object
      required: [startedAt, stepSeconds, values]
      properties:
        startedAt: { type: string, format: date-time }
        stepSeconds: { type: number, minimum: 0.001 }
        values:
          type: array
          description: >-
            Gaps are null and are never omitted: omitting one shifts every later
            sample onto the wrong moment, and the chart still draws.
          items: { type: [number, "null"] }
        trustworthy: { type: boolean, default: true }

    Gauge:
      type: object
      description: |
        A bar drawn in a cell, with its percentage beside it: how full something is,
        when the reading is a fraction of a known whole. The reading itself goes to
        the cell's `hint`, as `used / total`.

        **A percentage and not a value with a denominator.** The fill is clamped on
        the server, so a value outside the track cannot be drawn outside it, and the
        arithmetic that decides what the whole *is* - a node's allocatable, its
        capacity, a claim's requested size - stays where the sources are rather than
        being reassembled per client.

        **`tone` is deliberately separate from `Cell.tone`.** They say different
        things: a cell's tone turns the reading into a colored pill and is what a
        worst-first ordering reads, while a node at 91% memory is a well-packed
        machine rather than an incident. Coloring the bar says "look here";
        promoting the row says "this is a fault", and only the first is true.

        **Absent, never zero.** A cell whose source did not answer draws no bar at
        all beside an em dash. An empty track reads as 0%, which reads as an idle
        machine, which is the opposite of the truth when nothing could be measured.
      required: [percent]
      properties:
        percent: { type: number, minimum: 0, maximum: 100 }
        tone: { type: string, enum: [ok, warn, bad] }

    CellPart:
      type: object
      description: >-
        One piece of a cell whose reading is several things a reader would click - an
        Ingress's hosts, say. A piece with no `href` is drawn as plain text beside
        the ones that have one, because a rule with no host is `*`, which matches
        everything reaching the controller and is not an address. **The separators
        are pieces too**, and the pieces concatenate to exactly `Cell.text`: a client
        that joined on ", " would render one comma the rest of the console does not,
        which is exactly the size of drift nobody reports and nobody can explain.
      required: [text]
      properties:
        text: { type: string }
        href: { type: string }

    Cell:
      type: object
      description: >-
        One cell of the grid. `text` is what is drawn; `sort` is what it sorts by, so
        that a size column sorts by bytes rather than by the string "9 MiB".
      required: [text]
      properties:
        text: { type: string }
        sort: { type: [string, number, "null"] }
        tone: { type: string, enum: [normal, muted, ok, warn, bad] }
        rank:
          type: integer
          minimum: 0
          description: >-
            How urgently this cell wants reading. The row's rank is the worst of its
            cells', and a worst-first ordering is what makes a screen of four hundred
            rows readable. Zero means this cell makes no claim.
        hint:
          type: string
          description: >-
            What hovering says, for the case a cell states a **number** the reader
            then has to go and look up - a node's taint count is "2" in a column and
            two lines of text in full. Absent on almost every cell, and deliberately
            not a general tooltip: a hint on a cell that already says everything is a
            tooltip that trains people to ignore tooltips. On a cell with a `gauge` it
            is the quantity the cell no longer draws, `used / total`, rendered here
            because `gauge` carries no whole, both halves in the whole's unit
            (`1.2 / 8 cores allocatable`).
        copy:
          type: string
          description: >-
            What a copy control puts on the clipboard, where the drawn text is not
            it. They genuinely differ on the cells that have one: a cell holding
            three hosts and `+2 more` is exactly the cell somebody needs the
            clipboard for, and the two that were left out are the point. Shown is not
            the same as obtainable.
        ref: { $ref: '#/components/schemas/Ref' }
        parts:
          type: array
          description: See CellPart. Absent on almost every cell there is.
          items: { $ref: '#/components/schemas/CellPart' }
        reading: { $ref: '#/components/schemas/Reading' }
        gauge: { $ref: '#/components/schemas/Gauge' }
        state:
          $ref: '#/components/schemas/State'
          description: >-
            A cell may be unreadable on its own while its row is fine - a usage column
            with no metrics source is `absent` in every row, and must not draw as 0.
            An object present in a reading for one measurement and unknown to the
            source for another is `absent` in that cell, not zero in it.
        reason: { $ref: '#/components/schemas/Reason' }

    Column:
      type: object
      description: |
        **The four flags below are facts about the kind, not about the cells in
        front of the renderer, and that is the whole reason they are here.**

        A table's widths are computed from what is on screen at first paint, and the
        values that arrive late are precisely the ones that need room: a Nodes list
        paints three em dashes where its usage bars will be, and an address column
        paints the word "pending" before a controller writes the address a copy
        control then has to sit beside. Sizing from the cells gives a column that
        fits what was there and is overrun two seconds later, staying wrong until
        the page is drawn again.

        So the column declares what its cells will cost. A client reserves the room
        from the declaration and never from the first answer.
      required: [key, label, visible, order]
      properties:
        key: { type: string }
        label: { type: string }
        visible: { type: boolean }
        order: { type: integer }
        width:
          type: [integer, "null"]
          description: |
            The operator's stored width for this column, or null for automatic.

            **It is a share of the table and not a number of pixels.** The unit is
            the CSS pixel, because that is what a pointer produces and what the
            server's bounds are written in; what it is read against is the other
            columns of the same table. A set summing to 1266 fills a 1266px panel
            at the numbers given and fills a 1676px panel with every column 1.324x
            wider - a table the operator has sized fills its panel at every window
            width, which is the whole of it.

            The narrowest a table is drawn is the sum of these numbers, so the
            server's 56px floor is a floor on screen too and the panel scrolls
            rather than the columns shrinking past it.

            Automatic widths are computed from the cells present at first render,
            which is arithmetic and belongs in the front end, not in this payload.
        align: { type: string, enum: [start, end] }
        sortable: { type: boolean, default: true }
        secondary:
          type: boolean
          default: false
          description: >-
            Worth having and not worth the width by default: drawn only once the
            operator asks for it, and it keeps its place and its width for when they
            do. **Not a synonym for unimportant** - it is a statement that this
            column costs more horizontal room than it repays across a screen of rows.
            It is also what lets a client tell "the operator hid this" from "it is
            off by default", which decides what resetting means.
        gauged:
          type: boolean
          default: false
          description: Cells of this column draw a bar when there is a measurement to draw one from.
        copyable:
          type: boolean
          default: false
          description: >-
            Cells of this column carry a copy control when they hold something worth
            copying. Declared per column and deliberately not offered on every cell:
            it belongs on the columns whose value exists to be pasted somewhere else,
            and a console with an icon on eight hundred cells has taught its operator
            to stop seeing icons.
        prose:
          type: boolean
          default: false
          description: >-
            This column holds a sentence, and its cells may wrap. Every other column
            in the grid does not wrap; a status message or a chart description in one
            of them is clipped to a line. **It travels in the payload rather than
            being guessed from the heading**, so a client does not re-decide per
            column what the server already knows.
        role:
          type: string
          enum: [name, namespace, age, other]
          default: other
          description: |
            What this column draws, for the two cases where a client must style or
            address a cell by what it *is* rather than by where it sits.

            The first cell of a row is drawn as the object's name; after a reorder,
            "first" is whatever was dragged there, and without this an age is styled
            as a name on every row of every table. The namespace column is the other:
            it is clickable - a table of four hundred pods across thirty namespaces
            is read by finding one interesting row and then wanting its neighbors -
            and `-1`-style "no such column" has to be expressible, which an absent
            role is.
        lockedNote:
          type: string
          description: >-
            Why this column cannot be hidden, where it cannot. The column menu draws
            it as a fact rather than as a control that refuses; a toggle that does
            nothing is worse than an explained absence.
        filterable:
          type: boolean
          default: false
          description: >-
            The filter control offers this column, and the list's `filter`
            parameter narrows by it: its cells hold a value worth choosing among -
            a node, a status, a QoS class - rather than a name, a sentence or a
            figure. **The server's statement**, so a client never guesses which
            columns are categories. Never true of a figure or of the namespace,
            which has a control of its own.
        filterValues:
          type: array
          items: { type: string }
          description: >-
            What the filter control offers for a `filterable` column: the values its
            cells hold across the rows that `search` and **every other column's**
            filters leave, sorted - so choosing one node does not take the other
            nodes off the menu. Absent on a column that is not filterable; present
            and empty on one whose rows were all filtered away. No counts.

    Row:
      type: object
      required: [id, cells]
      properties:
        id:
          type: string
          description: Stable within a list, for selection and for React keys.
        name: { type: string }
        namespace: { type: string }
        href: { type: string }
        rank:
          type: integer
          minimum: 0
          description: >-
            The worst rank any of this row's cells claimed, so a worst-first order is
            one comparison rather than a scan of every cell. Zero means no cell made
            a claim.
        tone: { type: string, enum: [normal, muted, ok, warn, bad] }
        cells:
          type: object
          description: Keyed by column key. A column with no cell renders empty, not missing.
          additionalProperties: { $ref: '#/components/schemas/Cell' }
        unchanged:
          type: array
          items: { type: string }
          description: >-
            The list's bulk verbs that would change nothing on this object: the half of
            a toggle it is already on - `suspend` on a CronJob whose `spec.suspend` is
            true, `resume` on one whose is not, `cordon` on a cordoned node, `uncordon`
            on a schedulable one. The selection bar offers such a verb only while at
            least one ticked row would be changed by it, and sends only those rows.
            Absent where every verb would act, and on every kind with no toggle.

    ListFilter:
      type: object
      description: One filter in effect on a list.
      required: [column, value]
      properties:
        column:
          type: string
          description: The `key` of the column filtered.
        value:
          type: string
          description: The value its cells were required to equal, as it was asked.

    BulkAffordance:
      type: object
      description: Which bulk verbs this list offers, and whether they are currently permitted.
      required: [verbs]
      properties:
        scope:
          type: string
          description: |
            **The identity of the table this selection belongs to**, and a client
            discards its selection whenever this changes.

            It is a safety property and not a cache key. A set of pod names carried
            across to another cluster's node list is a set of objects that do not
            exist - and, worse, might. The server names the scope because the server
            is what knows when the underlying set is a different one; a client
            composing it from the route would not notice a namespace selection
            changing under it.
        verbs:
          type: array
          items:
            type: object
            required: [verb, label, permitted]
            properties:
              verb: { type: string }
              label: { type: string }
              permitted: { type: boolean }
              destructive:
                type: boolean
                description: >-
                  Whether this verb destroys something, answered by the server for
                  the same (verb, kind) pair `DetailAction.destructive` is answered
                  for, and from the same producer. Without it the bar would draw
                  Delete, Restart and Clear identically - on the control that acts on
                  twelve objects at once rather than one. **A client reads this flag and
                  never the verb's name**: a bar that colors by string reddens a
                  custom resource's `delete-snapshot` by accident and says nothing
                  about a destructive verb somebody called `recycle`.
              reason: { $ref: '#/components/schemas/Reason' }

    Namespace:
      type: object
      required: [name]
      properties:
        name: { type: string }
        state:
          $ref: '#/components/schemas/State'
          description: One namespace's own state, where the console knows one. Usually absent.

    NamespaceListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Namespace' }
            readAt:
              type: string
              format: date-time
              description: >-
                When this list was read. It is what makes a `stale_reading` answer
                actionable rather than merely qualified - "kept from four minutes
                ago" and "kept from yesterday" are different things to act on.

    ListPage:
      type: object
      required: [kind, label, namespaced, columns, rows]
      properties:
        kind: { type: string }
        label: { type: string }
        namespaced:
          type: boolean
          description: >-
            Which detail form to address. The front end reads this rather than
            guessing from whether a row has a namespace.
        columns:
          type: array
          items: { $ref: '#/components/schemas/Column' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Row' }
        bulk: { $ref: '#/components/schemas/BulkAffordance' }
        create: { $ref: '#/components/schemas/CreateAffordance' }
        readOnlyNote:
          type: string
          description: Why writes are refused here, when they are.
        namespaces:
          type: array
          description: >-
            The namespaces this list is narrowed to, echoed back. **Several, not
            one** - see the `namespace` parameter. Empty means every namespace the
            caller may read, which is not the same as `default`.
          items: { type: string }
        unknownNamespace:
          type: string
          description: |
            A namespace was asked for that this cluster does not have.

            It exists because the selector can be typed into, and a name with a typo
            in it draws a table with no rows. "Nothing here" is then a claim about
            what a namespace contains, when the truth is that it is not one - the
            same collapse the envelope refuses.
        search:
          type: string
          description: The free-text filter in effect, echoed back.
        selector:
          type: string
          description: The label selector in effect, echoed back.
        filters:
          type: array
          description: >-
            The `filter` parameters that narrowed this list, echoed back - **only
            those that took effect**, each resolved to a column key - so a client
            draws a chip for exactly what the server did, and the address stays
            the shareable statement of it.
          items: { $ref: '#/components/schemas/ListFilter' }
        count:
          type: integer
          minimum: 0
          description: >-
            How many rows are drawn. Said out loud because a table with one row and a
            heading that says nothing leaves the operator counting.
        measurementNote:
          type: string
          description: >-
            Why this table's gauges are empty, on a kind that has them - and
            absent where they are not. Set exactly when `measurementState` is,
            and that member says which of two things the sentence is about.

            **An em dash with nothing beside it is the collapse this member
            closes.** A cluster with no metrics-server, a scrape that has not
            happened yet and a backend that refused all render one dash, and the
            cell has no room to say which. The sentence does not invent a cause:
            it says the figures are missing; the cluster's overview is where the
            missing metrics source is said.

            **The console does not draw it above the table**: the dashes already
            say there is no figure. It is the hover of each empty usage column's heading, so
            `pending` and `unmeasured` can still be told apart by whoever asks.
        measurementState:
          type: string
          enum: [pending, unmeasured]
          description: |
            Which of two answers `measurementNote` is, present exactly when it is.

            - `pending` - the first read of this table's figures is on its way.
              The read is started behind the rows and never waited for, so the
              first answer of a table with gauges goes out before its figures
              exist. Nothing has failed and nothing points elsewhere;
              a refresh after that read returns carries the figures or says why not.
            - `unmeasured` - a read was made and gave no figures. Which backend
              is missing or refusing is the cluster overview's answer.

            **They draw differently, and that is the reason this exists.** As one
            sentence, every Nodes list would say a backend is missing or refusing
            for the two seconds before its gauges arrive - a request in flight
            drawn as a backend that is not there.
        accessNote:
          type: string
          description: >-
            The access review narrowed this list, in one sentence: the person
            signed in may not list this kind in every namespace, so the rows are
            those of the namespaces they may - or a namespace could not be
            reviewed and its rows were withheld. Absent on a list that is the
            cluster's whole answer.

            **An empty table and a narrowed one are different answers**, and
            without this member they draw alike. The sentence is built from the
            question that was asked, never from the rows, so it does not say how
            many namespaces or rows were left out.
        allowedNamespaces:
          type: array
          items: { type: string }
          description: >-
            On a list the access review narrowed: every namespace of this cluster
            in which the person signed in may list this kind, each reviewed. It
            names only namespaces they may list, so it tells them nothing about
            the others. Absent on a list that was not narrowed, and wherever that
            set could not be established - a review that could not be made, a
            namespace list that could not be read - so a client concludes nothing
            from a namespace it lacks unless the member is there. A client opening
            an object by address reads it to say that the object's namespace is
            not one the person may list, rather than that the object is gone.
        columnsCustomised:
          type: boolean
          description: >-
            Something is stored for this kind, which is what puts a reset control on
            the panel. A table nobody has touched needs no way back; one dragged to
            its minimum width needs one badly.
        refreshSeconds:
          type: integer
          minimum: 1
          description: >-
            How often this kind is worth re-reading, which is a property of the kind
            and not of the client. Events move in seconds and CustomResourceDefinitions
            do not; a single interval in the front end is either wasteful on one or
            stale on the other.

    ListPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ListPage' }
      description: >-
        A value envelope, not a list envelope: the page is one object whose `rows`
        happens to be a list. A kind with nothing in it is `state: ok` with
        `data.rows: []` **and** `data.columns` filled, because the grid still has to
        draw its headers. `empty` on the envelope would mean no page at all, which is
        a different sentence and is never what a readable-but-empty kind deserves.

    # ---- Detail and drawer ----------------------------------------------

    Tab:
      type: object
      description: >-
        A drawer tab as data rather than as a branch. Some tabs point at pages that
        may not be installed; as data they degrade by being absent.
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
        endpoint:
          type: string
          description: Where the tab's own payload is fetched. Absent means the tab is inline.
        lazy: { type: boolean, default: true }

    DetailSection:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
        state: { $ref: '#/components/schemas/State' }
        reason: { $ref: '#/components/schemas/Reason' }
        fields:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
              ref: { $ref: '#/components/schemas/Ref' }
              # No `masked` here: a masked value's one address is
              # `DataEntry.masked`, on the panel that reveals it.
              prose:
                type: boolean
                default: false
                description: >-
                  The value is a sentence and may wrap. It travels in the payload so
                  that a client does not re-decide it from the label - the same rule
                  `Column.prose` states, and the same failure when it is broken: a
                  status message clipped to one line in the one place it matters.
              tone: { type: string, enum: [normal, muted, ok, warn, bad] }
              pill:
                type: boolean
                default: false
                description: >-
                  Draw this value as a status badge rather than as colored text.
                  It is a third rendering and not a shade of `tone`: the drawer
                  draws a badge, colored text and plain text, and collapsing the
                  first two makes "Running" and a pod's node name look like the
                  same class of thing. The view model carries the intent and the
                  stylesheet carries the appearance - the same split `prose`
                  is on.
              hint: { type: string }
              copy:
                type: string
                description: What a copy control puts on the clipboard, where that is not the drawn value.

    ResourceAmount:
      type: object
      required: [name, value]
      description: >-
        One resource figure, already formatted, with the resource name as it is
        written in the spec.
      properties:
        name: { type: string }
        value: { type: string }

    EnvSource:
      type: object
      required: [kind, name, key]
      description: >-
        The ConfigMap or Secret one variable is read out of. **Structured rather
        than a sentence**, because it is addressable: it is exactly what the
        reveal control needs in order to ask the server for that one value, and
        building that address out of a rendered phrase would mean parsing English.
      properties:
        kind:
          type: string
          description: '`ConfigMap` or `Secret`, as a person writes it.'
        name: { type: string }
        key:
          type: string
          description: >-
            The key **in the source object**, which is not the variable's name as
            the container sees it - that carries any import prefix.
        optional:
          type: boolean
          default: false
          description: >-
            The reference's own `optional: true`. It **decides what an absence
            means** rather than describing one: without it the kubelet refuses to
            start the container until the key exists; with it the container starts
            and the variable is simply not set. Getting it the wrong way round
            turns "this pod will not start" into "this is fine".

    EnvAbsence:
      type: string
      enum: [unread, unset, expected, unprintable]
      description: >-
        Why there is no value on an environment row - or, on an `EnvImport`, why
        the import contributed no keys - **as a kind rather than as a sentence**,
        so a client can draw four different things without parsing English out of
        `problem`. Absent means there is a value, or nothing to say.

        A warning pill on every absence would be wrong: an ordinary healthy Argo
        CD server pod would show **thirty of them** - `argocd-cmd-params-cm` is a
        ConfigMap whose keys are almost all unset and whose references are almost
        all `optional: true`, which is that component working exactly as shipped.
        A color spent on the normal case is a color the reader stops seeing.

        - `unread` - the object behind the row was never read, or reading it
          failed: past the panel's budget, refused, a read that failed outright
          (a timeout, a 5xx, expired credentials), or - on an import - an import
          that names no object.
          Asking again may answer differently, so this is **the one kind that
          keeps a control**.
        - `unset` - the object was read and does not carry the key, on a reference
          that is not optional. The kubelet will not start the container until it
          does; the pod's own status and events say so, so the row is drawn
          plainly, with the reference and no warning.
        - `expected` - the object was read and does not carry the key, on a
          reference marked `optional: true`, **or the object itself does not
          exist**, whatever the reference says. Drawn plainly, with no pill, no
          color and no control: the row names the object it reads, and whether
          that object exists is the object's own page to say. `problem` still says
          which of the two it is.
        - `unprintable` - the value was read and is not text. Nothing is wrong with
          the pod; the panel simply cannot draw a DER certificate.

    EnvVar:
      type: object
      required: [name]
      description: >-
        One environment entry. **A key name is not a secret; a value is** - the
        Secrets list already prints a key-names column in plain text, so naming the
        key exposes nothing new.

        What is done with the value behind a pointer is decided by the **kind** and
        by nothing else. A ConfigMap is not a credential store and its value is
        resolved on the panel open and drawn, because *"a control that has to be
        pressed to see a log level is a control that gets pressed on every row"* -
        which teaches the gesture that matters for a Secret to be reflexive. A
        Secret's value is never fetched here, never held here and is **not in this
        payload**: it is asked for one key at a time through
        `GET /api/c/{cluster}/env`.
      properties:
        name: { type: string }
        value:
          type: string
          description: >-
            The literal, where there is one, and never a resolved one. A literal is
            in the pod spec and already one click away on the Manifest tab, so
            drawing it here is not a new exposure.
        from:
          type: string
          description: >-
            A source that cannot be followed - "field spec.nodeName", "resource
            limits.memory of api". Empty when `source` is filled.
        source: { $ref: '#/components/schemas/EnvSource' }
        secret:
          type: boolean
          default: false
          description: >-
            The source is a Secret, so the panel can say what asking for the value
            will cost **before** it is asked for.
        resolved:
          type: string
          description: >-
            The value behind a **ConfigMap** source, read on this panel open. It is
            the row's *rendering* of the value and not the value: the first line,
            shortened, with `clipped` saying so - a ConfigMap routinely holds a
            whole nginx.conf under one key, and a table row is not where 40 KB goes.
        held:
          type: boolean
          default: false
          description: >-
            `resolved` was read. **Not the same as `resolved` being non-empty**: a
            ConfigMap key holding the empty string is an ordinary and confusing
            thing to meet, and rendering it identically to a key nobody read is the
            empty-versus-failed collapse on one table row.
        clipped:
          type: boolean
          default: false
          description: '`resolved` is only part of the value, so the row keeps a control for the rest.'
        problem:
          type: string
          description: Why there is no value on this row, in words the operator can act on.
        absence: { $ref: '#/components/schemas/EnvAbsence' }

    EnvImport:
      type: object
      required: [kind, name]
      description: >-
        An `envFrom` naming a ConfigMap or a Secret, which contributes every key it
        holds under an optional prefix. `keys` and `problem` exist because **three
        different answers look identical on a panel that only lists rows**: an
        object with no keys, an object this console may not read, and an object
        nobody looked at.
      properties:
        kind: { type: string }
        name: { type: string }
        prefix: { type: string }
        optional:
          type: boolean
          default: false
          description: >-
            The import's own `optional: true`. With it the kubelet starts the pod
            anyway; without it the pod does not start at all.
        keys:
          type: integer
          description: How many variables this import contributed. Meaningful only where `problem` is absent.
        problem:
          type: string
          description: Why this import contributed nothing, in words the operator can act on.
        absence:
          $ref: '#/components/schemas/EnvAbsence'
          description: >-
            What *sort* of answer `problem` is, so a client does not parse English
            to decide whether it is a fault. Two kinds occur on an import.
            `expected` is an import whose object does not exist, optional or not:
            the row names the object and says nothing more. `unread` is every other
            `problem` - past the budget, refused, a read that failed outright (a
            timeout, a 5xx, expired credentials), or an import that names no
            object. Present only beside a `problem`.

    ProbeState:
      type: string
      enum: [declared, absent, unreadable]
      description: >-
        Whether a probe is declared on this container, **as a kind rather than as
        an empty field**. Three values and not a nullable probe object, because the
        two a nullable object folds together are the two that must never render
        alike.

        - `declared` - the container declares this probe and `handler` names what
          it does.
        - `absent` - the container declares no such probe. **This is a finding and
          it is written out**: a Service can be sending traffic to a container
          nothing has ever asked whether it is ready, and an empty cell is not that
          sentence.
        - `unreadable` - something *is* declared here and this console cannot say
          what: the field is not the shape the API promises, or the handler is one
          this build does not recognize. `problem` says which. It is never used for
          a container that simply has no probe - that collapse is what this
          enumeration exists to prevent, and it is the rule `EnvAbsence` states for
          a value, applied here to a declaration.

    ContainerProbe:
      type: object
      required: [kind, state]
      description: >-
        One of a container's three probes, as declared. **Always three entries per
        container, one per kind, whatever the pod says** - the entry is the
        sentence, and a list that simply omits the readiness probe says the panel
        did not look rather than that the container has none.

        The startup probe is its own entry beside the other two and is never folded
        into them: **it is the one that explains a container that never gets as far
        as failing liveness**, because while it is running the kubelet holds the
        other two off entirely.

        This is a read. Nothing here judges whether a probe is a *good* one.
      properties:
        kind:
          type: string
          enum: [liveness, readiness, startup]
        state: { $ref: '#/components/schemas/ProbeState' }
        handler:
          type: string
          description: >-
            What sort of check it is - `httpGet`, `exec`, `tcpSocket`, `grpc` - and
            **not a sentence combining it with its target**. Kept apart from
            `target` for the reason `EnvSource` is structured rather than rendered:
            a client that wants to draw the two differently would otherwise have to
            parse English back out of one string. Present only where `state` is
            `declared`.
        target:
          type: string
          description: >-
            What that check points at, already rendered by the server because the
            shape differs per handler: `/healthz:8080` for an `httpGet`, `:5432`
            for a `tcpSocket`, the command for an `exec`. Present only where `state`
            is `declared`, and empty where the handler carries nothing to point at.
        initialDelaySeconds:
          type: integer
          description: >-
            How long the kubelet waits before the first check. Carried because it
            is the timing that most often explains a liveness probe killing a
            container that was only still starting.
        periodSeconds: { type: integer, description: How often it runs after that. }
        timeoutSeconds:
          type: integer
          description: How long one check may take before it counts as a failure.
        failureThreshold:
          type: integer
          description: >-
            How many consecutive failures act. With `periodSeconds` it is the whole
            of how long a container has to recover before the kubelet restarts it,
            and neither number means much without the other - which is why the four
            travel together rather than one standing for the rest.
        problem:
          type: string
          description: >-
            Why this console cannot say what is declared, in words the operator can
            act on. Present only where `state` is `unreadable`, and it is the member
            that keeps that state from being read as `absent`.

    ContainerRunState:
      type: string
      enum: [running, waiting, terminated, unreported]
      description: >-
        What the kubelet last said this container was doing. The first three are
        Kubernetes' own `state` union; the fourth is this contract's, and it is the
        whole reason this is an enumeration rather than a `running: true`.

        - `running`, `waiting`, `terminated` - the kubelet reported this container
          and it is in that state. `reason` carries the word that is actually looked
          for: `CrashLoopBackOff`, `ImagePullBackOff`, `OOMKilled`.
        - `unreported` - **no status was reported for this container at all.** A pod
          that has just been created, one that was never scheduled, or a status
          block this console could not read. It is not "not ready": `ready` says
          nothing here, and drawing the two alike is the empty-versus-failed
          collapse on the one row that exists to answer whether the container is
          healthy.

    ContainerStatus:
      type: object
      required: [state, ready]
      description: >-
        How one container is *doing*, read from `status.containerStatuses` or
        `status.initContainerStatuses` and matched to the spec **by name** - which is
        the only thing that matches them, since neither list is in the spec's order
        and a sidecar's status is filed under the init list.

        Always present on a `PodContainer`, including when nothing was reported: see
        `unreported` on `ContainerRunState`.
      properties:
        state: { $ref: '#/components/schemas/ContainerRunState' }
        ready:
          type: boolean
          description: >-
            Whether the kubelet last found this container ready - which for a
            container behind a Service is whether traffic is being sent to it.
            **Written always, including when false**, for the same reason
            `PodContainer.init` is: a member omitted when false is one a client
            cannot tell from a member nobody filled. **Meaningful only where `state`
            is not `unreported`.**
        reason:
          type: string
          description: >-
            The kubelet's own word for why this container is in that state -
            `CrashLoopBackOff`, `ImagePullBackOff`, `OOMKilled`, `Completed`. Empty
            on a container that is simply running, which is the ordinary case and
            not an absence.
        message:
          type: string
          description: >-
            The sentence beside the reason, where the kubelet wrote one. Beside
            `reason` rather than instead of it: the reason is the word somebody
            searches for and the message is the detail, and a panel given only the
            second cannot say which class of failure it is looking at.
        restarts:
          type: integer
          description: >-
            How many times this container has been restarted. **Meaningful only
            where `state` is not `unreported`**, where it is absent rather than zero
            - a container nobody has reported has not restarted zero times.
        exitCode:
          type: integer
          description: >-
            The code the last run exited with, where `state` is `terminated`.
            Carried beside `reason` because `OOMKilled` and a 137 are the same event
            said two ways and an operator looks for whichever they know.
        problem:
          type: string
          description: >-
            Why there is no status on this row, in words the operator can act on.
            Present only where `state` is `unreported`.
        lastTermination:
          $ref: '#/components/schemas/ContainerTermination'
          description: >-
            How the **previous** run of this container ended - the kubelet's
            `lastState.terminated` - beside the current `state` and never instead
            of it. A container that was OOM-killed and restarted is `running`
            again, and this is the only place the reason it restarted survives.
            Absent where the kubelet keeps no previous run, which is not a claim
            that the container never stopped: an evicted or recreated pod has
            none at all.

    ContainerTermination:
      type: object
      required: [exitCode]
      description: >-
        One finished run of a container, as the kubelet keeps it in
        `lastState.terminated`: the most recent previous run, however long ago,
        until the next restart replaces it. **Never more than one** - the kubelet
        keeps no older run, and a history of every termination would need the
        console to record events over time.
      properties:
        exitCode:
          type: integer
          description: >-
            What the run exited with, written always - `0` is a clean exit and
            a fact here. Above 128 it is a signal: 137 is SIGKILL (often the OOM
            killer), 143 is SIGTERM.
        signal:
          type: integer
          description: The signal that ended the run, where the runtime reported one; most leave it in the exit code.
        reason:
          type: string
          description: The kubelet's word - `OOMKilled`, `Error`, `Completed`.
        message:
          type: string
          description: The sentence beside the reason, where the kubelet wrote one.
        startedAt:
          type: string
          format: date-time
          description: When the run started, where the kubelet recorded it.
        finishedAt:
          type: string
          format: date-time
          description: When it ended, where the kubelet recorded it.

    PodContainer:
      type: object
      required: [name, image, init]
      description: >-
        One container of a pod, init or otherwise. **Named apart from `Container`,
        which is a different thing that already exists**: that one is `{name, init,
        ready, restarts}` for the log picker, and a schema serving both would be a
        payload where half the members are absent depending on who asked.

         What the panel answers that the
        manifest also answers, without scrolling a hundred lines of YAML past
        `managedFields`: which image is running, whether it will be pulled again,
        what it is allowed to use, and what it was told at start-up.
      properties:
        name: { type: string }
        image: { type: string }
        init:
          type: boolean
          description: >-
            **An init container that will not start is the reason the pod is stuck,
            and it looks identical to a crashing app container if nothing
            distinguishes them.** Init containers come first, in the order they run.
        pullPolicy:
          type: string
          description: >-
            Carried **only where it is not the default for the tag**, because the
            interesting case is the one that surprises: `Always` on a pinned tag
            costs a registry round trip per start, and `IfNotPresent` on `:latest`
            means the node keeps whatever it happened to pull first.
        command:
          type: array
          items: { type: string }
          description: >-
            The spec's `command`, **one element per argument, exactly as written**
            - never joined, split or re-quoted, because `sh -c "a b"` is two
            elements and a script, and a joined string makes the boundary between
            arguments a guess. Absent when the spec sets none (an empty list is
            the same thing to the kubelet): the image's own ENTRYPOINT runs, which
            only the registry knows.
        args:
          type: array
          items: { type: string }
          description: >-
            The spec's `args`, element by element as for `command`. Absent when the
            spec sets none: the image's own CMD is used, unless `command` is set,
            in which case the image's CMD is ignored.
        requests:
          type: array
          items: { $ref: '#/components/schemas/ResourceAmount' }
        limits:
          type: array
          items: { $ref: '#/components/schemas/ResourceAmount' }
        env:
          type: array
          items: { $ref: '#/components/schemas/EnvVar' }
          description: What the container was told in its own `env`, in declaration order.
        envFrom:
          type: array
          items: { $ref: '#/components/schemas/EnvImport' }
        imported:
          type: array
          items: { $ref: '#/components/schemas/EnvVar' }
          description: >-
            The variables those imports contribute, one row per key, **with the
            prefix already applied** - `PREFIX_KEY` is the name the container
            actually sees. Kept apart from `env` rather than appended to it, and
            deliberately: everything in `env` is written in the pod spec and is one
            click away on the Manifest tab, and everything here was learned by
            reading another object. The two are not equally knowable.
        probes:
          type: array
          items: { $ref: '#/components/schemas/ContainerProbe' }
          description: >-
            The three probes as declared, **always all three and always in the order
            liveness, readiness, startup**. Everything above this member is what the
            container *was told*; this and `status` are how it is *doing*, which is
            the first question anybody asks of a pod.
        status: { $ref: '#/components/schemas/ContainerStatus' }

    Certificate:
      type: object
      required: [position, role, subject, issuer, notBefore, notAfter]
      description: >-
        One x509 certificate as the panel needs it. Every field here is something
        the certificate hands to any client that connects, so none of it is a
        disclosure - and `tls.key` is not read at all.
      properties:
        position:
          type: integer
          description: >-
            1-based **within the bundle**, so the panel can say which is presented
            first. A file with two certificates rendered as one is a wrong answer
            that looks right.
        role:
          type: string
          description: >-
            Read off the certificate and **not off its position**: a leaf is a
            certificate that is not a CA, a root is a CA that signed itself, an
            intermediate is a CA that did not. `position` says what order they are
            stored in; this says what they are.
        subject: { type: string }
        issuer: { type: string }
        selfSigned:
          type: boolean
          default: false
          description: >-
            The issuer name matches the subject **and** the signature verifies
            against its own public key. The name comparison alone is not enough - a
            self-issued certificate signed by somebody else has the same names.
        isCA: { type: boolean, default: false }
        sans:
          type: array
          items: { type: string }
          description: >-
            The names this certificate is actually valid for. **This is the list an
            operator matches against the Ingress host they are debugging**, and the
            reason the common name alone has not been an answer for years - Chrome
            has ignored it since 58.
        sansNote:
          type: string
          description: How many were left out. Absent when they all fit.
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        expiry:
          type: string
          description: >-
            How long is left, in the short form the rest of this console uses for
            an age - "expires in 61d4h", "expired 3d2h ago".
        expiryTone:
          type: string
          enum: [normal, muted, ok, warn, bad]
          description: >-
            The grade, **against the certificate's own lifetime and not against a
            fixed number of days**: cert-manager renews at two thirds elapsed, so
            30 days left on a 90-day certificate is healthy and 30 days left on a
            one-year one is three months late. The arithmetic stays on the server
            for the same reason every other reading's does.
        serial: { type: string }
        signatureAlgorithm: { type: string }
        publicKey:
          type: string
          description: 'The key type and its size: "RSA 2048", "ECDSA P-256", "Ed25519".'

    CertificateBundle:
      type: object
      required: [key]
      description: >-
        One data key's worth of PEM: a leaf and whatever intermediates were
        appended to it. **One card per certificate and not per key**, because
        `tls.crt` routinely holds a leaf plus its intermediates and rendering two
        certificates as one is a wrong answer that looks right.
      properties:
        key:
          type: string
          description: 'The data key this came out of: `tls.crt`, `ca.crt`.'
        certificates:
          type: array
          items: { $ref: '#/components/schemas/Certificate' }
          description: The blocks that parsed, in the order they are stored - leaf first for a serving bundle, because that is the order TLS puts them on the wire.
        note:
          type: string
          description: >-
            Why this bundle is empty, or what stopped the walk part-way through.
            Each of the ways this can fail is its own sentence - no `tls.crt` under
            a `kubernetes.io/tls` type, a value that is not base64, bytes with no
            PEM block, a PEM block that is a key or a CSR - because a panel that
            rendered an empty box for all of them says nothing. **A partial chain
            is never drawn as a whole one:** the note sits beside the certificates
            that did parse, never instead of them.

    CertificateSet:
      type: object
      description: What the TLS material in a Secret - or in a ConfigMap such as `kube-root-ca.crt` - actually says.
      properties:
        bundles:
          type: array
          items: { $ref: '#/components/schemas/CertificateBundle' }
        privateKeys:
          type: array
          items: { type: string }
          description: >-
            The private-key entries this object carries - **never their values,
            which are not read at all.** It is provenance: it lets the panel say
            which part of the Secret was opened and which was deliberately left
            alone, which is the difference between a console that cannot and one
            that chose not to.
        note:
          type: string
          description: Why there is no bundle at all - today, only a Secret that claims to be `kubernetes.io/tls` and has no `tls.crt`.

    ObjectURL:
      type: object
      required: [address]
      description: >-
        An address a person can open. **Ingresses have them and nothing else
        does**, because inventing a scheme for a LoadBalancer Service is the guess
        this type exists to avoid - a console that guesses one teaches the reader
        that the addresses are guesses.
      properties:
        role: { type: string }
        address:
          type: string
          description: >-
            What to open, scheme included. The scheme is `https` only where the
            host is covered by an entry in the Ingress's own `spec.tls`; it is the
            one field here that can send somebody somewhere that does not answer.
        host: { type: string }
        path:
          type: string
          description: >-
            The path exactly as the object writes it, pattern and all. `address`
            may carry only its literal beginning, and `note` says when it does.
        tls: { type: boolean, default: false }
        service:
          type: string
          description: The backend this address reaches, absent where the rule points at something that is not a Service.
        note:
          type: string
          description: Why `address` may not be literally what the object says.

    Relation:
      type: object
      required: [role, label, linkable]
      description: >-
        **Another object this one points at, and why.** The panel of these is the
        one thing a console gives that `kubectl get -o yaml` does not: which
        Secret is mounted where, which node this pod is on, what created it, what
        a Service selects - each one click away and each opening in the same
        panel. The roles come from `internal/detail/relations.go` - among them
        `Grants`, `Subject` and `Bound by` for access control, and on a Namespace
        `Resource quota` and `Limit range`, whose `detail` carries the figures.
      properties:
        role:
          type: string
          description: >-
            Why the two are related - `Controlled by`, `Node`, `Service account`,
            `Selects`, `Volume`, `Secret`, `TLS certificate`, ... The client maps it
            to a glyph, which is the one presentation decision here and is
            deliberately not in the payload.
        kind:
          type: string
          description: >-
            The **plural resource name** of the target, as the API serves it and as
            a URL carries it, so a client can address it without a second lookup.
            Empty where there is no object behind the relation.
        namespace:
          type: string
          description: >-
            The **target's** namespace and never this object's. A Node, a
            PersistentVolume, a StorageClass and an IngressClass are cluster-scoped
            and carry none: a namespace handed to a cluster-scoped kind passes
            every validator, reaches the API server and comes back "not found" for
            a resource that is right there.
        name:
          type: string
          description: Empty when the relation is a selector rather than one named object.
        label:
          type: string
          description: What to write on screen.
        detail:
          type: string
          description: >-
            The qualifier - "projected into kube-api-access-xxxxx", "optional",
            "Running on node-3", "default backend". Often empty.
        mounts:
          type: array
          items: { type: string }
          description: >-
            The paths this object is mounted at, because *"which secret is at
            /etc/creds"* is the question being asked. Capped by the producer, with
            a final `+N more` element rather than a silent cut - a Secret named in
            a relation list without its mount path is a name; with it, it is an
            explanation of the container that will not start.
        selector:
          type: string
          description: >-
            A label selector where the relation is "everything matching this"
            rather than one named object - a Service's `spec.selector`, a
            workload's `spec.selector.matchLabels`. `kind` is set alongside it, so
            a client can open a filtered list.
        linkable:
          type: boolean
          description: >-
            **The server's answer to whether this relation can be opened, and it
            stays the server's.** A client re-deriving *kind is not empty and name
            is not empty* would be a second copy of the rule, and the two would
            disagree the day a third condition is added - a kind this cluster does
            not serve is already one. False for an `emptyDir`, for a `hostPath`,
            and for a selector: drawn **inert**, same icon, same role, no href,
            because a drawer that lists only linkable relations says a pod has
            three volumes when it has five, and one that links all of them gives
            two dead links. Both are wrong in a way the reader cannot see.

    DetailPage:
      type: object
      required: [kind, name, tabs, sections]
      properties:
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        title: { type: string }
        tabs:
          type: array
          items: { $ref: '#/components/schemas/Tab' }
        deleting:
          type: boolean
          description: >-
            The object carries a deletion timestamp: it is on its way out, held
            by its grace period or a finalizer, and its verbs are drawn disabled.
            A client reads it again until the read answers it gone
            (`no_such_object`). Absent on an object that is not being deleted.
        event:
          $ref: '#/components/schemas/EventSubject'
          description: >-
            **What this object says, when the object *is* an Event** - and
            nothing for every other kind.

            Singular, and it is not one of `events` below: those are the events
            *about* this object, and on an Event the two are different things.
            Without it, an Event's panel would show its Kind, its API version,
            its generated name and when it was created - everything about the
            object except the sentence it exists to carry.
        events:
          type: array
          items: { $ref: '#/components/schemas/ObjectEvent' }
          description: >-
            What the cluster still remembers happening to this object, newest
            first - the panel an operator opens first when something is wrong,
            because it is where the scheduler, the kubelet and every admission
            webhook say why.

            **It rides with the object and has no operation of its own.** The same
            read that fills `sections` already fetches these, so a separate
            endpoint would be a second round trip for bytes that are already
            here - which is why its `Tab` carries no `endpoint`.
        eventsNote:
          type: string
          description: >-
            Why the list is empty or short. **Kubernetes drops events after about
            an hour**, so an empty list nearly always means *nothing recently* and
            reads as *nothing ever*; a panel that draws nothing over silence is
            the same collapse as an unreadable answer drawn as an empty one. Set
            when the events could not be read at all, too.
        metrics:
          type: string
          description: >-
            The address of this object's measurements, **drawn at the top of the
            details panel and not behind a tab of its own**, and absent on every
            kind that has none.

            It is a member rather than a `Tab` because of where the charts go:
            above the fact table, because what this object has been doing is the
            question a panel is opened with, and it is the one thing a table of
            facts cannot answer.

            **It is still its own address.** Two Prometheus range queries over a week
            take a second or more, and through a port-forwarded tunnel the tunnel
            is opened first; folded into this payload, every pod anybody clicked
            would pay that before showing a name. So a client draws the panel, and
            fills this block when the answer arrives.
        data:
          type: string
          description: >-
            The address of this object's key/value block - a ConfigMap's or a
            Secret's keys - **drawn inside the details panel, between the
            object's own facts and Related**, and absent on every other kind.

            It is a member rather than a `Tab` for the same reason `metrics` is:
            one page per object, details, then the data, then Related, as for a
            pod. A tab declaring a section that is already on the page would be a
            second way to reach it.

            **It keeps its own operation, and that is the deliberate half.** A
            ConfigMap's values are unbounded, so folding them into this payload
            would carry tens of kilobytes in front of a panel whose first job is
            to draw a name and an age; the two reads start together instead, and
            the facts paint while the values arrive. `POST /data` also writes
            against the `resourceVersion` this panel returns, so the panel has to
            exist as a payload of its own whatever the client draws it inside.
        sections:
          type: array
          items: { $ref: '#/components/schemas/DetailSection' }
        labels:
          type: object
          additionalProperties: { type: string }
          description: >-
            The object's labels, as a map. **A map and not a section of fields**,
            because a set is scanned and not read: the drawer draws them as chips,
            which wrap where a `nowrap` grid cell would not, and which is what makes
            the set a Service's selector is matched against legible on the object
            being matched. A label with no value is an ordinary label and its value
            is the empty string.
        annotations:
          type: object
          additionalProperties: { type: string }
          description: >-
            The object's annotations, **already treated** — never what the API
            server returned. Drawn as the same chips as `labels`, immediately
            after them, and produced under a different rule, which is why this is
            a member of its own and documented at length rather than as *labels
            again*.

            `kubectl.kubernetes.io/last-applied-configuration` is never carried.

            **On a Secret every value is replaced by the same mask the Manifest
            tab uses, and the keys are kept.**

            A client draws what arrives and applies no rule of its own. The
            treatment is the producer's, so a second client cannot get it wrong.
        relations:
          type: array
          items: { $ref: '#/components/schemas/Relation' }
        usedBy:
          $ref: '#/components/schemas/UsedBy'
          description: >-
            **Whether the reverse walk ran, completed, and found anything** - on
            a ConfigMap and a Secret, and absent on every other kind.

            The referrers themselves are ordinary `relations` rows under the role
            `Used by`. This is the *answer*, which is a different thing: a client
            drawing only the rows cannot tell "walked and found nothing" from
            "never walked" from "you may not list here", and on these two kinds
            the first of those is the **majority** case.
        certificates: { $ref: '#/components/schemas/CertificateSet' }
        rules:
          $ref: '#/components/schemas/RuleSet'
          description: >-
            **What a Role or a ClusterRole grants** - and absent on every other
            kind.

            It is the same collapse `event` above is written against, one kind
            along: without it, a Role's panel would draw everything **but the
            permissions it exists to grant**, reachable only by switching to the
            Manifest tab and reading YAML.

            **It costs no cluster read.** `rules` is a field of the object that
            was already fetched, so this is the payload the Manifest tab is built
            from, shaped as a table. No binding is resolved, in either direction,
            and no `SelfSubjectRulesReview` is performed - a binding walk and the
            reverse question *what can this ServiceAccount do* are a different
            surface with a different cost, and neither is here.
        urls:
          type: array
          items: { $ref: '#/components/schemas/ObjectURL' }
        urlsNote:
          type: string
          description: Why an address is missing or partial, where one is.
        ports:
          type: array
          items: { $ref: '#/components/schemas/ObjectPort' }
          description: >-
            What this object exposes, and **the one panel whose row is also a
            control**: a TCP port is where a port-forward is opened from. Filled
            for a pod and for a Service; absent for every other kind, because
            nothing else declares a port a client could reach.
        portsNote:
          type: string
          description: Why the list is short or empty, where it is.
        containers:
          type: array
          items: { $ref: '#/components/schemas/PodContainer' }
          description: >-
            What a pod is made of, init containers first. Absent for every other
            kind. Where a container declares neither requests nor limits the panel
            says so out loud rather than drawing nothing - that is BestEffort, it
            decides what the scheduler does with the pod, and **a missing row reads
            as a panel that did not look.**
        envNote:
          type: string
          description: >-
            Which `envFrom` imports were not read, and why. Expanding an import
            costs a round trip on the panel that opens by default, so the number of
            them is capped - and a capped list that does not admit it is a lie the
            operator acts on.
        relationsNote:
          type: string
          description: >-
            What was left out of `relations` and why. A pod can mount forty volumes
            and a Service can select five hundred pods; **the list is capped, and a
            capped list that does not admit it is a lie the operator acts on.**
            `DetailSection.state` and `.reason` express *this could not be read*;
            they do not express *this was read and cut*, which is why this is a
            member of its own rather than a reason code.
        actions:
          type: array
          description: >-
            The verbs offered here, each already answered permitted or not. Of a toggle,
            only the half that would change the object is offered: Resume on a suspended
            CronJob and Suspend on one that is not, Uncordon on a cordoned node and Cordon
            on a schedulable one.
          items:
            type: object
            required: [verb, label, permitted]
            properties:
              verb: { type: string }
              label: { type: string }
              permitted: { type: boolean }
              destructive: { type: boolean, default: false }
              irreversible:
                type: boolean
                default: false
                description: >-
                  Colors the verb as irreversible in menus: the object does not
                  survive it, and nothing here can undo it. The server's answer,
                  per (verb, kind), from the same producer as a plan's
                  `irreversible` - a client reads this flag and never the verb's
                  name. A list row's context menu draws only these verbs in red;
                  the drawer's chips, the selection bar and the confirmation keep
                  coloring by `destructive`.
              reason: { $ref: '#/components/schemas/Reason' }
        shell:
          type: object
          required: [permitted]
          description: >-
            Whether this pod's page draws Shell, **under `shared` only**: asked
            as `create pods/exec` on this pod, by name, for the signed-in
            person - the question the exec socket is reviewed with - and, where
            the person was not refused, for the console's own ServiceAccount,
            each held a minute. Absent on the desktop, where `podExec` alone
            decides, on every kind but a pod, and **where the person may not
            open a shell here**: absent there is withheld, as a verb the person
            may not perform is absent from `actions`. `permitted: false` always
            carries the reason: the console could not ask, or the person may
            and the console's ServiceAccount may not (the sentence names the
            grant that is missing). The socket reviews the person again when it
            opens; this is what the page draws.
          properties:
            permitted: { type: boolean }
            reason: { $ref: '#/components/schemas/Reason' }

    UsedBy:
      type: object
      required: [state]
      description: >-
        **What the reverse walk established about who uses this ConfigMap or
        Secret.** Absent on every other kind.

        Every other relation the console draws is *forward*: the object names
        what it references and the manifest already in hand answers. A ConfigMap
        names nothing, so its panel would be empty by construction - and there is no
        server-side index to ask instead, because a `fieldSelector` does not
        reach into `volumes[]` or `env[]`. So the walk lists the namespace's live
        workloads - and, for a Secret, its ServiceAccounts and Ingresses plus the
        cluster's PersistentVolumes and StorageClasses, which are the only
        cross-namespace references Kubernetes permits - and filters them here.

        **`empty` is the majority answer and the dangerous one**: on a typical
        cluster about half the ConfigMaps and Secrets have no referrer. A reader
        takes "nothing uses this" as "safe to delete", and
        a walk cannot establish that: a ConfigMap picked up by *label* - a
        Grafana dashboard, a Prometheus rule - is named in no object anywhere, a
        custom resource can hold the reference, and a bare pod, a finished Job
        and a hand-made ReplicaSet are deliberately not counted. `reason.message`
        says all of that on the panel; it is the wording that makes this member
        worth its cost.

        **`empty` and `forbidden` must never collapse into each other.** A walk
        that could not list one of its kinds has not established absence, so a
        refusal with nothing found is `forbidden` or `unreadable` and never
        `empty`. The converse, a refusal with something found, stays `ok` and
        names the list it could not read in `relationsNote` - some of the
        referrers is a usable answer as long as the panel says which half it is.
      properties:
        state: { $ref: '#/components/schemas/State' }
        reason:
          $ref: '#/components/schemas/Reason'
          description: >-
            On `empty`, what was looked at and what no walk can see - the
            sentence the operator acts on. On a failure, which list was refused.
            `reason.detail` carries the audit: the kinds listed and the scope
            they were listed in.

    RuleSet:
      type: object
      required: [state]
      description: >-
        A Role's or a ClusterRole's whole rules block, with its own state.

        **`empty` and `unreadable` are different answers and must not render the
        same**, which on this surface is not a general principle but the point of
        the panel: reading permissions is itself permission-sensitive, and a
        surface that silently shows fewer rules than exist is worse than one that
        refuses - the entire reason somebody opens it is to conclude *that is all
        this Role can do*. A Role whose `rules` array is genuinely empty is a
        real and consequential object; a Role whose rules could not be made sense
        of is a fault.

        **`forbidden` arrives at the envelope and not here.** Reading the rules
        is reading the object: the same `GET` carries both, so a caller who may
        not read a Role gets `state: forbidden` with `verb_denied` on the
        *response*, drawn by the same machinery every other refusal is. A second
        refusal channel on this member would be a state nothing can produce.
      properties:
        state: { $ref: '#/components/schemas/State' }
        reason: { $ref: '#/components/schemas/Reason' }
        rules:
          type: array
          items: { $ref: '#/components/schemas/PolicyRule' }
        note:
          type: string
          description: >-
            What the panel must admit about what it drew. Two things, both of
            which mean **the rendered answer is not the stored one**, and both of
            which are named rather than solved:

            a `*` is drawn as it is stored, because expanding it against the
            discovered API surface is doing admission control's job inside a
            console and will disagree with the API server at the edges - while
            printing it with no mark reads as a permission on a resource *named*
            `*`; and an aggregated ClusterRole's rules are written by the
            controller from the roles its label selector matches, so they move
            when those roles do.
        selectors:
          type: array
          description: >-
            An aggregated ClusterRole's `clusterRoleSelectors`, one entry per
            selector, each the list of its requirements (`k=v`, `k in (a,b)`,
            `k`, `!k`). Absent on any other object.
          items:
            type: array
            items: { type: string }

    PolicyRule:
      type: object
      description: >-
        One entry of a Role's `rules` array, already graded.

        Each list is absent where the rule carries none rather than present and
        empty. A rule carrying `nonResourceURLs` - `/healthz`, `/metrics` -
        carries no resources at all and must render as that rather than as an
        empty resources cell, which is the case the list's own `ruleSummary`
        already handles and this panel must not regress.
      properties:
        apiGroups:
          type: array
          items: { type: string }
        resources:
          type: array
          items: { type: string }
        verbs:
          type: array
          items: { type: string }
        resourceNames:
          type: array
          items: { type: string }
        nonResourceURLs:
          type: array
          items: { type: string }
        wildcards:
          type: string
          description: >-
            Where a `*` fell, in the words the Access Control grid already uses
            for the same object: `api groups`, `resources`, `verbs`, joined.
            Absent where none did.

            **Carried rather than re-derived by a client**, so that the panel and
            the grid say the same thing about the same Role. Two spellings of one
            judgment is the pair that disagrees.
        wildcardTone:
          type: string
          enum: [warn, bad]
          description: >-
            The grade the grid gives it: `warn` on any wildcard, `bad` when `*`
            falls on **both** verbs and resources - which is cluster-admin under
            another name and the one thing the list ranks to the top. Absent
            where there is no wildcard.

    DetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/DetailPage' }

    # ---- Helm ------------------------------------------------------------

    HelmRelease:
      type: object
      required: [name, namespace, state]
      properties:
        name: { type: string }
        namespace: { type: string }
        revision:
          type: integer
          description: The current revision, which is the highest one. Not necessarily the running one - see `deployedRevision`.
        deployedRevision:
          type: integer
          description: >-
            The revision actually running, where it is not the current one. **Its
            absence is not "the same"** - see `note`, which is what a client draws.
        chart: { type: string }
        chartVersion:
          type: string
          description: >-
            **Two versions, two fields.** A release has a chart version and an
            application version and they move independently; one field labeled
            "version" is a question rather than an answer.
        appVersion: { type: string }
        deprecated:
          type: boolean
          description: The chart is marked deprecated upstream.
        description:
          type: string
          description: >-
            Helm's own sentence about the last operation - which is where a failed
            upgrade says what went wrong. Prose: a client must let it wrap.
        note:
          type: string
          description: >-
            The row's second fact, and it exists for one case: the current revision
            is not the deployed one. "Revision 40 is the deployed one" - without it a
            failed upgrade reads as a release with nothing running at all.
        status: { type: string }
        updatedAt: { type: string, format: date-time }
        age:
          type: string
          description: >-
            `updatedAt` in the server's own wording - "4m", "3d" - measured from the
            answer's collection instant, as `EventEntry.age` is, so that two panels
            drawing one release cannot spell it two ways - a browser spelling it
            from the instant would use a scale of its own and clamp to "0s" on a
            clock behind the cluster's. **A snapshot**: the Helm pages do not poll, so a
            client keeps its own clock to carry the reading forward, on this scale.
            Absent with `updatedAt`, and absent is not "0s".
        state:
          $ref: '#/components/schemas/State'
          description: >-
            `unreadable` where the release's stored payload could not be decoded. It
            is still listed: a release that exists and cannot be read is not a release
            that does not exist, and dropping it silently is how a console reports
            nine of ten.
        reason: { $ref: '#/components/schemas/Reason' }

    HelmListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/HelmRelease' }
            accessNote:
              type: string
              description: >-
                The access review narrowed this list, in one sentence: the person
                signed in may not list Secrets - which hold Helm's releases - in
                every namespace, so the releases are those of the namespaces where
                they may. Absent on a list that is the cluster's whole answer, and
                on a failure. Built from the question, never from the rows.
            columns:
              type: array
              description: >-
                The list's columns, arranged as a resource list's are: the order,
                widths and visibility the column store keeps under the kind `helm`
                (or none, where the console keeps no preferences), over the columns
                the list declares. The same column writes arrange them
                (`/api/preferences/columns/*` with `kind: helm` and a column's
                `key`). No column carries `filterValues`: the list is filtered in
                the browser, which collects the values from the rows it holds.
                Absent on a failure.
              items: { $ref: '#/components/schemas/Column' }
            columnsCustomised:
              type: boolean
              description: >-
                Something is stored for the Helm list's columns, as
                `ListPage.columnsCustomised` says for a kind.

    HelmRevision:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
        status: { type: string }
        tone: { type: string, enum: [normal, muted, ok, warn, bad] }
        updatedAt: { type: string, format: date-time }
        chartVersion: { type: string }
        appVersion: { type: string }
        description: { type: string }
        mark:
          type: string
          enum: [current, deployed, current-and-deployed]
          description: >-
            Which of the two this row is, drawn as a pill so that the running one is
            findable at a glance in a list of ten rows all saying "Upgrade complete".
        note:
          type: string
          description: Why a row has no chart version - its stored payload would not decode.

    HelmReleaseDetail:
      type: object
      required: [release]
      properties:
        release: { $ref: '#/components/schemas/HelmRelease' }
        revisions:
          type: array
          description: >-
            **The release's history, which is what its own page is for.** A
            release opened from a list, showing its
            values and its manifest and no revisions, is the list row again with more
            text: the question that sends anybody here is what changed and when.
          items: { $ref: '#/components/schemas/HelmRevision' }
        historyMax:
          type: integer
          minimum: 0
          description: >-
            How many revisions are kept here. It is the answer to "how far back can I
            look", and it is the chart's own retention setting made visible rather
            than a reader inferring it from a list that stops.
        valuesSupplied:
          type: boolean
          description: >-
            Whether the current revision carries values somebody supplied.
            **The values themselves are not here**: they
            routinely hold passwords, so they arrive only through
            `revealHelmValues`, reviewed and recorded. `true` is a reveal control
            to draw; absent or `false` means none were supplied and the chart's
            defaults apply in full, which is an answer - draw the sentence, never
            an empty box. `payloadNote` wins over both: nothing could be read.
        notesRendered:
          type: boolean
          description: >-
            Whether Helm rendered notes (the chart's `NOTES.txt`) for the current
            revision. **The notes themselves are not here**:
            charts print generated passwords and tokens in them, so they arrive
            only through `revealHelmNotes`, reviewed and recorded like the values.
            `true` is a reveal control to draw; absent or `false` means the chart
            ships none, which is an answer. `payloadNote` wins over both.
        payloadNote:
          type: string
          description: >-
            Why `valuesSupplied` and `notesRendered` are not an answer at all: the current revision's
            stored document would not decode, so nothing could be read out of it.
            Its own member rather than an empty string doing double duty - "this chart
            ships no notes" and "nobody could read them" are exactly the collapse this
            contract refuses.
        manifest: { $ref: '#/components/schemas/ManifestPanel' }

    HelmReleaseEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/HelmReleaseDetail' }

    HelmValues:
      type: object
      required: [revision, values]
      properties:
        revision:
          type: integer
          minimum: 1
          description: The revision these values were supplied to, which is the one asked for.
        values:
          type: string
          description: >-
            What was supplied, as YAML - `helm get values` and deliberately
            not `--all`: the question is what *we* changed, not what the chart
            defaults to. The empty string means none were supplied.

    HelmValuesEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/HelmValues' }

    HelmNotes:
      type: object
      required: [revision, notes]
      properties:
        revision:
          type: integer
          minimum: 1
          description: The revision these notes were rendered for, which is the one asked for.
        notes:
          type: string
          description: >-
            What Helm rendered out of the chart's `NOTES.txt`, as `helm get notes`
            shows it and unredacted. The empty string means the chart ships none.

    HelmNotesEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/HelmNotes' }

    # ---- Overview --------------------------------------------------------

    CapacityCell:
      type: object
      required: [label, requested, capacity]
      properties:
        label: { type: string }
        requested: { $ref: '#/components/schemas/Reading' }
        capacity: { $ref: '#/components/schemas/Reading' }
        used: { $ref: '#/components/schemas/Reading' }
        requestedOf:
          type: string
          description: >-
            The requested line's hover, `requested / capacity` with both halves in the
            capacity's unit (`2.3 / 8 cores`). Absent where either was not measured.
        usedOf:
          type: string
          description: >-
            The used line's hover, `used / capacity` with both halves in the capacity's
            unit (`0.37 / 8 cores`). Absent where either was not measured.
        ref:
          $ref: '#/components/schemas/Ref'
          description: >-
            Where this figure is broken down one machine at a time - the node list, for
            all three, because the three are sums over machines and requests are against
            *allocatable*, which only a node has. Sending the pod figure to the pod list
            instead would answer a different question: it counts the pod slots kubelet
            allows, not the pods. Without it a full cluster has no way through to the
            machines that make it full.
        tone: { type: string, enum: [normal, muted, ok, warn, bad] }

    TopBoard:
      type: object
      required: [label, entries]
      properties:
        label: { type: string }
        entries:
          type: array
          items:
            type: object
            required: [ref, reading]
            properties:
              ref: { $ref: '#/components/schemas/Ref' }
              reading: { $ref: '#/components/schemas/Reading' }

    CountEntry:
      type: object
      description: >-
        One kind and how much of it is in the state it declares. `count` alone is not
        a fact anybody acts on - "38 deployments" is a description of the cluster and
        not a thing to do - which is why `healthy` and `note` are here: the tile's
        whole content is `2 / 3` with "1 not ready" under it, and a tile carrying only
        the total is the panel answering a question nobody asked.
      required: [kind, label, count]
      properties:
        kind: { type: string }
        label: { type: string }
        count: { type: integer, minimum: 0 }
        healthy:
          type: integer
          minimum: 0
          description: >-
            How many of `count` are in the state they declare. Absent where the kind
            has no such notion - a node count is a count - and **absent is not zero**:
            a tile drawing `0 / 38` because nobody said is the reassurance rule
            inverted, and it is the loudest possible way to be wrong.
        note:
          type: string
          description: >-
            What the rest are, in the words the panel prints - "2 not ready". Empty
            when everything is as it should be, and the page says "all healthy" itself
            rather than the server sending that sentence on every healthy tile.
        tone: { type: string, enum: [normal, muted, ok, warn, bad] }
        ref: { $ref: '#/components/schemas/Ref' }

    CountsPanelEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CountEntry' }

    CapacityPanelEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CapacityCell' }

    TopPanelEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TopBoard' }

    EventEntry:
      type: object
      description: >-
        One cluster event, with what a reader reads an event for - the reason,
        the message, how many times it has happened and how long ago. A
        `BackOff` that has fired 340 times and one that fired once are the same row
        without `count`, and the first is an incident.
      required: [text]
      properties:
        text: { type: string }
        href: { type: string }
        hint: { type: string }
        at: { type: string, format: date-time }
        age:
          type: string
          description: >-
            The server's own wording for the age, so that two panels drawing the same
            event cannot spell it two ways.
        scope: { $ref: '#/components/schemas/Ref' }
        object:
          $ref: '#/components/schemas/Ref'
          description: >-
            What the event is about. **Unlinked where the involved kind is one this
            console has no list for**, which is the ordinary case on a cluster
            running operators - a link that always exists is a link that leads
            nowhere half the time.
        reason: { type: string }
        message: { type: string }
        count: { type: integer, minimum: 0 }
        tone: { type: string, enum: [normal, muted, ok, warn, bad] }

    ObjectEvent:
      type: object
      description: >-
        One event about one object, as its own panel draws it.

        **Not `EventEntry`, which is the cluster page's row**, and the two are
        different questions rather than two spellings of one. That one answers
        *what is happening across this cluster* - so it carries a destination, a
        scope and a sentence already composed - and this one answers *what
        happened to the object already on screen*, where the destination is the
        object you are looking at and what is missing instead is who reported it
        and over what span.
      required: [reason, message]
      properties:
        type:
          type: string
          description: >-
            `Normal` or `Warning`. Kubernetes defines no others and a controller
            can write anything, so it is passed through rather than mapped - a
            client colors what it recognizes and draws the rest plainly.
        reason: { type: string }
        message:
          type: string
          description: >-
            **Never clipped.** The message is the entire content of an event - the
            scheduler's reason for not placing a pod, an image-pull error, an
            admission webhook's refusal - and those run to several hundred
            characters with the answer at the end as often as at the start. The
            cluster list clips to 140 because a table cell that holds a paragraph
            is a column nobody can read; this panel is where the whole sentence
            is.
        from:
          type: string
          description: Who reported it - the scheduler, the kubelet on a named node, a controller.
        count:
          type: integer
          minimum: 0
          description: >-
            How many times it has fired. A `BackOff` that has fired 340 times and
            one that fired once are the same row without this, and the first is an
            incident.
        first: { type: string, format: date-time }
        last:
          type: string
          format: date-time
          description: >-
            The most recent observation, which is what a panel sorts and dates by.
            A series event's `first` can be hours older and saying so is the
            point - *since 09:12, 340 times* is a different sentence from *at
            09:12*.
        about:
          $ref: '#/components/schemas/EventAbout'
          description: >-
            **The owned object this event is about, when it is not the object on
            screen.** On a controller - a Deployment, ReplicaSet, StatefulSet,
            DaemonSet, Job, CronJob or ReplicationController - the panel carries
            the events of the ReplicaSets, Jobs and pods it owns as well, because
            that is where a controller's reason usually is.
            Absent on the object's own events.

    EventAbout:
      type: object
      description: >-
        An object a controller owns, named on an event row. It is in the
        namespace of the object on screen: a controller owns nothing outside its
        own namespace.
      required: [kind, title, name]
      properties:
        kind:
          type: string
          description: The plural resource name, as an address carries it - `pods`.
        title:
          type: string
          description: The singular kind, as a person reads it - `Pod`.
        name: { type: string }

    EventsPanelEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/EventEntry' }

    AlertEntry:
      type: object
      description: A machine-level condition worth acting on - memory or disk pressure, a node not ready.
      required: [subject, summary]
      properties:
        subject:
          $ref: '#/components/schemas/Ref'
          description: >-
            The node. Its destination opens the object rather than a list: a node
            under pressure is read through its conditions and its events, which are
            two views of one thing.
        summary: { type: string }
        detail: { type: string }
        tone: { type: string, enum: [normal, muted, ok, warn, bad] }

    AlertsPanelEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AlertEntry' }

    TroubleEntry:
      type: object
      description: >-
        One workload that is not in the state it declares. **This is the panel the
        dashboard exists for**: counts, capacity, a leaderboard and recent events
        are none of them a thing to act on. A dashboard that reports 430 pods and a full capacity bar while eight
        Deployments are unavailable is a reassuring page about a broken cluster.
      required: [object, detail]
      properties:
        kind: { $ref: '#/components/schemas/Ref' }
        scope: { $ref: '#/components/schemas/Ref' }
        object: { $ref: '#/components/schemas/Ref' }
        detail: { type: string }
        since:
          type: string
          format: date-time
          description: >-
            When the object left the state it declares, read from **the object's
            own record of the transition** - never from the page's clock. `detail`
            is a sentence about the present, and nothing else on the row said how
            long it had been so, which is the first thing a reader needs to tell a
            Deployment mid-rollout from one broken since Tuesday.

            Per kind. **Deployment**: the `Available` condition's
            `lastTransitionTime` while it is `False`, else `Progressing`'s when its
            reason is `ProgressDeadlineExceeded`; a Deployment short of a replica
            that is still Available is a rollout inside its budget and carries no
            `since`. **StatefulSet** and **DaemonSet**: the shortfall itself is a
            pair of integers with no timestamp, so the `startTime` of the newest
            non-ready pod the object controls stands in - a proxy, the newest so
            the panel never claims a trouble older than the most recent thing it
            can point at. **Job**: when it failed - the `Failed` condition's
            `lastTransitionTime`, else `FailureTarget`'s while the controller is
            still terminating its pods; not `status.startTime`, which would date a
            short run that failed an hour ago from the day it started. **Pod**:
            none.

            Absent is a real state and is drawn as an em dash, **never as now**.
        age:
          type: string
          description: >-
            `since` in the server's own wording - "3d", "47m" - measured from the
            page's `collectedAt` like every other age on it, so that two panels
            dating the same object cannot spell it two ways. Absent with `since`.
        tone: { type: string, enum: [normal, muted, ok, warn, bad] }

    TroublePanelEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TroubleEntry' }

    RestartEntry:
      type: object
      description: >-
        A container that keeps exiting. Separate from `TroubleEntry` because the
        useful fact is different: a workload in trouble is read by what it says about
        itself, a restarting container by **why it last exited and when**.
      required: [object, container, init, restarts]
      properties:
        scope: { $ref: '#/components/schemas/Ref' }
        object: { $ref: '#/components/schemas/Ref' }
        container: { type: string }
        init:
          type: boolean
          description: >-
            Whether the kubelet files this container under `initContainerStatuses`:
            a plain init container, or a native sidecar (an init container carrying
            `restartPolicy: Always`). **Always written, including when false**, for
            the reason `PodContainer.init` is - a row that does not say which kind
            it is sends the reader to the wrong logs.

            Init containers are listed as well as app containers; this member is
            what lets a client tell the two kinds apart.

            **It does not reorder them.** The sort is the restart count first, and
            an init row is not promoted, because "arguably more urgent" is not a
            rule a reader can predict from a screen - the mark is what the panel
            offers instead.
        restarts: { type: integer, minimum: 0 }
        reason: { type: string }
        lastExitAt:
          type: string
          format: date-time
          description: >-
            When it last exited, from the kubelet's own stamp on the previous run
            (`status.containerStatuses[].lastState.terminated.finishedAt`) and never
            from the page's clock.

            Absent where there is no instant to give, which is a real state and is
            not the same as exiting just now. Two things reach it and this member
            cannot tell them apart: a container whose `lastState.terminated` the
            kubelet no longer holds - it keeps only the most recent, and a node
            reboot or its garbage collector takes that with it - and one whose
            termination is recorded with no `finishedAt` on it. `reason` usually
            survives in the second and not in the first, which is as far as a
            client can distinguish them. **A row with no `lastExitAt` is drawn as
            an em dash and never as "0s"**: this is the cell a reader reads to
            decide whether an incident is live.
        age: { type: string }
        tone: { type: string, enum: [normal, muted, ok, warn, bad] }

    RestartsPanelEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/RestartEntry' }

    PhaseEntry:
      type: object
      description: >-
        One band of the workload phase bar. **Data and not a drawing**: markup
        composed on the server is the one thing this contract refuses everywhere.
      required: [phase, count]
      properties:
        phase: { type: string }
        count: { type: integer, minimum: 0 }
        tone: { type: string, enum: [normal, muted, ok, warn, bad] }
        ref: { $ref: '#/components/schemas/Ref' }

    PhasePanelEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PhaseEntry' }

    SkippedPanel:
      type: object
      description: |
        One panel this page could not fill, named, with the reason it could not.

        **It is not the same thing as a panel envelope on a failure arm, and that is
        why it has a schema of its own.** A per-panel envelope answers for a panel
        that was *asked for* and did not answer. This answers for one that was never
        asked, because a prerequisite was missing - the pod list that every workload
        panel is summed from, the discovery call the kind tiles are built from. Those
        panels are simply not in the payload, and a page that draws nothing where they
        would have been is a page saying the cluster is quiet: an empty panel that
        never says why is how "the cluster is quiet" and "we were not allowed to
        look" come to look the same.

        **Nothing here leads anywhere, on purpose.** The subject is a panel that did
        not load, and the only useful destination would be whatever the reason says to
        fix - a kubeconfig, an IAM role - which is not a page.
      required: [panel, reason, affects]
      properties:
        panel:
          type: string
          description: The panel's own name, as the page would have titled it.
        reason:
          type: string
          description: >-
            The first line of what went wrong. A Kubernetes error runs to a paragraph
            and the first line is the one that names the problem.
        affects:
          type: array
          items:
            type: string
            enum: [version, counts, capacity, top, events, alerts, trouble, restarting, phases, history]
          description: |
            **Which members of `Overview` this failure left incomplete**, by their own
            property names on that schema.

            A page-level entry is not enough on its own: when the warning-event feed
            fails, the page answers `allWell: false` with this entry naming it - and
            `events` can still answer `{"state": "empty", "items": []}`. A reader
            looking at the warnings panel is told *there are no warning events*, which
            is excellent news and false, and the correction is at the top of the page
            in another component.

            So this member exists to let a client **mark the panel** the failure spoilt,
            pointing back at the entry that explains it. That removes the false reading
            without turning a bad cluster day into a wall of error boxes, which every
            panel carrying its own failure envelope would.

            **They are this schema's property names and not a vocabulary of their own.**
            A second spelling would be a second thing to keep in step, and the one it
            would drift from is the payload beside it. `version` is in the list although
            it is a string rather than an envelope: it is drawn, so it can be wrong.

            **The server says what a failure spoils because the server is what knows.**
            One read feeds more than one panel - the Deployments list is behind both a
            `counts` tile and the `trouble` rows - and a client re-deriving that from a
            panel's prose name would be re-deriving an identity from a printed string.

            May be empty: a failure that spoilt nothing this page draws is still worth
            listing here, and an empty array says so rather than being absent.

    Overview:
      type: object
      description: |
        **One envelope per panel, and that is the point.** The dashboard reads from
        several places at once; enveloping only the page would mean that one missing
        metrics source makes the whole dashboard unreadable, or - far worse, because
        it looks fine - makes it draw usage as zero beside a correct capacity.

        Each panel answers for itself: a page that shows three panels and one
        stated reason.

        Counts, capacity, a leaderboard and recent events are the page's
        description of itself. `alerts`, `trouble` and `restarting` are the half a
        reader opens it for: what is wrong and which machine it is on. A dashboard
        carrying only the first four is a page that is never wrong and never
        useful, and `allWell` below could not be computed from it at all.

        The machines one by one are the Nodes page's, which `nodesSummary` leads
        to; this page does not list them.
      required: [cluster]
      properties:
        cluster: { type: string }
        version: { type: string }
        collectedAt: { type: string, format: date-time }
        allWell:
          type: boolean
          description: |
            There is nothing on this page to act on.

            **Both halves, and it is a server judgment for that reason.** The
            machine side alone says "every node is fine", which on a cluster with
            eight crash-looping deployments is a true sentence that reads as a false
            one. A badge saying nothing needs acting on is exactly the reassurance
            that stops somebody reading the rest of the page, so it may only appear
            when it is the whole truth - and a client computing it from whichever
            panels it happened to receive would raise it on a page with two panels
            missing.
        nodesSummary:
          $ref: '#/components/schemas/Ref'
          description: The machines as one sentence - "9 of 10 nodes healthy" - pointed at the node list.
        nodesTone: { type: string, enum: [normal, muted, ok, warn, bad] }
        workloadsSummary:
          $ref: '#/components/schemas/Ref'
          description: The same for what is running, pointed at the pod list.
        counts: { $ref: '#/components/schemas/CountsPanelEnvelope' }
        capacity: { $ref: '#/components/schemas/CapacityPanelEnvelope' }
        top: { $ref: '#/components/schemas/TopPanelEnvelope' }
        events: { $ref: '#/components/schemas/EventsPanelEnvelope' }
        eventsTotal:
          type: integer
          minimum: 0
          description: >-
            How many warning events there were **before `events` was cut** to the
            200 the server sends, newest first - `restartingTotal`'s member for the
            warning feed, for the same reason. Equal to the number of
            items when nothing was cut. Absent where the panel did not answer.
        alerts: { $ref: '#/components/schemas/AlertsPanelEnvelope' }
        trouble: { $ref: '#/components/schemas/TroublePanelEnvelope' }
        restarting: { $ref: '#/components/schemas/RestartsPanelEnvelope' }
        restartingTotal:
          type: integer
          minimum: 0
          description: |
            How many restarting containers there were **before `restarting` was cut**
            to the 200 the server sends, worst first.

            The cap bounds the payload; it is not a judgment about how many rows
            are worth reading. Without this member a client paging through a cut
            list would draw "181-200 of 200" on the last page of 900 crash loops,
            which reads as the end of the list. Equal to the number of items when
            nothing was cut, larger when something was, and a client says so.

            A count beside the envelope and not a state of it: the items that are
            carried are the true worst ones, so the arm is still `ok`. Absent
            where the panel did not answer.
        phases: { $ref: '#/components/schemas/PhasePanelEnvelope' }
        history:
          $ref: '#/components/schemas/MetricsEnvelope'
          description: >-
            The cluster's own series over time, where there is a source that keeps
            any. The same shape an object's metrics panel uses, so there is one
            series type in the contract rather than two that drift.
        notShown:
          type: array
          items: { $ref: '#/components/schemas/SkippedPanel' }
          description: |
            **What this page did not look at, in one list.** The per-panel
            `reason` covers a panel that was asked and failed, and this covers the
            panels that were never asked because a prerequisite was missing - which are
            precisely the ones with no envelope to carry a reason.

            It is a page-level list rather than ten scattered per-panel sentences
            because it is the one place that says *what you are not seeing and why* in
            one glance, and because a reader who has to visit ten panels to assemble
            that answer does not assemble it.

            Absent or empty means everything on this page is the truth. It is also the
            second half of `allWell`: a page with entries here is not all well, however
            quiet the panels that did load.
        accessNote:
          type: string
          description: >-
            The access review narrowed what this page counts: the person signed in
            may not list pods, events or a workload kind in every namespace, so the
            panels describe the namespaces they may. Absent when every list behind
            the page was the cluster's whole answer. Built from the question,
            never from the rows.

    OverviewEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Overview' }

    # ---- Metrics, history, env ------------------------------------------

    MetricsPanel:
      type: object
      required: [series]
      properties:
        series:
          type: array
          description: |
            One entry per **line**, and a chart may be several lines. The network
            chart is two - receive and transmit, keyed `network_rx` and `network_tx`
            - because in and out belong on one pair of axes: the question is which
            way the traffic is going, and two charts with independently scaled axes
            draw a kilobyte of egress as tall as a gigabyte of ingress.

            **Two keys, not one series with two value arrays.** Each line keeps its
            own `Series` - one start, one step, one run of samples, its own
            `trustworthy` and its own `reason` - so a cluster that exports receive
            and not transmit sends one line with samples and one line saying why it
            has none, and nothing downstream has to learn a second shape of
            `Series`. What ties the two together is `chart`.

            **A line that could not be read is sent, empty, with its `reason`** -
            never omitted. A client finding nothing under the Network icon could
            otherwise draw the first series it had, which is CPU. An absent line is
            its own absence; it is never another line.
          items:
            type: object
            required: [key, label, data]
            properties:
              key:
                type: string
                description: >-
                  This line's identity, unique within the panel: `cpu`, `memory`,
                  `network_rx`, `network_tx`, `disk`.
              chart:
                type: string
                description: >-
                  The `metrics[].key` this line is drawn under. Absent means the line
                  is its own chart (`chart` equals `key`), which is every chart but
                  the network. The client groups lines by this and never by matching
                  `key` against the icon row - the two can disagree, as for a pod's
                  filesystem (`container filesystem` against `disk`).
              label: { type: string }
              unit: { type: string }
              data: { $ref: '#/components/schemas/Series' }
              reason:
                $ref: '#/components/schemas/Reason'
                description: >-
                  Why this line has no samples, when it has none: the counter this
                  Prometheus does not export, the window the object is younger than.
                  Never on a line that was read. Its `code` is branchable:
                  `not_installed` is nothing to ask (no Prometheus) or a counter
                  this Prometheus does not export - on `cpu` and `memory`, which
                  have no counter probe, only the first, and that is what the
                  client grays the span buttons on; `empty_scope` is a window that
                  holds no sample; `cluster_unreachable` is a Prometheus that did
                  not answer. Drawn under the line's own icon as
                  the absence of *that* measurement - "this is not a claim that the
                  object is idle" is the server's sentence and it travels here so the
                  client does not have to invent one.
              current:
                $ref: '#/components/schemas/Reading'
                description: >-
                  What this measurement is **now**, from a source that keeps no
                  history - metrics-server, the figure `kubectl top` prints - on a
                  line that has no samples to draw. Sent for `cpu` and `memory`,
                  the two that source measures, and never on a line that was read:
                  there the newest sample is the figure.

                  **Usage and history are two questions**, and a cluster with
                  metrics-server and no Prometheus answers the first. Without this
                  its panel would draw "not measured" over a pod whose CPU the same
                  console's Pods list shows. `reason` still says why there is no
                  series; this is what there is.
              period:
                type: string
                description: >-
                  The `windows[].key` of the period that shows what this empty line
                  could not, on a finished pod: the one that holds its run, when the
                  run ended before the window on screen began, or the one that draws
                  a point often enough not to step over it, on a gauge whose step is
                  longer than its lookback. Only on a line whose `reason` is
                  `empty_scope`, and the reason's message names the same period.
                  The client draws a button beside that message which selects it,
                  exactly as pressing it in the period row would; **the period the
                  person chose is never changed without that press**: a sentence
                  and a button, never a silent switch.
              runTotal:
                $ref: '#/components/schemas/Reading'
                description: >-
                  What a finished pod's network counter counted over its whole run,
                  in bytes, on an empty `network_rx` or `network_tx` line where
                  Prometheus holds at least one sample of the run: the increase
                  between the first and the last sample, or the counter's value
                  where it holds one. The client shows it in place of the chart,
                  saying it is the whole run. Absent where no sample of the run
                  could be read; the line's `reason` then stands alone.
        caption:
          type: string
          description: >-
            The span the drawn series cover. Absent on a panel that drew none: a
            caption about a window nothing was read over is a sentence about
            nothing.
        metrics:
          type: array
          description: |
            **Which measurements this panel offers, and why each one it does not is
            refused.** The panel is an icon row and one chart; this is the row.

            `reason` on an unavailable measurement is the load-bearing half. A
            measurement with a reason is drawn as a disabled control carrying it,
            never as a link - because the alternative is a chart drawing a flat line
            at zero for a container pushing 40MB/s, which is a confident wrong answer
            and precisely the collapse this contract is built to refuse. Four icons
            of which two are gray is a question, and an unanswered question about a
            monitoring panel gets answered with a guess.
          items:
            type: object
            required: [key, label, available]
            properties:
              key: { type: string }
              label: { type: string }
              available: { type: boolean }
              selected: { type: boolean }
              reason: { $ref: '#/components/schemas/Reason' }
        windows:
          type: array
          description: >-
            The spans this panel can be asked for. Server-side because which of them
            are answerable depends on the source - a backend holding the current
            reading and no history can answer none of them - and a client offering a
            span nothing can fill is offering a chart that will be empty. On a
            cluster with no Prometheus they are still sent, and the client grays
            them with "no Prometheus detected" on hover, read from the `cpu` and
            `memory` lines' `not_installed` reason.
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
              selected: { type: boolean }
        zoomable:
          type: boolean
          description: >-
            The full-size overlay can honor the selected series. Asked of the server
            rather than assumed, because an overlay that opens onto "unrecognized
            series" is worse than a chart that is not clickable.

    MetricsEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MetricsPanel' }

    ChangesPanel:
      type: object
      description: |
        **Who last wrote which part of this object** - the field managers' record,
        newest first.

        It is not what this console's own archive holds about one object: that is
        a **different panel** which no operation serves. The archive is running
        and is reachable through nothing; `/archive` is the name reserved for it
        and is deliberately unbuilt.

        ## Two halves, each with its own answer

        The panel reads **two different objects**: `entries` comes off the object
        itself - its `managedFields` - and `rollouts` comes off the ReplicaSets a
        Deployment left behind. So it carries two `state`/`reason` pairs and not
        one, because a `forbidden` on `replicasets` under tight RBAC is ordinary
        while the Deployment itself reads fine, and one state cannot say both.

        Each half must keep its emptinesses apart, which is the whole reason the
        states exist here rather than a bare array:

        - **Nothing has changed** versus **this object records no changes at all**.
          Anything created before server-side apply, or by a controller that does
          not set `managedFields`, has no history to show and has not been quiet -
          `entriesState: absent` is the second, `empty` the first.
        - **A history that could not be read** versus **a workload that has never
          shipped**. Opposite facts, one empty list.

        This route answers from `internal/changes`, which reads the live object
        and keeps no window, no retention and no captured output; members about
        those belong to `/archive`, which is named, agreed and deliberately
        unbuilt.
      required: [entries]
      properties:
        entries:
          type: array
          description: >-
            Who last wrote which part of this object, newest first - read from the
            object's own `managedFields` and not from any store.
          items:
            type: object
            required: [at, summary]
            properties:
              at: { type: string, format: date-time }
              summary: { type: string }
              reason: { type: string }
              count: { type: integer, minimum: 0 }
              revision: { type: integer }
              tone: { type: string, enum: [normal, muted, ok, warn, bad] }
              ref: { $ref: '#/components/schemas/Ref' }
        rollouts:
          type: array
          items: { $ref: '#/components/schemas/Rollout' }
          description: >-
            **What shipped, and when** - the revisions of a workload, newest
            first. A second list rather than more entries, because it answers a
            different question: `entries` says *who wrote which field*, and this
            says *which image was running between Tuesday and now*. An operator
            reading a rollback needs the second and gets nothing from the first.

            Filled where the kind has revisions - a Deployment, a StatefulSet, a
            DaemonSet - and absent everywhere else rather than empty, because a
            ConfigMap has no revisions and an empty list under a heading reads as
            one that lost them.
        rolloutsState:
          $ref: '#/components/schemas/State'
          description: >-
            The rollout history's own answer, so a history that could not be read
            is not a workload that has never shipped.

            The same pair as `entriesState`/`entriesReason` below, and separate
            from it because the rollout half reads a **different object**: the
            ReplicaSets the Deployment left behind. A `forbidden` on `replicasets`
            is ordinary under tight RBAC while the Deployment itself reads fine,
            so the panel's two halves genuinely have two answers and one state
            cannot carry both.

            Absent entirely where the kind has no revisions - a ConfigMap is not
            an `empty` rollout history, it is an object that has none. `empty` is
            a workload that has never been rolled out, and `rollouts` is then
            absent for that too, which is why the distinction has to live here.
        rolloutsReason: { $ref: '#/components/schemas/Reason' }
        entriesState:
          $ref: '#/components/schemas/State'
          description: >-
            The entries half's own answer, so an object that records nothing is not
            an object that has not changed.

            `ok` where there are entries. `absent` where the object carries no
            `managedFields` at all - created before server-side apply, or by a
            controller that does not set them - which is a real and common answer
            and is the opposite of a quiet object. `empty` where it records them
            and there are none.

            A failed read of the object itself is **not** here: it fails the whole
            panel and travels on the envelope, because there is no half of this
            left to draw. That is the asymmetry with `rolloutsState`, whose read is
            a second one that can fail alone.
        entriesReason: { $ref: '#/components/schemas/Reason' }

    ChangesEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChangesPanel' }

    EnvValue:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value:
          type: string
          description: >-
            The revealed value, as text. **An empty string here is a revealed empty
            value**, which is a real and confusing thing to meet in a Secret - and it
            is distinguishable from a row nobody opened only because the envelope
            around this is `ok` rather than absent. That is the whole argument for the
            envelope, on the one payload where being wrong exposes or hides a
            credential.

            It is never how a value the server could not decode is reported: that is a
            refusal, `unreadable` / `undecodable`, and this member is absent with the
            rest of `data`. See the operation.
        variable:
          type: string
          description: The name as the container sees it, prefix included, where one was given.
        source:
          type: string
          description: Where the value comes from, when it is not literal.
        sourceKind:
          type: string
          description: >-
            The kind of object behind it. Absent where there is no object to name -
            a value the kubelet decides at start-up, such as a field or a resource
            reference, is stored nowhere this console could read and is a different
            answer from one it could read and did not.
        truncated:
          type: boolean
          default: false
          description: >-
            What is carried is part of the value, so a client keeps a control for the
            rest of it rather than presenting a prefix as the whole thing.

    EnvValueEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/EnvValue' }

    # ---- Edit ------------------------------------------------------------

    DataEntry:
      type: object
      required: [key, masked]
      properties:
        key: { type: string }
        value:
          type: string
          description: >-
            The value, and the empty string is a value. **Absent means there is
            nothing to draw**, never that the value is empty. A ConfigMap key set
            to `""` arriving absent would be drawn "Held back until you ask for
            it." over an object that withholds nothing; that sentence is a security
            affordance, and saying it about a ConfigMap teaches the wrong thing
            about what masking means.

            Which absence it is, is said by the members beside it: `masked` for a
            Secret's key, which is revealed through the one door and never
            inline here; `binary` for a value that is not text. Neither set, and
            absent, is a ConfigMap's `binaryData` key - base64 in the object,
            which this panel does not decode.
        masked: { type: boolean }
        binary:
          type: boolean
          default: false
          description: >-
            The stored value does not decode to valid UTF-8. Said here so a panel
            draws the key as binary instead of an empty box, and so it does not offer
            a reveal it cannot honor: `revealEnvValue` refuses such a key with
            `undecodable`. One flag decides both - the panel's marking and the door's
            refusal come from the same reading, so they cannot disagree.

    DataPanel:
      type: object
      required: [kind, name, entries, resourceVersion]
      properties:
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        resourceVersion:
          type: string
          description: Carried back on the write as a precondition. Without it, two tabs overwrite each other.
        entries:
          type: array
          items: { $ref: '#/components/schemas/DataEntry' }
        editable: { type: boolean }
        editableNote:
          type: string
          description: >-
            **Which setting refuses the write**, when one does: this cluster is
            guarded, the object is immutable, or this console's ServiceAccount is
            not granted patch on it - different people's to fix. With
            `editable: false` the edit controls are drawn disabled with this as
            their reason; `editable: false` with no note is a person who may not
            patch the object, and no edit control is drawn.

    DataPanelEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/DataPanel' }

    DataWrite:
      type: object
      additionalProperties: false
      required: [kind, name, resourceVersion, entries]
      properties:
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        resourceVersion: { type: string }
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, value]
            properties:
              key: { type: string }
              value: { type: string }
              delete: { type: boolean, default: false }

    ManifestToken:
      type: object
      description: >-
        Coloring server-side, rendered client-side. The API returns tokens and never
        an HTML string - a contract that ships markup ships an injection surface with
        it.
      required: [text, class]
      properties:
        text: { type: string }
        class: { type: string, enum: [plain, key, string, number, boolean, comment, anchor, punctuation] }

    ManifestLine:
      type: object
      required: [number, tokens]
      properties:
        number: { type: integer, minimum: 1 }
        tokens:
          type: array
          items: { $ref: '#/components/schemas/ManifestToken' }

    ManifestPanel:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items: { $ref: '#/components/schemas/ManifestLine' }
        raw:
          type: string
          description: The document itself, for the editor. Secret values are masked in it.
        maskedKeys:
          type: array
          items: { type: string }
          description: |
            The `data` keys whose value in `raw` is the mask, and which the one
            door (`revealEnvValue`) can answer for. Present on a Secret, absent
            everywhere else - an empty list is what tells the editor there is
            nothing to offer a reveal for.

            **Why the server says which, rather than the editor reading the
            document.** The editor needs the values to edit them and gets them
            through the one door, one request per key, so that each reveal is a
            line on the record. Which keys to ask for is a fact the
            server already holds when it masks them; an editor that parsed the
            YAML to find the masks would be a second copy of the rule of what is
            hidden, and the copy that drifts.

            A key whose value is not text is **not** listed: the door reveals
            text, and a reveal it cannot honor is a control that fails after
            the click. Its mask stays, and typing a new base64 over it is still
            how it is changed.
        resourceVersion: { type: string }
        editable: { type: boolean }
        editableNote:
          type: string
          description: >-
            Which setting refuses the write, when one does; absent beside
            `editable: false` when the person may not patch the object, and no
            edit control is drawn. See `DataPanel.editableNote`.

    ManifestEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ManifestPanel' }

    CreateAffordance:
      type: object
      description: |
        Whether the list's "+" may create an object of this kind, reviewed
        **for the person** in the namespace in
        view - the one namespace a new object goes to - or cluster-wide for a
        cluster-scoped kind. Absent where the kind cannot be created at all
        (a list the console reads but does not write). `permitted: false` comes
        with the `reason`, and the client draws the button disabled carrying it:
        an absent button reads as a console that has no such feature. The
        server reviews again on `previewCreate`, so a forged request is refused
        whatever this said.
      required: [permitted]
      properties:
        permitted: { type: boolean }
        namespace:
          type: string
          description: >-
            The namespace the verdict is for, and the one the template is filled
            with. Absent on a cluster-scoped kind, and on a namespaced kind shown
            across several namespaces or all of them, where no single namespace
            is in view and `reason` says to pick one.
        kind:
          type: string
          description: >-
            The kind as the cluster's discovery spells it, `ConfigMap` or
            `Endpoints`, for the button's name. Absent where the kind could not
            be resolved.
        reason: { $ref: '#/components/schemas/Reason' }

    CreateTemplate:
      type: object
      required: [document, kind]
      properties:
        document:
          type: string
          description: The YAML to open in the editor, ending in a newline.
        kind:
          type: string
          description: The API's own spelling of the kind, `Deployment`, for the editor's title.
        generic:
          type: boolean
          description: >-
            True where the kind has no written template and the document is the
            skeleton of `apiVersion`, `kind` and `metadata`, so the editor can say
            the body is the person's to write.

    CreateTemplateEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CreateTemplate' }

    Prereq:
      type: object
      description: >-
        One prerequisite on one cluster, as this person can see it.
        `application` is absent where Argo CD was not found, since there is no
        namespace to look in. `reason` says why not where `installable` is
        false; where it is true, what the console could not review (the
        cluster decides), if anything.
      required: [key, label, chart, argo, installable]
      properties:
        key: { type: string }
        label: { type: string }
        chart: { $ref: '#/components/schemas/PrereqChart' }
        argo: { $ref: '#/components/schemas/PrereqArgo' }
        application: { $ref: '#/components/schemas/PrereqApplication' }
        installable:
          type: boolean
          description: >-
            Whether a preview is worth asking for now: a writable cluster, Argo
            CD found once, no Application there yet, and `create` not refused
            for the person. The preview and the install check it all again.
        reason: { $ref: '#/components/schemas/Reason' }
        helm: { $ref: '#/components/schemas/PrereqHelm' }

    PrereqChart:
      type: object
      description: The chart an install brings, pinned exactly.
      required: [repo, name, version, namespace]
      properties:
        repo: { type: string }
        name: { type: string }
        version: { type: string }
        appVersion: { type: string }
        namespace:
          type: string
          description: Where the chart's release goes.

    PrereqArgo:
      type: object
      description: >-
        Argo CD as this person can see it. `unknown` is a read that could not
        answer - refused, narrowed to namespaces that hold none, or failed - and
        is never drawn as `absent`.
      required: [state]
      properties:
        state: { type: string, enum: [found, absent, ambiguous, unknown] }
        namespace:
          type: string
          description: The application-controller's, where `state` is `found`.
        namespaces:
          type: array
          items: { type: string }
          description: Every namespace a controller runs in, where `state` is `ambiguous`.
        note: { type: string }

    PrereqApplication:
      type: object
      required: [state, name, namespace]
      properties:
        state: { type: string, enum: [absent, present, unknown] }
        name: { type: string }
        namespace: { type: string }
        note: { type: string }

    PrereqHelm:
      type: object
      description: >-
        The chart as `helm upgrade --install` takes it, where Argo CD is not
        there to install through. Structured, so the client composes the
        command and no sentence carries it.
      required: [release, repo, chart, version, namespace]
      properties:
        release: { type: string }
        repo: { type: string }
        chart: { type: string }
        version: { type: string }
        namespace: { type: string }

    PrereqEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Prereq' }

    ManifestWrite:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          type: string
          description: >-
            The document as submitted. The kind that is authorized is read out of
            **this**, after parsing - never from a route or from a sibling field.
          maxLength: 4000000
        resourceVersion: { type: string }

    # ---- Confirm-then-act ------------------------------------------------

    PlanTarget:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        note: { type: string }
        refused:
          type: boolean
          description: >-
            Set on a selection's preview for a target the person may not act on;
            `note` then carries the refusal's reason.

    Confirmation:
      type: object
      description: >-
        How the person is asked to agree. `count` means they type or confirm the
        number of targets rather than a name - a decision already taken in this
        product, carried here so that the front end cannot quietly choose an easier
        gesture. `number` is for a scale, which asks for a replica count: a value
        the act needs rather than a gesture proving intent.
      required: [kind]
      properties:
        kind: { type: string, enum: [acknowledge, count, name, number] }
        expected:
          type: string
          description: >-
            The exact text that has to be typed back, for `count` and `name`. Read
            off what is on screen, so it fails when the screen is not describing what
            the person believes it is - a second tab, another installation, a set
            already acted on. A fixed word would be answered by muscle memory.
        label:
          type: string
          description: >-
            The sentence above the box. "Type 12" with no reason reads as an obstacle
            rather than as a check, and a check that reads as an obstacle is one
            people learn to get past without reading.
        value:
          type: integer
          description: The value in effect now, for a `number` gesture.
        minimum: { type: integer }
        maximum: { type: integer }

    PlanFacts:
      type: object
      description: The structured truth about what would happen. Always present.
      required: [verb, targets, count, destructive]
      properties:
        verb: { type: string }
        targets:
          type: array
          items: { $ref: '#/components/schemas/PlanTarget' }
        count:
          type: integer
          minimum: 0
          description: >-
            The number of targets the server resolved. Not the number the front end
            has selected - if they differ, the front end is about to confirm the
            wrong thing. **It may also exceed `targets.length`**, where the list was
            too long to send whole: "12 shown of 47" is the truth and "all" is not,
            so a client reads this figure and never the array's length.
        destructive: { type: boolean }
        irreversible:
          type: boolean
          default: false
          description: >-
            Nothing would make the object again once the act is done. On a single
            verb's plan it is read off the object: a delete of a
            pod its ReplicaSet replaces is not irreversible, a delete of a pod
            nothing owns is, and so is any delete no controller, Argo CD application
            or Helm release stands behind. The `headline` then says so, and a client
            draws that line in the color it gives a loss.
        headline:
          type: string
          description: |
            **The one line about this object a single verb's plan leads with**, read
            off the object by its preview: "Deletes pod web-7f9c-x2. ReplicaSet
            web-7f9c creates a new one.", "Starts a Job from nightly, now." Where a
            plan carries one, `sentence` is this line - the server still composes it,
            from the facts - so a client draws `sentence` and composes nothing.

            Absent on a plan with no verb spec behind it and on a set, whose
            `sentence` is composed from the verb, the count and the kind.
          maxLength: 1024
        explanation:
          type: string
          description: |
            **What the verb does, in the server's words, in full sentences and in
            the present tense.** `sentence` above names the act and the target -
            "Restart Deployment argo/api" - and that is all it can do from the
            facts. This is the paragraph that says what *restart* means on the
            kind being acted on, and it is written per (verb, kind) because the
            answer differs: a rollout restart stamps an annotation and replaces
            pods gradually, and restarting a Pod deletes it.

            Absent where the plan has no verb spec behind it - a manifest apply,
            a data write. A client draws nothing extra there rather than
            composing a paragraph of its own: *a confirmation that only asks "are
            you sure?" is one people learn to answer without reading*, and a
            confirmation whose explanation was invented by the client is worse
            than that.

            **Not what a confirmation leads with**: it is true of
            every object the verb meets, and the line that is true of this one is
            `headline`. A client folds it, with `warning`, one gesture away.
          maxLength: 2048
        warning:
          type: string
          description: >-
            The one sentence in red, for a verb whose consequence is not what its
            name suggests - *"If nothing owns this pod, deleting it is all that
            happens"*. Distinct from `warnings` below, which are read off **this
            object** and this reading of it; this is a property of the verb and is
            the same every time, which is why a client folds it with `explanation`
            rather than leading with it.
          maxLength: 1024
        button:
          type: string
          description: >-
            The wording on the control that commits: the act and, on a plan about
            one object, the object - `Delete web-7f9c-x2`, `Run nightly now`,
            `Cordon node-a and list its pods`; on a set, the count - `Delete 4
            pods`. The server composes it for the reason it composes `sentence`: a
            button labeled with the bare verb makes a restart on a Pod and a
            restart on a Deployment the same gesture, and they are not. A client
            with none draws a neutral word, never the verb slug.
          maxLength: 128
        warnings:
          type: array
          items: { type: string }
        recap:
          type: object
          description: |
            **The change itself, as fields rather than as a blob.** `diff` below is a
            dry run's output and is fine for a manifest; it cannot carry the two
            distinctions that decide whether somebody presses the button.

            `absent` is the first: a field that is not written on the object and the
            same field written `false` are indistinguishable to an API server and
            different things to read before acting on a production node. `before`
            then carries the value in effect, and both facts are shown.

            `unchanged` is the second: uncordoning a node that is already schedulable
            is a no-op, and a confirmation promising a change would be wrong about it
            - which is worse than saying nothing, because it is the sentence the
            reader will believe.
          properties:
            field: { type: string }
            before: { type: string }
            after: { type: string }
            absent: { type: boolean, default: false }
            unchanged: { type: boolean, default: false }
            note:
              type: string
              description: The sentence where neither a field change nor a target set describes it.
        diff:
          type: string
          description: Where a dry run produced one.
        fields:
          type: array
          description: >-
            The paths this change touches, as the merge patch expresses them -
            `spec.replicas`, `metadata.labels.app`. The diff says what the document
            looks like afterwards; this says what the **request** asks for, and they
            are not the same statement: a diff of a reindented block is large and
            touches nothing, and that is exactly the case somebody needs to see
            before pressing the button.
          items: { type: string }
        request:
          type: string
          description: >-
            **The literal body that will be sent.** Not a rendering of it and not a
            second marshalling of the same value - the same bytes, so a confirmation
            cannot show one thing and send another. `document` is its counterpart
            where the change is a whole object; this is the patch where it is a set
            of fields.
        precondition:
          type: string
          description: >-
            The value the act is pinned to, which is what makes a confirmation left
            open while somebody else saved fail on the way through rather than apply
            to an object it never saw. Stated rather than implied: a person
            agreeing to a change is agreeing to it against a state, and a 409 that
            arrives with no earlier mention of one reads as a bug. What it is a value
            of is `preconditionOn`.
        preconditionOn:
          type: string
          description: >-
            What `precondition` is a value of. Absent means
            `metadata.resourceVersion`, which every plan carries except a verb's on a
            node or a workload. A verb on a node is pinned to `spec.unschedulable and
            spec.taints`, written out in `precondition`; a verb on any other object
            with a `metadata.generation` - a Deployment, a StatefulSet, a CronJob -
            to that generation, which the API server moves on a change to the spec
            and never on a status write. A pod keeps its resourceVersion. So a
            kubelet's heartbeat or a controller's progress report does not refuse a
            confirmation it changes nothing for.
        preconditionUid:
          type: string
          description: >-
            The `metadata.uid` of the object the plan was made on. The act is pinned
            to it as well as to `precondition`, whatever `preconditionOn` is: a
            generation restarts at 1 when an object is deleted and created again
            under the same name, and a re-registered node keeps its taints, so the
            value alone cannot tell the object from its successor. A different UID
            at the click is a 409, and a delete sends this UID as its precondition.
            Absent on a plan with no single object behind it - a bulk run, a drain's
            evictions.
        document:
          type: string
          description: >-
            The whole object, where the change **is** an object rather than a field -
            a create. It is the **same** document the act will send, marshalled from
            the same value and never written out a second time for the screen: a
            confirmation showing a manifest that is not the one being sent is worse
            than showing none, because it is the one the reader will believe.
        note:
          type: string
          description: >-
            Why there is nothing to press here - a guarded cluster, mostly. Distinct
            from a refusal: the plan is real and was computed, and the act is not
            available.
        confirmation: { $ref: '#/components/schemas/Confirmation' }
        alternative:
          $ref: '#/components/schemas/PlanAlternative'
          description: >-
            Another plan the person may ask for instead of this one. Sent on a
            drain's eviction stage that leaves pods nothing owns on the node: the
            request is the same drain with `includeUnowned`, which starts again at
            the cordon, so evicting those pods is chosen in a plan of its own and
            confirmed there. Not part of what the plan agrees
            to: an offer.
        forceable:
          type: boolean
          description: >-
            The act may be sent with `ActRequest.force`: delete with a grace period
            of zero, as `kubectl delete --grace-period=0` does. Only a single
            delete's plan says it; a client draws a "Force
            delete" box from it, and the server refuses `force` on any plan without
            it.

    PlanAlternative:
      type: object
      description: >-
        A plan the person may ask for, as the request to preview and the words for
        the control that asks. A client draws it as a control and previews `request`
        when it is pressed; it never composes one. Carried by a plan
        (`PlanFacts.alternative`) and, where an act ends with no next stage to carry
        it, by the act's outcome (`ActOutcome.alternative`).
      additionalProperties: false
      required: [label, request]
      properties:
        label: { type: string }
        request: { $ref: '#/components/schemas/ActionRequest' }

    ConfirmationPlan:
      type: object
      description: |
        **The server composes the sentence.**

        A preview returns the sentence a person reads before agreeing to a
        destructive action, not only the facts for the front end to phrase.
        Facts alone are cleaner as an API but move a safety-critical sentence
        into TypeScript, where no test in the Go suite can see it go wrong
        against perfectly correct facts. Here the sentence is composed in the
        same call that resolved the facts, out of those facts, so the two cannot
        disagree and one test covers both.

        `sentence` **stays optional and nullable**, which is not indecision. A client
        must handle its absence - an endpoint that has not composed one is conforming
        rather than broken - and the other answer remains reachable without a
        breaking change.

        What holds either way:

        - `facts` is always present and is always the authority. A sentence that
          disagrees with the facts is a defect in the sentence.
        - **When `sentence` is present the client renders it and does not compose its
          own.** Two authors for one sentence is worse than either author alone.
        - The act is bound to the plan by `token`, and the server re-derives the
          facts before acting. A confirmation about a set that has since changed is
          not a confirmation, which is what the 409 is for.

        See `api/errors.md` and `x-open-decisions`.
      required: [token, expiresAt, facts]
      properties:
        token:
          type: string
          description: >-
            Opaque, single-use, short-lived. It binds the confirmation to the act, and
            in the node-shell case it binds it across to a WebSocket upgrade. **A
            gesture the plan refuses (a 400) does not spend it**: the person corrects
            what they typed and sends the same token again.
            Anything past the gesture check spends it, whether or not the act then
            succeeds.
          maxLength: 512
        expiresAt: { type: string, format: date-time }
        sentence:
          type: [string, "null"]
          description: >-
            The server-composed sentence. This server fills it; the member stays
            optional and nullable by design, so a client must handle its absence.
            A client that receives one renders it verbatim and composes nothing.
          maxLength: 2048
        facts: { $ref: '#/components/schemas/PlanFacts' }
        channel:
          type: string
          description: >-
            Where the act happens when it is not an operation in this document - the
            node shell's WebSocket path, for instance.

    ActRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, maxLength: 512 }
        confirmed:
          type: string
          description: What the person typed, where the plan asked for a gesture.
        force:
          type: boolean
          description: >-
            Delete with a grace period of zero: the object's
            `terminationGracePeriodSeconds` is not waited for. Accepted only against
            a plan whose facts say `forceable` - a single delete - and refused with
            a 400 everywhere else, before the token is spent.

    ApplyRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, maxLength: 512 }

    ActionRequest:
      type: object
      description: >-
        One verb on one object. Nothing but the verb and the target: the one value
        a verb needs beyond them - a replica count - is typed as the `number`
        gesture after the plan is minted, and the version the act carries as its
        precondition is the server's, stated on the plan and never supplied by a
        client.
      additionalProperties: false
      required: [verb, target]
      properties:
        verb: { type: string, maxLength: 64 }
        target: { $ref: '#/components/schemas/PlanTarget' }
        includeUnowned:
          type: boolean
          description: >-
            A drain only, and refused on any other verb: also evict the pods
            nothing owns, which `kubectl drain` refuses without `--force`. Absent
            or false, a drain leaves those pods on the node and its plan names them
            A client sends it only from a plan's
            `alternative`, never on its own initiative.

    BulkRequest:
      type: object
      additionalProperties: false
      required: [verb, kind, targets]
      properties:
        verb: { type: string, maxLength: 64 }
        kind: { type: string }
        targets:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: '#/components/schemas/PlanTarget' }

    NodeShellRequest:
      type: object
      additionalProperties: false
      required: [node]
      properties:
        node: { type: string, maxLength: 253 }

    ActResult:
      type: object
      required: [target, ok]
      properties:
        target: { $ref: '#/components/schemas/PlanTarget' }
        ok: { type: boolean }
        message: { type: string }
        reason: { $ref: '#/components/schemas/Reason' }

    ActOutcome:
      type: object
      description: >-
        Per target, always. A bulk action that half worked is the normal case, and an
        outcome that reports one verdict for twelve objects is the empty-versus-failed
        collapse wearing a different hat.
      required: [succeeded, failed, results]
      properties:
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        results:
          type: array
          items: { $ref: '#/components/schemas/ActResult' }
        summary:
          type: string
          description: >-
            The sentence the act left behind, composed by the server for the reason
            `ConfirmationPlan.sentence` is: it has to agree with the figures beside it.
        next:
          type: array
          description: >-
            Where to go now that it has happened - the list the deleted object was
            in, the workload that will replace it. It is part of the act's answer
            because the right destination depends on what was done, and a client
            guessing it sends the person back to a page about an object that no
            longer exists.
          items: { $ref: '#/components/schemas/Ref' }
        nextPlan:
          $ref: '#/components/schemas/ConfirmationPlan'
          description: >-
            The plan for the stage that follows, where the act was one stage of
            several. A drain is the case: its first stage cordons the node and
            lists what is on it, and its outcome carries the plan for the
            evictions - the pods by name, each with its warning, the ones left
            alone as warnings - to be confirmed on its own. A client opens it in
            place of closing; nothing is evicted until it is confirmed, and it is a
            plan like any other: bound by a token, re-derived before the act, gone
            when it expires. Absent where the act was the whole of the verb.
        alternative:
          $ref: '#/components/schemas/PlanAlternative'
          description: >-
            A plan the person may ask for now that this act is done, where there is
            no next stage to carry the offer. A drain's cordon over a node that holds
            no pod a drain evicts by default, but pods nothing owns, offers the same
            drain with `includeUnowned`: it starts again at the
            cordon, and nothing is evicted until the eviction plan that names those
            pods is confirmed. Where the act has a next stage, that plan carries the
            offer instead.

    # ---- Preferences -----------------------------------------------------

    KindPreferences:
      type: object
      description: >-
        One person's choices about the kinds column.
      required: [showUnused, favourites]
      additionalProperties: false
      properties:
        showUnused:
          type: boolean
          description: >-
            The column shows the kinds with no object the person may see
            (`getNavOccupancy`'s `none`). False, the default, hides them; an
            `unknown` kind is drawn either way.
        favourites:
          type: object
          description: >-
            Per cluster name, the slugs of the kinds marked as favorites, in the
            order they were marked. A favorite is drawn whatever its occupancy.
            At most 256 clusters, which the write refuses past.
          additionalProperties:
            type: array
            maxItems: 512
            items: { type: string, minLength: 1, maxLength: 317 }

    KindPreferencesWrite:
      type: object
      required: [showUnused, favourites]
      additionalProperties: false
      properties:
        showUnused: { type: boolean }
        favourites:
          type: object
          additionalProperties:
            type: array
            maxItems: 512
            items: { type: string, minLength: 1, maxLength: 317 }

    Preferences:
      type: object
      description: |
        **The shape of the store it describes.**

        - the rail arranges clusters onto **numbered hotbars**, each an ordered
          list, and switching which one is on screen is the commonest gesture on
          it, so both the active bar and the bars are fields;
        - **the rail has no groups**, so a tile carries none;
        - `density` is one setting for every table, not one per kind - a grid
          that is comfortable on one kind and compact on another is two grids.
      required: [rail, columns]
      properties:
        seenVersion:
          type: string
          description: >-
            The last release whose "What's new" was seen on this desktop (#80).
            Absent where nothing was seen.
        rail:
          type: object
          required: [bars]
          properties:
            barCount:
              type: integer
              minimum: 1
              description: >-
                How many hotbars this build offers. A server constant, sent because
                the bar switcher has to draw exactly that many digits and a client
                that assumed a number would be wrong in the direction that hides a
                bar's worth of clusters.
            activeBar:
              type: integer
              minimum: 1
              description: Which hotbar is on screen, 1-based.
            bars:
              type: array
              description: >-
                One entry per hotbar, in bar order; each is that bar's clusters **in
                the order they are drawn**. A bar may be empty. Hidden clusters are
                in none of them.
              items:
                type: array
                items: { type: string }
            hidden:
              type: array
              description: >-
                Clusters taken off the rail. They still exist and are still
                reachable by address; they are simply not drawn. One cluster may be
                here **and** on a bar at once - the one whose page is open, which is
                drawn even when hidden so that the rail does not say the person is
                somewhere they are not.
              items: { type: string }
            nameplates:
              type: object
              description: >-
                The person's own names for clusters, keyed by context name. A
                cluster with no entry is drawn from its context name; an entry with
                an empty member means "derive that one".
              additionalProperties:
                type: object
                properties:
                  name: { type: string }
                  initials: { type: string }
                  colour:
                    $ref: '#/components/schemas/ClusterColour'
                    description: >-
                      The swatch the person chose; absent when none was, which is
                      the automatic color. See `Cluster.colour`.
                  icon:
                    type: string
                    maxLength: 1024
                    description: >-
                      The tile's icon recipe: one JSON object,
                      written and read by the browser, which renders the picture from
                      it. Absent when none was chosen, and then the tile is drawn as
                      the cluster's default icon on its color. The server checks only
                      that it is one JSON object of at most 1024 bytes.
        columns:
          type: object
          required: [kinds]
          properties:
            density:
              type: string
              enum: [comfortable, compact]
              description: >-
                **One setting for every table**, which is where the store keeps it.
                It is a statement about the person's screen rather than about pods,
                and somebody who wants more rows at once wants them everywhere.
            widthsAreDeliberate:
              type: boolean
              description: >-
                At least one width was set by hand. It is what puts a table on a
                fixed layout, laying itself out to the stored shares rather than to
                its contents - a table nobody has resized lays itself out to its
                contents. **Not the migration flag of the same name** in
                `columns.json`, which says something else entirely: this one is
                derived from the arrangement as it stands.
            kinds:
              type: object
              description: Keyed by kind.
              additionalProperties:
                type: object
                properties:
                  cells:
                    type: array
                    items:
                      type: object
                      required: [column]
                      properties:
                        column: { type: string }
                        width: { type: [integer, "null"] }
                        order: { type: integer }
                        visible: { type: boolean }

    RailBarWrite:
      type: object
      description: >-
        The route shows no bar and hides none: it selects **which hotbar is on
        screen**, out of several, which a boolean could not say.
      additionalProperties: false
      required: [bar]
      properties:
        bar:
          type: integer
          minimum: 1
          description: The hotbar to put on screen, 1-based. Bounded by `preferences.rail.barCount`.

    RailAssignWrite:
      type: object
      description: >-
        Send one cluster's tile to one hotbar. The field is `bar` and not "slot",
        which would read as a position within a bar - what `/rail/place` does.
      additionalProperties: false
      required: [cluster, bar]
      properties:
        cluster: { type: string, maxLength: 253 }
        bar: { type: integer, minimum: 1 }

    RailMoveWrite:
      type: object
      description: >-
        Nudge one tile one place along its hotbar. `direction` is what the two
        buttons send. `order` is accepted for the client that has a position in hand
        and is the weaker of the two, for the reason `RailPlaceWrite` gives: a
        position is a fact about the list the browser last saw, and the server holds
        the arrangement. Exactly one of the two.
      additionalProperties: false
      required: [cluster]
      oneOf:
        - required: [direction]
        - required: [order]
      properties:
        cluster: { type: string, maxLength: 253 }
        direction: { type: string, enum: [up, down] }
        order: { type: integer, minimum: 0, maximum: 9999 }

    RailPlaceWrite:
      type: object
      description: |
        Placing a tile puts it **beside another tile**, and a drop onto a tile on
        another hotbar moves it there. The rail has no groups.

        Deliberately "beside this tile" and not "at index 4". An index is a fact
        about the list the browser last saw; two drags in quick succession, or a drag
        against a rail one render old, then land somewhere nobody pointed at. A
        neighbor is a fact about the arrangement itself, which the server holds and
        resolves this against. The browser never has a copy of it and never gets a
        say in the position.
      additionalProperties: false
      required: [cluster, target]
      properties:
        cluster: { type: string, maxLength: 253 }
        target:
          type: string
          maxLength: 253
          description: >-
            The tile to land beside. A hidden tile cannot be dropped onto, and a
            tile dropped on itself is a no-op rather than an error - it is what a
            drag that changed its mind produces.
        edge: { type: string, enum: [before, after], default: before }

    RailTileWrite:
      type: object
      additionalProperties: false
      required: [cluster]
      properties:
        cluster: { type: string, maxLength: 253 }

    RailNameplateWrite:
      type: object
      description: >-
        A nameplate is several things. It is what the tile says,
        what it says when there is no room to say it, and what color it is - and a
        way back to the derived form for all three, which is what an empty member
        means. `reset` clears the lot in one gesture, because "nothing chosen" is a
        nameplate like any other and a route of its own would be a second way to say
        it that could drift from this one.
      additionalProperties: false
      required: [cluster]
      properties:
        cluster: { type: string, maxLength: 253 }
        label:
          type: string
          maxLength: 128
          description: >-
            The name. Empty means derive it from the context name. **Never replaces
            the context name in an address**: contexts are what this product puts in
            paths, and a nameplate that reached one would make two clusters
            indistinguishable to the router.
        initials: { type: string, maxLength: 8 }
        colour:
          anyOf:
            - $ref: '#/components/schemas/ClusterColour'
            - { type: string, const: "" }
          description: >-
            A palette key, or empty for the automatic color. A key and not a CSS
            value, and a value that is not on the palette is refused rather than
            substituted - a console that silently picks a different color from
            the one asked for is one nobody can debug. The enum is the contract's
            statement of the same refusal `internal/nameplates` makes.
        icon:
          type: string
          maxLength: 1024
          description: >-
            The tile's icon recipe - one JSON object the
            browser renders - or empty for none, which draws the default icon.
            Anything that is not one JSON object of at most 1024 bytes is refused.
            Never rendered SVG.
        reset:
          type: boolean
          default: false
          description: Clear all four (name, initials, color, icon) and return to the derived form.

    ColumnSizeWrite:
      type: object
      additionalProperties: false
      required: [kind, column, width]
      properties:
        kind: { type: string, maxLength: 128 }
        column: { type: string, maxLength: 128 }
        width:
          type: [integer, "null"]
          minimum: 16
          maximum: 4096
          description: >-
            This column's share of the table - `Column.width` carries what that
            means. **One column per request, and a gesture is therefore several
            requests**: widening one column means the ones after it give up the
            same room between them, so a client posts the whole arrangement it is
            drawing, the dragged column first and one request each in turn. The
            bounds here are the endpoint's; the store clamps to 56 and 720, and a
            client scales a whole set rather than letting one number be clamped,
            because a clamped number is a changed ratio.

    ColumnPlaceWrite:
      type: object
      description: >-
        Move one column. `target` and `edge` are the drop the store actually
        performs - beside another column, for the reason `RailPlaceWrite` gives at
        length. `order` remains for a client holding a position and is the weaker of
        the two. Exactly one.
      additionalProperties: false
      required: [kind, column]
      oneOf:
        - required: [target]
        - required: [order]
      properties:
        kind: { type: string, maxLength: 128 }
        column: { type: string, maxLength: 128 }
        target: { type: string, maxLength: 128 }
        edge: { type: string, enum: [before, after], default: before }
        order: { type: integer, minimum: 0, maximum: 999 }

    ColumnShowWrite:
      type: object
      additionalProperties: false
      required: [kind, column, visible]
      properties:
        kind: { type: string, maxLength: 128 }
        column: { type: string, maxLength: 128 }
        visible: { type: boolean }

    ColumnDensityWrite:
      type: object
      description: >-
        **No `kind`.** Row height is one setting for every table, deliberately - a
        grid that is comfortable on pods and compact on services is two grids - so
        the store has no per-kind density to write, and a body member that changes
        nothing is worse than an absent one: it reads as a promise. This is the one
        preference write whose subject is the console rather than a table.
      additionalProperties: false
      required: [density]
      properties:
        density: { type: string, enum: [comfortable, compact] }

    SeenVersionWrite:
      type: object
      description: The release whose "What's new" was seen (#80).
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'

    ColumnResetWrite:
      type: object
      additionalProperties: false
      required: [kind]
      description: >-
        Three arrangements, made by three gestures: a width comes off a drag on a
        grip, an order off a drag on a heading, a hidden column off a tick. Undoing
        all three to get one of them back would silently lose the other two, so
        each can be forgotten on its own.


        `widths` is the scope that adds a way back rather than a shortcut to one: a
        column dragged left can be dragged back and a column unticked can be ticked
        again, but the value meaning "no opinion about this width" is 0 and no pointer
        can produce it - the narrowest a drag reaches is the 56px floor, which is a
        decision and not the absence of one.
      properties:
        kind: { type: string, maxLength: 128 }
        scope:
          type: string
          enum: [all, widths, order, hidden]
          description: >-
            Which arrangement to forget. Absent is `all`.

    # ---- Dock ------------------------------------------------------------

    DesktopTerminalRequest:
      type: object
      additionalProperties: false
      required: [cluster]
      description: >-
        A terminal window on the machine running the console, pointed at one cluster
        and nothing else - not a socket and not a dock tab. It is a real application
        window: `internal/terminal/localterm.go` writes a script into a session
        directory and launches it.

        **No `cwd`, `cols` or `rows`.** There is no pseudo-terminal on this side to
        size, and no working directory to choose - the session directory is the
        server's, because that is where the per-session kubeconfig lives.
      properties:
        cluster:
          type: string
          maxLength: 253
          description: >-
            Which cluster the window's `KUBECONFIG` points at, and nothing else.
        namespace: { type: string, maxLength: 253 }
        kind: { type: string, maxLength: 128 }
        name: { type: string, maxLength: 253 }

    TerminalSession:
      type: object
      required: [id]
      properties:
        id: { type: string }
        channel:
          type: string
          description: >-
            The WebSocket path to attach to, specified in `api/websocket.md`. It is
            handed over rather than constructed by the client, so that the session and
            the socket cannot drift apart.

            **Absent where there is nothing to attach to.** A desktop terminal is an
            application window on the person's machine; it has no socket. An absent
            channel is the honest answer, and a client reads it as "there is nothing
            to open here" rather than dialling it.
        openedAt: { type: string, format: date-time }

    Container:
      type: object
      required: [name]
      properties:
        name: { type: string }
        init: { type: boolean, default: false }
        ready: { type: boolean }
        restarts: { type: integer }

    ContainerListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ListArms'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Container' }

    LogEvent:
      type: object
      description: >-
        One event of the log stream. `state` events carry the same vocabulary as an
        envelope, mid-stream, which is the only way a log that stopped because the pod
        was deleted reads differently from one that stopped because nothing is being
        written. Every `state` frame says why the stream is stopping and is followed by
        an `end`, with one exception: `state: pending` with reason
        `container_not_started` is a follow waiting for its container to start, and
        the container's lines follow it on the same stream once it runs.
      required: [type]
      properties:
        type: { type: string, enum: [line, state, end] }
        at: { type: string, format: date-time }
        container: { type: string }
        text: { type: string }
        state: { $ref: '#/components/schemas/State' }
        reason: { $ref: '#/components/schemas/Reason' }
        atStart:
          type: boolean
          description: >-
            True on the `end` event when the tail reached the beginning of the log the
            cluster still holds - which is not the beginning of time, and the wording
            that says so is the front end's to get right.

    LogPage:
      type: object
      description: >-
        One page backwards: the block of lines immediately preceding what the caller
        already holds, oldest first.
      required: [lines]
      properties:
        lines:
          type: array
          description: >-
            Oldest first, and `[]` rather than null when there are none - a client
            reads its length in the middle of a handler whose whole job is to say what
            happened.
          items: { type: string }
        stop:
          type: string
          enum: [beginning, ceiling, dense]
          description: >-
            Absent while there may be another page, and otherwise which of the three
            ways paging ended. Three and not one, because a panel that renders the same
            nothing for all of them is the empty-versus-failed collapse again:
            `beginning` is "there is nothing older", `ceiling` is "there is more and
            this console will not fetch it", `dense` is "this log is too dense to page
            through". **Only `beginning` is an ending.**
        note:
          type: string
          description: >-
            The sentence to put on screen, composed **server-side** so that curl and
            the console say the same words, and so that it can be asserted without a
            browser. The `beginning` one is careful about something nobody would think
            of on their own: never "the container started here", because the kubelet
            rotates container logs, so the oldest line the API will ever return is not
            the first line the process wrote.

    LogPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/ValueArms'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/LogPage' }

    Forward:
      type: object
      required: [id, cluster, namespace, pod, remotePort, address]
      properties:
        id: { type: string }
        cluster: { type: string }
        namespace: { type: string }
        pod:
          type: string
          description: >-
            The replica the tunnel actually reached. On a Service forward this is
            **not what was asked for**: a Service forward is not load balanced, it
            picks one ready pod and stays on it, so naming that pod is the
            difference between "the service answered" and a fact.
        service:
          type: string
          description: >-
            The Service the forward was opened on; absent on a pod forward. Carried
            because `pod` alone cannot say which row a listed forward belongs to:
            the Ports panel reads `GET /api/forwards` on mount
            so a forward opened from another drawer, or before a reload, is shown
            and stoppable beside its port - and a Service row matching on `pod`
            would claim a forward opened on the pod directly, then lose its own
            the moment a rollout replaced the pod behind it.
        remotePort: { type: integer, minimum: 1, maximum: 65535 }
        address:
          type: string
          description: >-
            The local address it is listening on, loopback by default. The Ports
            panel draws a `127.0.0.1` address as `localhost` when the console is
            itself served from `127.0.0.1`: a cookie does not isolate by port, so a
            link on the console's own host would send its session cookie to
            whatever listens behind the tunnel.
        scheme:
          type: string
          enum: [http, https]
          description: >-
            Which scheme to put in front of `address` so the link opens something
            rather than an error. **The server decides**, in three tiers of authority -
            the Service's `appProtocol`, then the port's name, then a table of known
            TLS ports - because a copy of that table in the browser would be a second
            answer to the same question, drifting the first time one of them learned a
            new port. Forwarding a 443 or a webhook port with the wrong scheme produces
            "The plain HTTP request was sent to an HTTPS port", which reads as a broken
            tunnel rather than as a wrong link. Note that an `https` forward **always**
            warns about the certificate - it names the in-cluster service and not
            127.0.0.1 - and that warning does not mean the tunnel is broken.
        openedAt: { type: string, format: date-time }

    Rollout:
      type: object
      description: One revision of a workload, as the panel draws it.
      required: [revision, at]
      properties:
        revision: { type: string }
        at: { type: string, format: date-time }
        name:
          type: string
          description: The ReplicaSet or ControllerRevision that carries it, which is what `kubectl` shows and what a rollback names.
        replicas: { type: integer, minimum: 0 }
        image:
          type: string
          description: >-
            What was running. **The single most useful column here**: a rollback
            is chosen by looking at this, and the revision number alone says
            nothing about what it contained.
        current:
          type: boolean
          description: >-
            Whether this is the revision running now. Marked rather than inferred
            from the order: the highest revision is not always the deployed one,
            which is exactly the state a failed rollout leaves behind.
        cause:
          type: string
          description: '`kubernetes.io/change-cause`, where anybody set it.'

    EventSubject:
      type: object
      description: >-
        An Event read as the sentence it is, rather than as an object with
        metadata.
      required: [message]
      properties:
        message:
          type: string
          description: >-
            **Never clipped.** It is the whole reason this shape exists: the
            list clips to 140 characters because a table cell holding a
            paragraph is a column nobody can read, and this is where the whole
            thing is.
        reason: { type: string }
        type:
          type: string
          description: '`Normal` or `Warning`, passed through rather than mapped: a controller can write anything.'
        action:
          type: string
          description: What the reporter was doing - `Binding`, `Pulling`. Empty on most events from the legacy API.
        source:
          type: string
          description: Who said it - `kubelet`, `default-scheduler`, `deployment-controller`.
        node:
          type: string
          description: >-
            Worth having on a kubelet event, because *which node refused to pull
            this* is the next question.
        count:
          type: integer
          minimum: 0
          description: An event whose count is 47 is a different fact from one that happened once.
        first: { type: string, format: date-time }
        last:
          type: string
          format: date-time
          description: >-
            Both instants, not one: an event repeating for two days is a
            different fact from one that fired forty-seven times in a minute, and
            only the pair says which.
        object:
          type: string
          description: What it is about - `Pod/api-7d9f`, or just the name where the reporter did not say the kind.
        objectField:
          type: string
          description: >-
            `involvedObject.fieldPath` - `spec.containers{istio-proxy}`. On a pod
            with a sidecar it is the difference between *the app failed* and *the
            mesh failed*.

    ObjectPort:
      type: object
      description: >-
        One port an object exposes, in the shape the panel draws and the forward
        request needs.
      required: [port]
      properties:
        name:
          type: string
          description: What the object calls it, where it calls it anything. Unnamed ports are ordinary.
        port: { type: integer, minimum: 1, maximum: 65535 }
        targetPort:
          type: string
          description: >-
            A Service's pod-side port, which is **a number or the name of a
            container port** - a client must not assume the first. Absent on a
            pod's own port.
        nodePort: { type: integer, minimum: 0, maximum: 65535 }
        hostPort: { type: integer, minimum: 0, maximum: 65535 }
        protocol:
          type: string
          description: >-
            `TCP` unless the object says otherwise. **This decides whether the
            forward control is offered at all**: port-forwarding is TCP, and a
            button on a UDP port is one that fails after the click.
        appProtocol:
          type: string
          description: >-
            `spec.ports[].appProtocol` - `https`, `grpc`. A **Service port only**;
            a container port has no such field in the API. Carried because it is
            the one authoritative answer to *does this port speak TLS*, which
            decides whether a forward's link says http or https - and the server
            is what decides, from this.
        container:
          type: string
          description: >-
            Which container declares it. A pod's ports only, and **every
            container's**, init containers included: a mesh sidecar is an init
            container with `restartPolicy: Always`, and it is exactly the thing
            that listens. Carried because the panel lists all of them and two
            containers may each declare the same number - Kubernetes forbids a
            duplicate `hostPort`, not a duplicate `containerPort` - so without
            this a pod with an app and a sidecar both on 8080 is two rows that
            read as one repeated.
        forwardable:
          type: boolean
          description: >-
            Whether this console will open a forward on this port, **answered by
            the server rather than derived from `protocol` by a client**. A rule
            written twice is a rule that will disagree with itself, and the
            client's copy is the one that would say yes to something the server
            then refuses. False, with `reason` saying so, on a cluster marked
            read-only where this console opens the forward itself
            (`capabilities.portForward` true): `openForward` refuses it there.
            Under the server profile the marking leaves it unchanged, because the
            command is run on the viewer's machine.
        reason:
          $ref: '#/components/schemas/Reason'

    ForwardWindowRequest:
      type: object
      additionalProperties: false
      required: [tool]
      properties:
        tool:
          type: string
          enum: [hubble, whisker]
          description: The flow UI the window shows, which names it.
        path:
          type: string
          maxLength: 1024
          description: >-
            The absolute path and query on the forward to open, `/` when absent.
            Never an address: a path naming a host is refused.
        closeWithWindow:
          type: boolean
          description: >-
            The forward was opened for this window: closing the window closes it,
            unless another window shows it.
    ForwardRequest:
      type: object
      additionalProperties: false
      required: [cluster, namespace, remotePort]
      properties:
        cluster: { type: string, maxLength: 253 }
        namespace: { type: string, maxLength: 253 }
        pod:
          type: string
          maxLength: 253
          description: >-
            **Exactly one of `pod` and `service`.** `internal/forward` takes
            either - a Service forward picks a ready pod behind it and says which.
        service:
          type: string
          maxLength: 253
          description: >-
            The other half of the pair above. Forwarding to a Service is the
            common case: it survives the pod being replaced under it, which is
            what a rollout does while somebody is looking at the tunnel.
        remotePort: { type: integer, minimum: 1, maximum: 65535 }
        localPort: { type: integer, minimum: 0, maximum: 65535 }
        portName:
          type: string
          maxLength: 253
          description: >-
            What the object calls that port, if anything. Carried so the server can
            decide the scheme; it takes no part in the identity of a target, because
            two clicks on the same port must still be one tunnel whatever the drawer
            knew about it.
        appProtocol:
          type: string
          maxLength: 253
          description: >-
            The Service's `appProtocol` for that port, if it has one. The first and
            most authoritative of the three tiers behind `Forward.scheme`.
